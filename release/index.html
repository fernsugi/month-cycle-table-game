<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Month Cycle Table</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607;touch-action:none}
    canvas{display:block;width:100vw;height:100vh;background:#050607}
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  "use strict";

  const DESIGN_W = 720;
  const DESIGN_H = 1280;
  const COLORS = [
    { key:"green", code:"G", name:"Bamboo", main:"#20d56b", dim:"#0b6b36" },
    { key:"red", code:"R", name:"Phoenix", main:"#ff3b4f", dim:"#7c1420" },
    { key:"yellow", code:"Y", name:"Golden", main:"#ffd033", dim:"#8d6810" },
    { key:"blue", code:"B", name:"Water", main:"#35b8ff", dim:"#124f88" },
    { key:"black", code:"K", name:"Wind", main:"#d7dbe0", dim:"#4f535a" },
    { key:"white", code:"W", name:"Dragon", main:"#f7f3df", dim:"#9b9279" },
  ];
  const WINDS = ["N", "S", "E", "W"];
  const WIND_NAMES = { E:"East", S:"South", W:"West", N:"North" };
  const WIND_ZH = { E:"東", S:"南", W:"西", N:"北" };
  const SEAT_ORDER = ["E", "S", "W", "N"];
  const MONTH_ZH = ["", "一","二","三","四","五","六","七","八","九","十","十一","十二"];
  const SHEET = { margin:20, gap:10, cw:375, ch:525 };
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d", { alpha:false });

  const assets = { sheet:new Image(), ready:false };
  assets.sheet.onload = () => { assets.ready = true; flash("Cards Ready", "#ffe07b", 30); };
  assets.sheet.onerror = () => flash("Sprite sheet missing: using drawn cards", "#ff6680", 80);
  assets.sheet.src = "all_96_cards_sheet.png";

  let dpr = 1, scale = 1, ox = 0, oy = 0;
  let lastTime = performance.now();
  let pointer = { x:0, y:0, down:false };
  let handHoverBlockedUntil = 0;
  let buttons = [];
  let handRects = [];
  let particles = [];
  let floats = [];
  let ripples = [];
  let shake = 0;
  let audio = null;
  const SFX_GAIN = 1.85;
  const BGM_VOLUME = 1.0;
  const bgm = new Audio("Jade Tile Loop.mp3");
  bgm.loop = true;
  bgm.volume = BGM_VOLUME;
  bgm.addEventListener("loadedmetadata", () => { bgm.volume = BGM_VOLUME; });
  bgm.addEventListener("canplay", () => { bgm.volume = BGM_VOLUME; });
  const HELP_PAGES = [
    {
      title:"The Big Idea",
      lines:[
        "Month Cycle Table is a 4-player draw and discard game.",
        "You are trying to make exactly 6 cards into one winning pattern.",
        "You normally hold 5 cards, then draw to 6 on your turn.",
        "If your 6 cards do not win, tap one hand card to discard."
      ]
    },
    {
      title:"Your Turn",
      lines:[
        "Draw: the game gives you 1 card from the wall.",
        "Check: if your 6 cards make a pattern, you may win.",
        "Discard: if you do not win, tap 1 card to throw away.",
        "Then other players may claim your discard."
      ]
    },
    {
      title:"Cards",
      lines:[
        "Month cards have a number from 1 to 12 and a color.",
        "Each month exists in all 6 colors.",
        "Wind cards are N, S, E, and W, also in all 6 colors.",
        "Wind cards have no month, so they cannot be used in month runs."
      ]
    },
    {
      title:"Reading The Table",
      lines:[
        "Each player has a visible discard pile.",
        "The newest discard glows, because it can often be claimed.",
        "Open cards are shown separately and stay visible.",
        "Watching discards tells you what players are not keeping."
      ]
    },
    {
      title:"Tsumo And Ron",
      lines:[
        "Tsumo means you win after drawing your own winning card.",
        "Ron means someone discards the card that completes your win.",
        "Tsumo is paid by all 3 opponents.",
        "Ron is paid only by the player who discarded."
      ]
    },
    {
      title:"Calls",
      lines:[
        "After a discard, players may call it before the next turn.",
        "Ron has first priority because it wins immediately.",
        "Kan and Pon open matching month or matching wind groups.",
        "Chi simply opens the discard, but only the next player may Chi."
      ]
    },
    {
      title:"Call Priority",
      lines:[
        "Calls are checked in this order: Ron, Kan, Pon, Chi.",
        "Kan opens 5 same-month or same-wind cards.",
        "Pon opens 4 same-month or same-wind cards.",
        "Chi opens exactly 1 card: the discard itself."
      ]
    },
    {
      title:"Gear",
      lines:[
        "Open cards are called gear.",
        "Gear matters because some wins need open cards to be valid.",
        "Chi gives 1 gear. Pon usually gives 4 gear. Kan gives 5 gear.",
        "You can never have more than 5 gear."
      ]
    },
    {
      title:"Auto Discard",
      lines:[
        "When you have 5 gear, your open area is full.",
        "You cannot call more cards because that would exceed the limit.",
        "The game auto-discards for you after draws or calls.",
        "This keeps the hand legal and prevents 6-open-card mistakes."
      ]
    },
    {
      title:"Home Wind",
      lines:[
        "Your seat wind is shown near your name.",
        "If you discard your own wind, you may open 1 hand card.",
        "Tap any hand card to open it, or press Skip.",
        "Use this when you need more gear for a future win."
      ]
    },
    {
      title:"3-Point Wins",
      lines:[
        "These are the entry patterns. They need 3 gear.",
        "Mono: all 6 cards are the same color.",
        "Skip: 6 different months, all odd or all even, all colors different.",
        "Run: 6 different months in order; open Run cards must be consecutive."
      ]
    },
    {
      title:"More 3-Point Wins",
      lines:[
        "Wind: all 6 cards are wind cards, one in each color.",
        "Remember: wind cards have no month.",
        "So wind cards cannot help Skip or Run.",

      ]
    },
    {
      title:"6-Point Wins",
      lines:[
        "These patterns usually look like 3 pairs. They need 2 gear.",

        "Wind Pairs: 3 pairs, each pair from a different wind.",
        "Axis: 2 seat winds plus 4 round target months, or the reverse."
      ]
    },
    {
      title:"More 6-Point Wins",
      lines:[
        "Twin Tone Pairs: 3 month pairs using only 1 or 2 colors.",
        "Parity Pairs: 3 month pairs that are all odd or all even.",

      ]
    },
    {
      title:"9-Point Wins",
      lines:[
        "These patterns usually look like two triples. They need 1 gear.",

        "Grand Axis: 3 seat winds plus 3 round target month cards."
      ]
    },
    {
      title:"More 9-Point Wins",
      lines:[
        "Tri Tone Triples: two month triples using at most 3 colors.",
        "Parity Triples: two month triples, all odd or all even.",

        "With 2 gear it scores 6; with 3 or more it scores 9."
      ]
    },
    {
      title:"12-Point Wins",
      lines:[
        "These can win even with 0 gear, but gear raises their score.",
        "Crown: all 6 cards are the same month, one in each color.",
        "Tempest: all 6 cards are the same non-seat wind.",
        "Escort: 4 of one month plus 2 from a neighboring month."
      ]
    },
    {
      title:"More 12-Point Wins",
      lines:[
        "Split Escort: 4 of one month plus 1 previous and 1 next month.",
        "Compass: same-color N, S, E, W plus a month pair or sequence.",
        "12-point wins score 6 with 0-3 gear.",
        "They score 9 with 4 gear, or 12 with 5 gear."
      ]
    },
    {
      title:"15-Point Wins",
      lines:[
        "These are the premium patterns and can win even with 0 gear.",
        "Mono Skip: one color, and all months are odd or all even.",
        "Mono Run: one color, 6 different months in order.",
        "Grand Crown: all 6 cards are the round target month."
      ]
    },
    {
      title:"More 15-Point Wins",
      lines:[
        "Grand Tempest: all 6 cards are your own seat wind.",
        "Mono Compass: same-color N, S, E, W plus a 2-month sequence.",
        "15-point wins score 9 with 0-3 gear.",
        "They score 12 with 4 gear, or 15 with 5 gear."
      ]
    },
    {
      title:"Bonuses",
      lines:[
        "The popup shows the winning pattern and cards.",
        "If your win contains the round target month, gain +3 points.",
        "If your win contains your own seat wind, gain +3 points.",
        "Both bonuses can happen together."
      ]
    },
    {
      title:"Beginner Plan",
      lines:[
        "First, watch for matching months, matching winds, and same colors.",
        "Open cards only when they help your shape or build gear.",
        "If you see TENPAI, you are one card away from winning.",
        "Tap cards quickly, but read every call popup carefully."
      ]
    },
    {
      title:"Exact Gear Scoring",
      lines:[
        "3pt: needs 3+ gear, scores 3.",
        "6pt: needs 2+ gear. 2 gear scores 3; 3+ gear scores 6.",
        "9pt: needs 1+ gear. 1 gear scores 3; 2 scores 6; 3+ scores 9.",
        "12pt: 0-3 gear scores 6; 4 scores 9; 5 scores 12."
      ]
    },
    {
      title:"Exact Premium Scoring",
      lines:[
        "15pt: 0-3 gear scores 9; 4 gear scores 12; 5 gear scores 15.",
        "Round month bonus adds +3 after gear scoring.",
        "Home wind bonus adds +3 after gear scoring.",
        "Tsumo splits payment across opponents; Ron charges the discarder."
      ]
    }
  ];

  function fitCanvas() {
    dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    scale = Math.min(canvas.width / DESIGN_W, canvas.height / DESIGN_H);
    ox = (canvas.width - DESIGN_W * scale) / 2;
    oy = (canvas.height - DESIGN_H * scale) / 2;
  }
  window.addEventListener("resize", fitCanvas);
  fitCanvas();

  const game = {
    mode:"title",
    round:1,
    sudden:false,
    dealer:0,
    turn:0,
    wall:[],
    lastDiscard:null,
    lastDiscarder:null,
    currentDraw:null,
    players:[],
    message:"Month Cycle Table",
    sub:"Touch to begin",
    awaiting:null,
    claim:null,
    lockUntil:0,
    handNo:0,
    muted:false,
    helpPage:0,
    helpReturn:"title",
    seenTenpai:false,
    lastResults:[],
  };

  function initMatch() {
    game.round = 1;
    game.sudden = false;
    game.dealer = Math.floor(Math.random() * 4);
    game.players = [
      { name:"You", ai:false, points:18 },
      { name:"Akari", ai:true, points:18 },
      { name:"Ren", ai:true, points:18 },
      { name:"Mika", ai:true, points:18 },
    ];
    game.mode = "play";
    startHand();
  }

  function startHand() {
    if (game.mode === "gameOver" || game.mode === "title") return;
    game.handNo++;
    game.wall = shuffle(buildDeck());
    game.lastDiscard = null;
    game.lastDiscarder = null;
    game.currentDraw = null;
    game.claim = null;
    game.awaiting = null;
    game.lastResults = [];
    game.seenTenpai = false;
    for (let i = 0; i < 4; i++) {
      const seat = SEAT_ORDER[(i - game.dealer + 4) % 4];
      Object.assign(game.players[i], {
        seat,
        concealed:[],
        open:[],
        discards:[],
        tenpai:false,
        close:false,
        riichiGlow:false,
      });
    }
    for (let c = 0; c < 5; c++) {
      for (let p = 0; p < 4; p++) game.players[p].concealed.push(game.wall.pop());
    }
    sortHand(game.players[0].concealed);
    game.turn = game.dealer;
    game.mode = "play";
    game.message = "Round " + roundLabel() + " / Dealer " + game.players[game.dealer].name;
    game.sub = WIND_NAMES[game.players[0].seat] + " seat";
    burst(DESIGN_W/2, DESIGN_H/2, "#ffe07b", 64, 3.2);
    playSfx("start");
    setTimeout(() => beginTurn(game.turn), 520);
  }

  function buildDeck() {
    const deck = [];
    for (let ci = 0; ci < COLORS.length; ci++) {
      for (let m = 1; m <= 12; m++) {
        deck.push({ id:`${COLORS[ci].code}${m}`, type:"month", color:ci, month:m, wind:null, col:m-1, row:ci });
      }
      for (let wi = 0; wi < WINDS.length; wi++) {
        const w = WINDS[wi];
        deck.push({ id:`${COLORS[ci].code}${w}`, type:"wind", color:ci, month:null, wind:w, col:12+wi, row:ci });
      }
    }
    return deck;
  }

  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function roundLabel() { return game.sudden ? "Sudden" : String(game.round); }
  function currentRoundMonth() { return game.sudden ? null : game.round; }
  function totalCards(p) { return p.concealed.concat(p.open); }
  function openCount(p) { return p.open.length; }
  function nextPlayer(i) { return (i + 1) % 4; }
  function sortHand(h) {
    h.sort((a,b) => (a.type === b.type ? 0 : a.type === "month" ? -1 : 1) ||
      ((a.month || 20 + WINDS.indexOf(a.wind)) - (b.month || 20 + WINDS.indexOf(b.wind))) ||
      a.color - b.color);
  }

  function beginTurn(pi) {
    if (game.mode === "gameOver") return;
    if (game.wall.length <= 0) return endHandDraw();
    game.turn = pi;
    const p = game.players[pi];
    const card = game.wall.pop();
    p.concealed.push(card);
    sortHand(p.concealed);
    game.currentDraw = card;
    game.message = `${p.name} draws`;
    game.sub = `${game.wall.length} cards in wall`;
    playSfx("draw");
    updateTenpai();

    const win = bestWin(p, totalCards(p), "tsumo");
    if (win) {
      if (p.ai) return delay(() => declareWin([pi], null, "TSUMO", [win]), 760);
      game.awaiting = { type:"tsumo", win };
      game.mode = "userTsumo";
      flash("TSUMO READY", "#fff1a8", 80);
      playSfx("tenpai");
      return;
    }

    const selfKan = possibleSelfKan(p);
    if (p.ai && selfKan && Math.random() < 0.55) {
      return delay(() => claimSelfKan(pi, selfKan), 520);
    }
    if (!p.ai && selfKan) {
      game.awaiting = { type:"selfKan", group:selfKan };
      game.mode = "userTurn";
      flash("KAN READY", "#88d7ff", 45);
      return;
    }

    if (!p.ai) {
      if (openCount(p) >= 5) return delay(() => autoDiscardHuman(), 580);
      game.mode = "userTurn";
      game.message = "Your discard";
      game.sub = p.tenpai ? "TENPAI - choose carefully" : "Tap a card, then Discard";
    } else {
      delay(() => aiDiscard(pi), 650);
    }
  }

  function possibleSelfKan(p) {
    const total = totalCards(p);
    for (const key of groupKeys(total)) {
      const sameTotal = total.filter(c => groupKey(c) === key);
      const sameConcealed = p.concealed.filter(c => groupKey(c) === key);
      if (sameTotal.length === 5 && sameConcealed.length === 5) return key;
    }
    return null;
  }

  function claimSelfKan(pi, key) {
    const p = game.players[pi];
    const moved = removeWhere(p.concealed, c => groupKey(c) === key);
    p.open.push(...moved);
    sortHand(p.open);
    bigCall("SELF KAN", pi, "#77d7ff");
    playSfx("kan");
    if (p.ai) delay(() => aiDiscard(pi), 700);
    else {
      if (p.concealed.length) delay(() => autoDiscardHuman(), 720);
      else advanceTurn();
    }
  }

  function autoDiscardHuman() {
    const p = game.players[0];
    if (!p.concealed.length) return advanceTurn();
    const idx = chooseDiscardIndex(p);
    discardCard(0, idx, true);
  }

  function aiDiscard(pi) {
    const p = game.players[pi];
    if (!p.concealed.length) return advanceTurn();
    discardCard(pi, chooseDiscardIndex(p), false);
  }

  function chooseDiscardIndex(p) {
    let best = -1, bestScore = -Infinity;
    for (let i = 0; i < p.concealed.length; i++) {
      const c = p.concealed[i];
      const after = p.concealed.slice(0, i).concat(p.concealed.slice(i+1), p.open);
      const waits = countWinningDraws(p, after, 18);
      const groups = after.filter(x => groupKey(x) === groupKey(c)).length;
      const colorCount = after.filter(x => x.color === c.color).length;
      let score = waits * 12 - groups * 3 - colorCount * 0.45;
      if (c.type === "wind" && c.wind === p.seat) score += 0.6;
      if (c.type === "month" && c.month === currentRoundMonth()) score += 0.7;
      score += Math.random() * 0.6;
      if (score > bestScore) { bestScore = score; best = i; }
    }
    return Math.max(0, best);
  }

  function discardCard(pi, index, automatic) {
    const p = game.players[pi];
    if (index < 0 || index >= p.concealed.length) return;
    if (pi === 0) handHoverBlockedUntil = performance.now() + 520;
    const card = p.concealed.splice(index, 1)[0];
    p.discards.push(card);
    game.lastDiscard = card;
    game.lastDiscarder = pi;
    game.currentDraw = null;
    game.message = `${p.name} discards ${cardLabel(card)}`;
    game.sub = automatic ? "Auto discard" : "Claims open";
    ripple(discardCenterX(pi), discardCenterY(pi), COLORS[card.color].main);
    playSfx("discard");
    updateTenpai();
    delay(() => resolveClaims(card, pi), 360);
  }

  function resolveClaims(card, discarder) {
    const ron = [];
    const wins = [];
    for (let i = 0; i < 4; i++) {
      if (i === discarder) continue;
      const p = game.players[i];
      const hand = totalCards(p).concat(card);
      const win = bestWin(p, hand, "ron");
      if (win) { ron.push(i); wins.push(win); }
    }
    if (ron.length) {
      if (ron.includes(0)) {
        game.awaiting = { type:"ron", winners:ron, wins, discarder };
        game.mode = "userRon";
        flash("RON AVAILABLE", "#ffec72", 80);
        playSfx("tenpai");
        return;
      }
      return delay(() => declareWin(ron, discarder, "RON", wins), 520);
    }

    if (discarder === 0 && card.type === "wind" && card.wind === game.players[0].seat && game.players[0].concealed.length && openCount(game.players[0]) < 5) {
      game.awaiting = { type:"homeOpen", card, discarder };
      game.mode = "homeOpen";
      game.message = "Home wind opened";
      game.sub = "Open one concealed card or skip";
      return;
    }
    if (card.type === "wind" && game.players[discarder].seat === card.wind && game.players[discarder].ai) {
      const p = game.players[discarder];
      if (p.concealed.length && openCount(p) < 5 && Math.random() < 0.5) {
        const idx = chooseDiscardIndex(p);
        p.open.push(p.concealed.splice(idx, 1)[0]);
        sortHand(p.open);
        bigCall("HOME OPEN", discarder, "#8dfff1");
      }
    }
    resolveMeldClaims(card, discarder);
  }

  function resolveMeldClaims(card, discarder) {
    const options = [];
    for (let i = 0; i < 4; i++) {
      if (i === discarder) continue;
      const p = game.players[i];
      if (openCount(p) >= 5) continue;
      const key = groupKey(card);
      const totalSame = totalCards(p).filter(c => groupKey(c) === key).length;
      if (totalSame === 4 && canTakeClaim(p, "kan", card)) options.push({ player:i, type:"kan", priority:2 });
      if (totalSame === 3 && canTakeClaim(p, "pon", card)) options.push({ player:i, type:"pon", priority:3 });
      if (i === nextPlayer(discarder) && p.concealed.length && canTakeClaim(p, "chi", card)) options.push({ player:i, type:"chi", priority:4 });
    }
    options.sort((a,b) => a.priority - b.priority);
    const userOpts = options.filter(o => o.player === 0);
    if (userOpts.length) {
      game.claim = { card:game.lastDiscard, discarder, options:userOpts, all:options };
      game.mode = "userClaim";
      game.message = "Claim window";
      game.sub = userOpts.map(o => o.type.toUpperCase()).join(" / ");
      playSfx("claim");
      return;
    }
    const ai = options.find(o => shouldAiClaim(o, card));
    if (ai) return delay(() => takeClaim(ai.player, ai.type, card, discarder), 460);
    advanceTurn();
  }

  function shouldAiClaim(opt, card) {
    const p = game.players[opt.player];
    if (!canTakeClaim(p, opt.type, card)) return false;
    if (opt.type === "kan") return true;
    const before = countWinningDraws(p, totalCards(p), 18);
    const state = simulatedClaimState(p, opt.type, card);
    if (!state || state.concealed.length === 0) return opt.type !== "chi";
    let bestAfterDiscard = 0;
    for (let i = 0; i < state.concealed.length; i++) {
      const concealed = state.concealed.slice(0, i).concat(state.concealed.slice(i + 1));
      bestAfterDiscard = Math.max(
        bestAfterDiscard,
        countWinningDraws({ ...p, concealed, open:state.open }, concealed.concat(state.open), 18)
      );
    }
    if (opt.type === "chi") return bestAfterDiscard > before && Math.random() < 0.75;
    if (opt.type === "pon") return bestAfterDiscard >= before || openCount(p) <= 1;
    return false;
  }

  function takeClaim(pi, type, card, discarder) {
    const p = game.players[pi];
    if (!canTakeClaim(p, type, card)) {
      if (pi === 0) flash("Open area full", "#ff6680", 38);
      return advanceTurn();
    }
    const discards = game.players[discarder].discards;
    if (discards[discards.length - 1] === card) discards.pop();
    if (type === "chi") {
      p.open.push(card);
    } else {
      const need = type === "pon" ? 3 : 4;
      const key = groupKey(card);
      const moved = removeWhere(p.concealed, c => groupKey(c) === key);
      p.open.push(...moved, card);
      if (moved.length < need) {
        const short = need - moved.length;
        let taken = 0;
        p.open = p.open.filter(c => {
          if (groupKey(c) === key && c !== card && taken < short) { taken++; return true; }
          return true;
        });
      }
    }
    sortHand(p.open);
    sortHand(p.concealed);
    game.turn = pi;
    bigCall(type.toUpperCase(), pi, type === "kan" ? "#72dbff" : type === "pon" ? "#ff7b96" : "#ffe07b");
    playSfx(type);
    updateTenpai();
    if (pi === 0) {
      game.claim = null;
      if (openCount(p) >= 5) {
        game.mode = "play";
        delay(() => autoDiscardHuman(), 760);
      } else {
        game.mode = "userTurn";
        game.message = `${type.toUpperCase()} taken`;
        game.sub = "Discard one concealed card";
      }
    } else {
      game.claim = null;
      game.mode = "play";
      delay(() => aiDiscard(pi), 760);
    }
  }

  function advanceTurn() {
    game.claim = null;
    game.awaiting = null;
    game.mode = "play";
    if (game.wall.length <= 0) return endHandDraw();
    delay(() => beginTurn(nextPlayer(game.turn)), 520);
  }

  function claimOpenAdds(p, type, card) {
    if (type === "chi") return 1;
    const key = groupKey(card);
    return 1 + p.concealed.filter(c => groupKey(c) === key).length;
  }

  function canTakeClaim(p, type, card) {
    if (!p || openCount(p) >= 5) return false;
    return openCount(p) + claimOpenAdds(p, type, card) <= 5;
  }

  function simulatedClaimState(p, type, card) {
    const concealed = p.concealed.slice();
    const open = p.open.slice();
    if (type === "chi") {
      open.push(card);
    } else {
      const key = groupKey(card);
      for (let i = concealed.length - 1; i >= 0; i--) {
        if (groupKey(concealed[i]) === key) open.push(concealed.splice(i, 1)[0]);
      }
      open.push(card);
    }
    if (open.length > 5) return null;
    return { concealed, open };
  }

  function declareWin(winners, discarder, method, wins) {
    game.mode = "result";
    game.lastResults = [];
    for (let wi = 0; wi < winners.length; wi++) {
      const idx = winners[wi];
      const p = game.players[idx];
      const win = wins[wi] || bestWin(p, totalCards(p), method.toLowerCase());
      let value = win ? win.total : 0;
      if (method === "TSUMO") {
        p.points += value;
        for (let i = 0; i < 4; i++) if (i !== idx) game.players[i].points -= value / 3;
      } else {
        p.points += value;
        game.players[discarder].points -= value;
      }
      const resultCards = method === "RON" && game.lastDiscard
        ? totalCards(p).concat(game.lastDiscard)
        : totalCards(p);
      game.lastResults.push({ player:idx, method, win, value, cards:resultCards.slice(0, 6) });
      bigCall(method, idx, method === "TSUMO" ? "#fff1a8" : "#ff4f73", true);
      burst(DESIGN_W/2, DESIGN_H/2, method === "TSUMO" ? "#fff1a8" : "#ff4f73", 160, 6);
    }
    playSfx("win");
    const eastWon = winners.some(i => game.players[i].seat === "E");
    if (!eastWon) game.dealer = nextPlayer(game.dealer);
    game.message = game.lastResults.map(r => `${game.players[r.player].name} ${r.method} ${r.value}`).join("  ");
    game.sub = game.lastResults.map(r => r.win ? r.win.name : "").join(" / ");
  }

  function endHandDraw() {
    game.mode = "result";
    game.message = "Exhaustive Draw";
    game.sub = "No score";
    game.dealer = nextPlayer(game.dealer);
    flash("DRAW", "#d7dbe0", 100);
    playSfx("draw");
  }

  function afterHand(dealNow = false) {
    const busted = game.players.some(p => p.points <= 0);
    if (busted || (game.round >= 12 && !game.sudden && soleLeader())) return endMatch();
    if (game.round >= 12 && !game.sudden) game.sudden = true;
    else if (!game.sudden) game.round++;
    if (dealNow) {
      game.mode = "play";
      startHand();
      return;
    }
    game.mode = "between";
    game.message = "Next Hand";
    game.sub = "Deal next hand";
  }

  function soleLeader() {
    const high = Math.max(...game.players.map(p => p.points));
    return game.players.filter(p => p.points === high).length === 1;
  }

  function endMatch() {
    game.mode = "gameOver";
    const sorted = game.players.slice().sort((a,b) => b.points - a.points);
    game.message = `${sorted[0].name} wins the match`;
    game.sub = game.players.map(p => `${p.name} ${p.points}`).join("  ");
    playSfx(sorted[0].ai ? "draw" : "win");
  }

  function bestWin(player, cards, method) {
    if (cards.length !== 6) return null;
    const open = openCount(player);
    const patterns = findPatterns(player, cards).map(p => applyGear(p, open)).filter(Boolean);
    if (!patterns.length) return null;
    patterns.sort((a,b) => b.score - a.score || b.base - a.base);
    const best = patterns[0];
    let bonus = 0;
    if (currentRoundMonth() && cards.some(c => c.month === currentRoundMonth())) bonus += 3;
    if (cards.some(c => c.wind === player.seat)) bonus += 3;
    return { ...best, bonus, total:best.score + bonus, method };
  }

  function applyGear(p, open) {
    let score = null;
    if (p.base === 3) score = open >= 3 ? 3 : null;
    if (p.base === 6) score = open >= 2 ? (open === 2 ? 3 : 6) : null;
    if (p.base === 9) score = open >= 1 ? (open === 1 ? 3 : open === 2 ? 6 : 9) : null;
    if (p.base === 12) score = open <= 3 ? 6 : open === 4 ? 9 : 12;
    if (p.base === 15) score = open <= 3 ? 9 : open === 4 ? 12 : 15;
    if (score == null) return null;
    return { ...p, score };
  }

  function findPatterns(player, cards) {
    const out = [];
    const months = cards.filter(c => c.type === "month");
    const winds = cards.filter(c => c.type === "wind");
    const colors = new Set(cards.map(c => c.color));
    const round = currentRoundMonth();
    const seat = player.seat;
    const monthCounts = counts(months.map(c => c.month));
    const windCounts = counts(winds.map(c => c.wind));
    const mVals = Object.keys(monthCounts).map(Number).sort((a,b)=>a-b);
    const wVals = Object.keys(windCounts);
    const allMonths = months.length === 6;
    const allWinds = winds.length === 6;
    const allColors = colors.size === 6;
    const allSameColor = colors.size === 1;
    const pairCounts = vals(monthCounts).sort((a,b)=>a-b).join(",");
    const windPairCounts = vals(windCounts).sort((a,b)=>a-b).join(",");
    const openMonths = player.open.filter(c => cards.includes(c) && c.type === "month").map(c => c.month);

    if (allSameColor) out.push({ name:"Mono", base:3 });
    if (allMonths && mVals.length === 6 && allColors && sameParity(mVals)) out.push({ name:"Skip", base:3 });
    if (allMonths && mVals.length === 6 && consecutive(mVals) && openRunOkay(openMonths)) out.push({ name:"Run", base:3 });
    if (allWinds && allColors) out.push({ name:"Wind", base:3 });

    if (allMonths && pairCounts === "2,2,2" && consecutive(mVals)) out.push({ name:"Triple Pair", base:6 });
    if (allWinds && windPairCounts === "2,2,2" && wVals.length === 3) out.push({ name:"Wind Pairs", base:6 });
    if (round && axisCounts(cards, seat, round, 2, 4)) out.push({ name:"Axis", base:6 });
    if (allMonths && pairCounts === "2,2,2" && mVals.length === 3 && colors.size <= 2) out.push({ name:"Twin Tone Pairs", base:6 });
    if (allMonths && pairCounts === "2,2,2" && sameParity(mVals)) out.push({ name:"Parity Pairs", base:6 });

    if (allMonths && pairCounts === "3,3" && consecutive(mVals)) out.push({ name:"Twin Triples", base:9 });
    if (allWinds && windPairCounts === "3,3" && wVals.length === 2) out.push({ name:"Wind Triples", base:9 });
    if (round && axisCounts(cards, seat, round, 3, 3)) out.push({ name:"Grand Axis", base:9 });
    if (allMonths && pairCounts === "3,3" && colors.size <= 3) out.push({ name:"Tri Tone Triples", base:9 });
    if (allMonths && pairCounts === "3,3" && sameParity(mVals)) out.push({ name:"Parity Triples", base:9 });

    if (allMonths && allColors && (pairCounts === "6" || crownFiveOne(monthCounts))) out.push({ name:"Crown", base:12 });
    if (allWinds && wVals.length === 1 && wVals[0] !== seat) out.push({ name:"Tempest", base:12 });
    if (allMonths && allColors && escort(monthCounts)) out.push({ name:"Escort", base:12 });
    if (allMonths && allColors && splitEscort(monthCounts)) out.push({ name:"Split Escort", base:12 });
    if (compass(cards, false)) out.push({ name:"Compass", base:12 });

    if (allMonths && allSameColor && mVals.length === 6 && sameParity(mVals)) out.push({ name:"Mono Skip", base:15 });
    if (allMonths && allSameColor && mVals.length === 6 && consecutive(mVals)) out.push({ name:"Mono Run", base:15 });
    if (round && allMonths && mVals.length === 1 && mVals[0] === round) out.push({ name:"Grand Crown", base:15 });
    if (allWinds && wVals.length === 1 && wVals[0] === seat) out.push({ name:"Grand Tempest", base:15 });
    if (compass(cards, true)) out.push({ name:"Mono Compass", base:15 });
    return out;
  }

  function counts(arr) { const o = {}; for (const x of arr) o[x] = (o[x] || 0) + 1; return o; }
  function vals(o) { return Object.keys(o).map(k => o[k]); }
  function sameParity(a) { return a.length && a.every(x => x % 2 === a[0] % 2); }
  function consecutive(a) { if (!a.length) return false; for (let i=1;i<a.length;i++) if (a[i] !== a[i-1] + 1) return false; return true; }
  function openRunOkay(openMonths) { return openMonths.length <= 1 || consecutive([...new Set(openMonths)].sort((a,b)=>a-b)); }
  function crownFiveOne(mc) {
    const e = Object.entries(mc).map(([m,c]) => [Number(m), c]);
    if (e.length !== 2) return false;
    const five = e.find(x => x[1] === 5), one = e.find(x => x[1] === 1);
    return !!five && !!one && Math.abs(five[0] - one[0]) === 1;
  }
  function escort(mc) {
    const e = Object.entries(mc).map(([m,c]) => [Number(m), c]).sort((a,b)=>b[1]-a[1]);
    return e.length === 2 && e[0][1] === 4 && e[1][1] === 2 && Math.abs(e[0][0] - e[1][0]) === 1;
  }
  function splitEscort(mc) {
    const e = Object.entries(mc).map(([m,c]) => [Number(m), c]);
    if (e.length !== 3) return false;
    const core = e.find(x => x[1] === 4);
    const singles = e.filter(x => x[1] === 1).map(x => x[0]).sort((a,b)=>a-b);
    return !!core && singles.length === 2 && singles[0] === core[0] - 1 && singles[1] === core[0] + 1;
  }
  function axisCounts(cards, seat, round, a, b) {
    let sw = 0, rm = 0, other = 0;
    for (const c of cards) {
      if (c.wind === seat) sw++;
      else if (c.month === round) rm++;
      else other++;
    }
    return other === 0 && ((sw === a && rm === b) || (sw === b && rm === a));
  }
  function compass(cards, mono) {
    for (let color = 0; color < COLORS.length; color++) {
      const windSet = new Set(cards.filter(c => c.type === "wind" && c.color === color).map(c => c.wind));
      if (!WINDS.every(w => windSet.has(w))) continue;
      const rest = cards.filter(c => !(c.type === "wind" && c.color === color));
      if (rest.length !== 2 || rest.some(c => c.type !== "month")) continue;
      if (mono && rest.some(c => c.color !== color)) continue;
      if (rest[0].month === rest[1].month || Math.abs(rest[0].month - rest[1].month) === 1) return true;
    }
    return false;
  }

  function countWinningDraws(player, fiveCards, max) {
    let n = 0;
    const seen = new Set(fiveCards.map(c => c.id));
    for (const c of buildDeck()) {
      if (seen.has(c.id)) continue;
      if (bestWin(player, fiveCards.concat(c), "draw")) n++;
      if (n >= max) return n;
    }
    return n;
  }

  function updateTenpai() {
    for (const p of game.players) {
      if (totalCards(p).length === 5) {
        const waits = countWinningDraws(p, totalCards(p), 30);
        p.tenpai = waits > 0;
        p.close = waits > 0 || nearShape(p);
      } else {
        p.tenpai = false;
        p.close = nearShape(p);
      }
    }
    const human = game.players[0];
    if (human.tenpai && !game.seenTenpai) {
      game.seenTenpai = true;
      flash("TENPAI", "#ffec72", 115);
      burst(DESIGN_W/2, 940, "#ffec72", 80, 4);
      playSfx("tenpai");
    }
  }

  function nearShape(p) {
    const cards = totalCards(p);
    const m = counts(cards.filter(c => c.month).map(c => c.month));
    const w = counts(cards.filter(c => c.wind).map(c => c.wind));
    return vals(m).some(v => v >= 3) || vals(w).some(v => v >= 3) ||
      new Set(cards.map(c => c.color)).size <= 2;
  }

  function groupKey(c) { return c.type === "month" ? `m${c.month}` : `w${c.wind}`; }
  function groupKeys(cards) { return [...new Set(cards.map(groupKey))]; }
  function removeWhere(arr, pred) {
    const out = [];
    for (let i = arr.length - 1; i >= 0; i--) if (pred(arr[i])) out.push(arr.splice(i,1)[0]);
    return out.reverse();
  }
  function cardLabel(c) { return c.type === "month" ? `${COLORS[c.color].code}${c.month}` : `${COLORS[c.color].code}${c.wind}`; }

  function delay(fn, ms) { game.lockUntil = performance.now() + ms; setTimeout(fn, ms); }

  function flash(text, color, life) {
    floats.push({ text, x:DESIGN_W/2, y:DESIGN_H/2, vy:-0.45, life, max:life, size:42, color, align:"center" });
  }

  function bigCall(text, pi, color, win) {
    const pos = playerAnchor(pi);
    floats.push({ text, x:pos.x, y:pos.y, vy:-0.25, life:win ? 130 : 76, max:win ? 130 : 76, size:win ? 74 : 54, color, align:"center" });
    burst(pos.x, pos.y, color, win ? 130 : 58, win ? 5.8 : 3.4);
    shake = win ? 18 : 8;
  }

  function burst(x,y,color,count,power) {
    for (let i=0;i<count;i++) {
      const a = Math.random() * Math.PI * 2;
      const s = (0.6 + Math.random() * power);
      particles.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:40+Math.random()*45, max:85, color, r:1.5+Math.random()*3.8 });
    }
  }
  function ripple(x,y,color) { ripples.push({ x,y,r:8,life:42,max:42,color }); }
  function clickSpark(x, y) {
    ripples.push({ x, y, r:4, life:24, max:24, color:"#fff1a8" });
    burst(x, y, "#8dfff1", 14, 1.9);
  }

  function ensureAudio() {
    if (game.muted) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!audio && AC) audio = new AC();
    syncBgm();
  }
  function syncBgm() {
    bgm.volume = BGM_VOLUME;
    if (game.muted) {
      bgm.pause();
      return;
    }
    bgm.volume = BGM_VOLUME;
    bgm.play().catch(() => {});
  }
  function tone(freq, dur, type, gain, at) {
    if (!audio || game.muted) return;
    const t = audio.currentTime + (at || 0);
    const osc = audio.createOscillator();
    const g = audio.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.min(0.22, (gain || 0.08) * SFX_GAIN), t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(audio.destination);
    osc.start(t);
    osc.stop(t + dur + 0.04);
  }
  function playSfx(name) {
    ensureAudio();
    if (!audio || game.muted) return;
    if (name === "discard") { tone(180, .08, "triangle", .045); tone(95, .06, "sine", .04, .03); }
    else if (name === "chi") { tone(440,.12,"sine",.07); tone(660,.16,"sine",.05,.08); }
    else if (name === "pon") { tone(220,.08,"square",.06); tone(330,.12,"square",.04,.06); }
    else if (name === "kan") { tone(130,.18,"sawtooth",.08); tone(520,.22,"triangle",.05,.08); }
    else if (name === "tenpai") { tone(660,.12,"sine",.07); tone(990,.18,"sine",.06,.09); tone(1320,.18,"triangle",.04,.18); }
    else if (name === "win") { [392,523,659,784,1046].forEach((f,i)=>tone(f,.28,"triangle",.09,i*.075)); }
    else if (name === "start") { [196,294,392].forEach((f,i)=>tone(f,.16,"sine",.06,i*.08)); }
    else if (name === "draw") { tone(330,.09,"triangle",.045); tone(495,.14,"sine",.035,.055); }
    else if (name === "claim") { tone(720,.08,"triangle",.05); }
    else if (name === "button") { tone(620,.045,"triangle",.04); tone(930,.065,"sine",.03,.035); }
  }

  function draw(now) {
    const dt = Math.min(32, now - lastTime);
    lastTime = now;
    updateFx(dt);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = "#050607";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.setTransform(scale,0,0,scale,ox + (Math.random()-.5)*shake, oy + (Math.random()-.5)*shake);
    renderBoard(now);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  function updateFx(dt) {
    const f = dt / 16.67;
    shake *= Math.pow(0.86, f);
    for (const p of particles) { p.x += p.vx*f; p.y += p.vy*f; p.vx *= .985; p.vy *= .985; p.vy += .025*f; p.life -= f; }
    particles = particles.filter(p => p.life > 0);
    for (const fl of floats) { fl.y += fl.vy*f; fl.life -= f; }
    floats = floats.filter(fl => fl.life > 0);
    for (const r of ripples) { r.r += 5.2*f; r.life -= f; }
    ripples = ripples.filter(r => r.life > 0);
  }

  function renderBoard(now) {
    buttons = [];
    handRects = [];
    background(now);
    if (game.mode === "title") return renderTitle(now);
    if (game.mode === "help") return renderHelp(now);
    table(now);
    renderCenterStatus(now);
    for (let i=0;i<4;i++) renderPlayer(i, now);
    renderDiscards();
    renderOpenAreas();
    renderHumanHand(now);
    renderHud(now);
    renderPrompts(now);
    drawGameUtilityButtons();
    renderFx();
  }

  function background(now) {
    const grd = ctx.createLinearGradient(0,0,0,DESIGN_H);
    grd.addColorStop(0,"#071015");
    grd.addColorStop(.42,"#11171b");
    grd.addColorStop(1,"#080609");
    ctx.fillStyle = grd;
    ctx.fillRect(0,0,DESIGN_W,DESIGN_H);
    ctx.save();
    ctx.globalAlpha = .22;
    for (let y=-80;y<DESIGN_H+100;y+=46) {
      ctx.strokeStyle = y % 92 ? "#29343a" : "#caa84a";
      ctx.lineWidth = y % 92 ? 1 : 1.6;
      ctx.beginPath();
      for (let x=-20;x<DESIGN_W+30;x+=24) {
        const yy = y + Math.sin((x + now*.025) / 42) * 7;
        if (x === -20) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function table(now) {
    ctx.save();

    g.addColorStop(0,"rgba(232,190,88,.32)");

    roundedRect(-315,-315,630,630,42);
    ctx.fill();

    roundedRect(-305,-305,610,610,38);
    ctx.stroke();

    ctx.lineWidth = 1;
    for (let r=80;r<=280;r+=50) {
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
    }
    ctx.rotate(Math.PI/4);
    ctx.strokeStyle = "rgba(255,224,123,.22)";
    ctx.strokeRect(-170,-170,340,340);
    ctx.restore();
  }

  function renderTitle(now) {

  function renderHelp(now) {
    table(now);

    }

    ctx.restore();

    drawIconButton(620, 158, 44, "x", "helpClose", "#ff8aa0");
    drawButton(104, 990, 150, 58, "PREV", "#8dfff1", "helpPrev");
    drawButton(466, 990, 150, 58, "NEXT", "#ffe07b", "helpNext");
    renderFx();
  }

  function wrapText(text, x, y, maxWidth, lineHeight) {
    const words = text.split(" ");
    let line = "";
    for (const word of words) {
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        ctx.fillText(line, x, y);
        line = word;
        y += lineHeight;
      } else {
        line = test;
      }
    }

  function renderFx() {
    ctx.save();
    for (const r of ripples) {
      ctx.globalAlpha = Math.max(0, r.life/r.max) * .8;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2); ctx.stroke();
    }
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life/p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    for (const f of floats) {
      ctx.globalAlpha = Math.max(0, f.life/f.max);
      ctx.textAlign = f.align || "center";
      ctx.font = `900 ${f.size}px Georgia,serif`;
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 24;
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.restore();

  function drawCard(card, x,y,w,h,rot,faceUp,alpha) {
    ctx.save();
    ctx.globalAlpha *= alpha == null ? 1 : alpha;
    ctx.translate(x+w/2,y+h/2);
    if (rot) ctx.rotate(rot);
    ctx.translate(-w/2,-h/2);
    if (!faceUp) drawBack(0,0,w,h,0);
    else if (assets.ready) {
      const sx = SHEET.margin + card.col * (SHEET.cw + SHEET.gap);
      const sy = SHEET.margin + card.row * (SHEET.ch + SHEET.gap);
      ctx.drawImage(assets.sheet, sx, sy, SHEET.cw, SHEET.ch, 0, 0, w, h);
    } else {
      fallbackCard(card, 0,0,w,h);
    }
    ctx.restore();
  }

  function fallbackCard(card,x,y,w,h) {
    const col = COLORS[card.color];
    ctx.fillStyle = "#10171c"; roundedRect(x,y,w,h,8); ctx.fill();
    ctx.strokeStyle = col.main; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = col.main; ctx.font = `900 ${Math.max(18,w*.36)}px Georgia,serif`; ctx.textAlign = "center";
    ctx.fillText(card.type === "month" ? card.month : card.wind, x+w/2, y+h*.45);

    ctx.fillText(col.code, x+w/2, y+h*.68);
  }

  function drawBack(x,y,w,h,rot) {
    ctx.save();
    ctx.translate(x+w/2,y+h/2);
    if (rot) ctx.rotate(rot);
    ctx.translate(-w/2,-h/2);
    const g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,"#1d2830");
    g.addColorStop(.55,"#081015");
    g.addColorStop(1,"#3a2418");
    ctx.fillStyle = g;
    roundedRect(0,0,w,h,8);
    ctx.fill();
    ctx.strokeStyle = "#d4a953";
    ctx.lineWidth = Math.max(1,w*.025);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.16)";
    for (let i=0;i<4;i++) {
      ctx.beginPath();
      ctx.moveTo(w*.2+i*w*.15, h*.15);
      ctx.lineTo(w*.8-i*w*.1, h*.85);
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(255,224,123,.65)";
    ctx.font = `900 ${Math.max(10,w*.18)}px Georgia,serif`;
    ctx.textAlign = "center";
    ctx.fillText("MCT", w/2, h*.55);
    ctx.restore();
  }

  function roundedRect(x,y,w,h,r) {
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function playerAnchor(i) {
    if (i === 0) return { x:DESIGN_W/2, y:1090, nameY:1004, handX:0, handY:0, handGap:0, cw:0, ch:0, rot:0 };
    if (i === 1) return { x:650, y:610, nameY:555, handX:535, handY:594, handGap:16, cw:42, ch:59, rot:Math.PI/2 };
    if (i === 2) return { x:DESIGN_W/2, y:142, nameY:116, handX:268, handY:132, handGap:38, cw:42, ch:59, rot:Math.PI };
    return { x:70, y:610, nameY:555, handX:69, handY:594, handGap:16, cw:42, ch:59, rot:-Math.PI/2 };
  }
  function discardZone(i) {
    if (i === 0) return { x:194, y:812, w:332, h:126, cardW:42, cardH:59, step:18, stack:4 };
    if (i === 1) return { x:530, y:385, w:126, h:196, cardW:39, cardH:55, step:17, stack:8 };
    if (i === 2) return { x:194, y:220, w:332, h:126, cardW:42, cardH:59, step:18, stack:4 };
    return { x:63, y:385, w:126, h:196, cardW:39, cardH:55, step:17, stack:8 };
  }
  function openZone(i) {
    if (i === 0) return { x:42, y:914, cardW:45, cardH:63, step:24 };
    if (i === 1) return { x:527, y:660, cardW:40, cardH:56, step:20 };
    if (i === 2) return { x:42, y:156, cardW:40, cardH:56, step:22 };
    return { x:65, y:660, cardW:40, cardH:56, step:20 };
  }
  function discardCenterX(i) { const z = discardZone(i); return z.x + z.w/2; }
  function discardCenterY(i) { const z = discardZone(i); return z.y + z.h/2; }

  function toGamePoint(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) * dpr;
    const cy = (e.clientY - rect.top) * dpr;
    return { x:(cx - ox) / scale, y:(cy - oy) / scale };
  }
  function pointerDown(e) {
    e.preventDefault();
    ensureAudio();
    const p = toGamePoint(e.touches ? e.touches[0] : e);
    pointer.x = p.x; pointer.y = p.y; pointer.down = true;
  }
  function pointerMove(e) {
    const p = toGamePoint(e.touches ? e.touches[0] : e);
    pointer.x = p.x; pointer.y = p.y;
  }
  function pointerUp(e) {
    e.preventDefault();
    const p = toGamePoint(e.changedTouches ? e.changedTouches[0] : e);
    pointer.x = p.x; pointer.y = p.y; pointer.down = false;
    clickSpark(p.x, p.y);
    handleTap(p.x, p.y);
  }
  canvas.addEventListener("mousedown", pointerDown);
  canvas.addEventListener("mousemove", pointerMove);
  canvas.addEventListener("mouseup", pointerUp);
  canvas.addEventListener("touchstart", pointerDown, { passive:false });
  canvas.addEventListener("touchmove", pointerMove, { passive:false });
  canvas.addEventListener("touchend", pointerUp, { passive:false });

  function handleTap(x,y) {
    if (performance.now() < game.lockUntil) return;
    for (const b of buttons) {
      if (x >= b.x && x <= b.x+b.w && y >= b.y && y <= b.y+b.h) {
        playSfx("button");
        return action(b.action);
      }
    }
    if (game.mode === "between") return startHand();
    if (game.mode === "homeOpen") {
      for (const r of handRects) {
        if (x >= r.x && x <= r.x+r.w && y >= r.y && y <= r.y+r.h) {
          playSfx("button");
          return homeOpenCard(r.index);
        }
      }
    }
    if (game.mode === "userTurn") {
      for (const r of handRects) {
        if (x >= r.x && x <= r.x+r.w && y >= r.y && y <= r.y+r.h) {
          playSfx("button");
          return discardCard(0, r.index, false);
        }
      }
    }
  }

  function action(a) {
    if (a === "sound") {
      game.muted = !game.muted;
      syncBgm();
      if (!game.muted) playSfx("claim");
      return;
    }
    if (a === "help") {
      game.helpReturn = game.mode;
      game.helpPage = 0;
      game.mode = "help";
      return;
    }
    if (a === "helpClose") {
      game.mode = game.helpReturn || "title";
      return;
    }
    if (a === "helpPrev") {
      game.helpPage = (game.helpPage + HELP_PAGES.length - 1) % HELP_PAGES.length;
      playSfx("claim");
      return;
    }
    if (a === "helpNext") {
      game.helpPage = (game.helpPage + 1) % HELP_PAGES.length;
      playSfx("claim");
      return;
    }
    if (a === "home") {
      game.mode = "title";
      game.message = "Month Cycle Table";
      game.sub = "Touch to begin";
      return;
    }
    if (a === "start") return initMatch();
    if (a === "restart") return initMatch();
    if (a === "next") return game.mode === "result" ? afterHand(true) : startHand();
    if (a === "selfKan") return claimSelfKan(0, game.awaiting.group);
    if (a === "tsumo" && game.awaiting) return declareWin([0], null, "TSUMO", [game.awaiting.win]);
    if (a === "passTsumo") {
      game.awaiting = null;
      game.mode = "userTurn";
      game.message = "Tsumo passed";
      game.sub = "Discard one card";
      return;
    }
    if (a === "ron" && game.awaiting) {
      return declareWin(game.awaiting.winners, game.awaiting.discarder, "RON", game.awaiting.wins);
    }
    if (a === "passRon") {
      const other = game.awaiting.winners.filter(i => i !== 0);
      const wins = game.awaiting.winners.map((w,i)=>({w, win:game.awaiting.wins[i]})).filter(x=>x.w!==0);
      game.awaiting = null;
      if (other.length) return declareWin(other, game.lastDiscarder, "RON", wins.map(x=>x.win));
      return resolveMeldClaims(game.lastDiscard, game.lastDiscarder);
    }
    if (a.startsWith("claim:") && game.claim) return takeClaim(0, a.split(":")[1], game.claim.card, game.claim.discarder);
    if (a === "passClaim") {
      if (!game.claim) return advanceTurn();
      const opts = game.claim.all.filter(o => o.player !== 0);
      const ai = opts.find(o => shouldAiClaim(o, game.claim.card));
      const card = game.claim.card, discarder = game.claim.discarder;
      game.claim = null;
      if (ai) return takeClaim(ai.player, ai.type, card, discarder);
      return advanceTurn();
    }
    if (a === "homeSkip") {
      game.awaiting = null;
      return resolveMeldClaims(game.lastDiscard, game.lastDiscarder);
    }
  }

  function homeOpenCard(index) {
    const p = game.players[0];
    if (!p || openCount(p) >= 5 || index < 0 || index >= p.concealed.length) {
      game.awaiting = null;
      return resolveMeldClaims(game.lastDiscard, game.lastDiscarder);
    }
    handHoverBlockedUntil = performance.now() + 420;
    p.open.push(p.concealed.splice(index, 1)[0]);
    sortHand(p.open);
    bigCall("HOME OPEN", 0, "#ffe07b");
    playSfx("chi");
    game.awaiting = null;
    return resolveMeldClaims(game.lastDiscard, game.lastDiscarder);
  }
})();
</script>
