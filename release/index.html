<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Month Cycle Table</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607;touch-action:none}
    canvas{display:block;width:100vw;height:100vh;background:#050607}
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  "use strict";

  const DESIGN_W = 720;
  const DESIGN_H = 1280;
  const RESULT_MODAL_DELAY = 1000;
  const RESULT_LINE_DELAY = 500;
  const RESULT_LINE_INTERVAL = 500;
  const RESULT_FINAL_DELAY = 420;
  const RESULT_QUEUE_DELAY = 950;
  const COLORS = [
    { key:"green", code:"G", name:"Bamboo", main:"#20d56b", dim:"#0b6b36" },
    { key:"red", code:"R", name:"Phoenix", main:"#ff3b4f", dim:"#7c1420" },
    { key:"yellow", code:"Y", name:"Golden", main:"#ffd033", dim:"#8d6810" },
    { key:"blue", code:"B", name:"Water", main:"#35b8ff", dim:"#124f88" },
    { key:"black", code:"K", name:"Wind", main:"#d7dbe0", dim:"#4f535a" },
    { key:"white", code:"W", name:"Dragon", main:"#f7f3df", dim:"#9b9279" },
  ];
  const WINDS = ["N", "S", "E", "W"];
  const WIND_NAMES = { E:"East", S:"South", W:"West", N:"North" };
  const WIND_ZH = { E:"東", S:"南", W:"西", N:"北" };
  const SEAT_ORDER = ["E", "S", "W", "N"];
  const MONTH_ZH = ["", "一","二","三","四","五","六","七","八","九","十","十一","十二"];
  const SHEET = { margin:20, gap:10, cw:375, ch:525 };
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d", { alpha:false });
  configureCanvasQuality(ctx);
  let deckTemplate = null;
  const openPromiseCache = new Map();
  const findPatternCache = new Map();
  const bestWinCache = new Map();
  let backgroundLayer = null;
  let tableLayer = null;

  const assets = { sheet:new Image(), ready:false };
  assets.sheet.onload = () => { assets.ready = true; };
  assets.sheet.onerror = () => flash("Sprite sheet missing: using drawn cards", "#ff6680", 80);
  assets.sheet.src = "all_96_cards_sheet.png";

  let dpr = 1, scale = 1, ox = 0, oy = 0;
  let lastTime = performance.now();
  let frameNow = 0;
  let pointer = { x:0, y:0, down:false, kind:"mouse", downAt:0 };
  let handHoverBlockedUntil = 0;
  let discardHint = { card:null, until:0, candidate:null, since:0 };
  let buttons = [];
  let handRects = [];
  let particles = [];
  let floats = [];
  let ripples = [];
  let shake = 0;
  let audio = null;
  const SFX_GAIN = 1.85;
  const BGM_VOLUME = 1.0;
  const bgm = new Audio("Jade Tile Loop.mp3");
  bgm.loop = true;
  bgm.volume = BGM_VOLUME;
  bgm.addEventListener("loadedmetadata", () => { bgm.volume = BGM_VOLUME; });
  bgm.addEventListener("canplay", () => { bgm.volume = BGM_VOLUME; });
  const HELP_PAGES = [
    {
      title:"The Big Idea",
      lines:[
        "Month Cycle Table is a 4-player draw and discard game.",
        "You are trying to make exactly 6 cards into winning patterns.",
        "You normally hold 5 cards, then draw to 6 on your turn.",
        "If your 6 cards do not win, tap one hand card to discard."
      ]
    },
    {
      title:"Your Turn",
      lines:[
        "Draw: the game gives you 1 card from the wall.",
        "Check: if your 6 cards make a pattern, you may win.",
        "Discard: if you do not win, tap 1 card to throw away.",
        "Then other players may claim your discard."
      ]
    },
    {
      title:"Cards",
      lines:[
        "Month cards have a number from 1 to 12 and a color.",
        "Each month exists in all 6 colors.",
        "Wind cards are N, S, E, and W, also in all 6 colors.",
        "Wind cards have no month, so they cannot be used in month runs."
      ]
    },
    {
      title:"Reading The Table",
      lines:[
        "Each player has a visible discard pile.",
        "The newest discard glows, because it can often be claimed.",
        "Open cards are shown separately and stay visible.",
        "Watching discards tells you what players are not keeping."
      ]
    },
    {
      title:"Tsumo And Ron",
      lines:[
        "Tsumo means you win after drawing your own winning card.",
        "Ron means someone discards the card that completes your win.",
        "Tsumo adds 3 points: 1 paid by each opponent.",
        "Ron is paid only by the player who discarded."
      ]
    },
    {
      title:"Calls",
      lines:[
        "After a discard, players may call it before the next turn.",
        "Ron has first priority because it wins immediately.",
        "Kan and Pon open matching month or matching wind groups.",
        "Chi simply opens the discard, but only the next player may Chi."
      ]
    },
    {
      title:"Call Priority",
      lines:[
        "Calls are checked in this order: Ron, Kan, Pon, Chi.",
        "Kan opens 5 same-month or same-wind cards.",
        "Pon opens 4 same-month or same-wind cards.",
        "Chi opens exactly 1 card: the discard itself."
      ]
    },
    {
      title:"Gear",
      lines:[
        "Open cards are called gear.",
        "Gear matters because some wins need open cards to be valid.",
        "Chi gives 1 gear. Pon usually gives 4 gear. Kan gives 5 gear.",
        "You can never have more than 5 gear."
      ]
    },
    {
      title:"Auto Discard",
      lines:[
        "When you have 5 gear, your open area is full.",
        "You cannot call more cards because that would exceed the limit.",
        "The game auto-discards for you after draws or calls.",
        "This keeps the hand legal and prevents 6-open-card mistakes."
      ]
    },
    {
      title:"Home Wind / Matching Card",
      lines:[
        "Your seat wind is shown on the table header.",
        "If you discard your own wind, you may open 1 hand card.",
        "If you discard a card and still hold the same month or wind, you may open that matching card.",
        "Use this when you need more gear for a future win."
      ]
    },
    {
      title:"3-Point Wins",
      lines:[
        "These are the entry patterns. They need 3 gear.",
        "Mono: all 6 cards are the same color.",
        "Skip: 6 different months, all odd or all even, all colors different.",
        "Run: 6 consecutive months, all different colors."
      ]
    },
    {
      title:"More 3-Point Wins",
      lines:[
        "Wind: all 6 cards are wind cards, all different colors.",
        "Cross: month 1, month 12, and N, S, E, W, all different colors.",
        "Rainbow and Prism apply only to Skip, Run, and Cross — see Winning Bonuses later in this guide.",
        "These 3-point wins are simple, but you must build gear first."
      ]
    },
    {
      title:"6-Point Wins",
      lines:[
        "These patterns usually look like 3 pairs. They need 3 gear.",
        "Triple Pair: 3 month pairs, and the months are consecutive.",
        "Wind Pairs: 3 pairs, each pair from a different wind.",
        "Axis: 2 seat winds plus 4 round target months, or the reverse."
      ]
    },
    {
      title:"More 6-Point Wins",
      lines:[
        "Twin Tone Pairs: 3 month-or-wind pairs using only 2 colors.",
        "Parity Pairs: 3 month pairs that are all odd or all even.",
        "With 3 gear, a 6-point pattern scores 3.",
        "With 4 or more gear, it scores the full 6."
      ]
    },
    {
      title:"9-Point Wins",
      lines:[
        "These patterns usually look like two triples. They need 3 gear.",
        "Twin Triples: 3 of one month and 3 of a neighbor month.",
        "Wind Triples: 3 of one wind and 3 of another wind.",
        "Grand Axis: 3 seat winds plus 3 round target month cards."
      ]
    },
    {
      title:"More 9-Point Wins",
      lines:[
        "Tri Tone Triples: two month-or-wind triples using only 3 colors.",
        "Parity Triples: two month triples, all odd or all even.",
        "With 3 gear, a 9-point pattern scores 3.",
        "With 4 gear it scores 6; with 5 gear it scores 9."
      ]
    },
    {
      title:"12-Point Wins",
      lines:[
        "These can win even with 0 gear, but gear raises their score.",
        "Crown: 6 of one month, or 5 plus 1 neighbor, all colors different.",
        "Tempest: all 6 cards are the same non-seat wind.",
        "Escort: 4 of one month plus 2 from a neighbor, all colors different."
      ]
    },
    {
      title:"More 12-Point Wins",
      lines:[
        "Split Escort: 4 of one month plus 1 previous, 1 next, all colors different.",
        "Compass: same-color N, S, E, W plus any month pair or 2-month sequence, or 4 same-color consecutive months plus 2 same-color winds.",
        "12-point wins score 6 with 0-3 gear.",
        "They score 9 with 4 gear, or 12 with 5 gear."
      ]
    },
    {
      title:"15-Point Wins",
      lines:[
        "These are the premium patterns and can win even with 0 gear.",
        "Mono Skip: one color, and all months are odd or all even.",
        "Mono Run: one color, 6 different months in order.",
        "Grand Crown: all 6 cards are the round target month."
      ]
    },
    {
      title:"More 15-Point Wins",
      lines:[
        "Grand Tempest: all 6 cards are your own seat wind.",
        "Mono Compass uses either Compass shape, but every card must share one color.",
        "15-point wins score 9 with 0-3 gear.",
        "They score 12 with 4 gear, or 15 with 5 gear."
      ]
    },
    {
      title:"Winning Bonuses",
      lines:[
        "Tsumo, round month, and home wind each add +3.",
        "Rainbow: tsumo, 6 colors, 6 different month/wind identities: +3.",
        "Prism: 5 gear, 6 colors, 6 different month/wind identities: +3.",
        "Winning bonuses stack and show in the result reveal."
      ]
    },
    {
      title:"Draw / Game Over",
      lines:[
        "Some wins gain +3 bonuses after pattern and gear scoring.",
        "When draw, players with 5 gears receive 1 point from each player who does not have 5 gears.",
        "If everyone has 5 gears or no one is eligible, the round is a normal draw and no one pays.",
        "The game ends after round 12 or when a player runs out of points; ties go to Sudden Death."
      ]
    },
    {
      title:"Result Titles",
      lines:[
        "6pt is Mangan. 9pt is Haneman. 12pt is Baiman.",
        "15pt is Sanbaiman. 18pt is Yakuman.",
        "21pt is Double Yakuman. 24pt or more is Triple Yakuman.",
        "Hands below 6pt show no result title."
      ]
    },
        {
      title:"Beginner Plan",
      lines:[
        "First, watch for matching months, matching winds, and same colors.",
        "Open cards only when they help your shape or build gear.",
        "If you see TENPAI, you are one card away from winning.",
        "Tap cards quickly, but read every call popup carefully."
      ]
    }
  ];

  function fitCanvas() {
    dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    configureCanvasQuality(ctx);
    scale = Math.min(canvas.width / DESIGN_W, canvas.height / DESIGN_H);
    ox = (canvas.width - DESIGN_W * scale) / 2;
    oy = (canvas.height - DESIGN_H * scale) / 2;
  }
  function configureCanvasQuality(target) {
    target.imageSmoothingEnabled = true;
    target.imageSmoothingQuality = "high";
  }
  window.addEventListener("resize", fitCanvas);
  fitCanvas();

  const game = {
    mode:"title",
    round:1,
    sudden:false,
    dealer:0,
    turn:0,
    wall:[],
    lastDiscard:null,
    lastDiscarder:null,
    currentDraw:null,
    players:[],
    message:"Month Cycle Table",
    sub:"Touch to begin",
    awaiting:null,
    claim:null,
    lockUntil:0,
    runToken:0,
    handNo:0,
    muted:false,
    helpPage:0,
    helpReturn:"title",
    seenTenpai:false,
    lastResults:[],
    resultIndex:0,
    resultStartedAt:0,
    resultFxStep:0,
    autoPlay:false,
  };

  function initMatch() {
    game.runToken++;
    game.lockUntil = 0;
    game.round = 1;
    game.sudden = false;
    game.dealer = Math.floor(Math.random() * 4);
    game.autoPlay = false;
    game.players = [
      { name:"You", ai:false, points:18 },
      { name:"Akari", ai:true, points:18 },
      { name:"Ren", ai:true, points:18 },
      { name:"Mika", ai:true, points:18 },
    ];
    game.mode = "play";
    startHand();
  }

  function startHand() {
    if (game.mode === "gameOver" || game.mode === "title") return;
    game.handNo++;
    openPromiseCache.clear();
    findPatternCache.clear();
    bestWinCache.clear();
    game.wall = shuffle(deckCards());
    game.lastDiscard = null;
    game.lastDiscarder = null;
    game.currentDraw = null;
    game.claim = null;
    game.awaiting = null;
    game.lastResults = [];
    game.resultIndex = 0;
    game.resultFxStep = 0;
    game.seenTenpai = false;
    for (let i = 0; i < 4; i++) {
      const seat = SEAT_ORDER[(i - game.dealer + 4) % 4];
      Object.assign(game.players[i], {
        seat,
        concealed:[],
        open:[],
        discards:[],
        tenpai:false,
        waitCards:[],
        close:false,
        riichiGlow:false,
      });
    }
    for (let c = 0; c < 5; c++) {
      for (let p = 0; p < 4; p++) game.players[p].concealed.push(game.wall.pop());
    }
    sortHand(game.players[0].concealed);
    game.turn = game.dealer;
    game.mode = "play";
    game.message = "Round " + roundLabel() + " / Dealer " + game.players[game.dealer].name;
    game.sub = WIND_NAMES[game.players[0].seat] + " seat";
    burst(DESIGN_W/2, DESIGN_H/2, "#ffe07b", 64, 3.2);
    playSfx("start");
    delay(() => beginTurn(game.turn), 420);
  }

  function buildDeck() {
    if (deckTemplate) return deckTemplate.slice();
    const deck = [];
    for (let ci = 0; ci < COLORS.length; ci++) {
      for (let m = 1; m <= 12; m++) {
        deck.push({ id:`${COLORS[ci].code}${m}`, type:"month", color:ci, month:m, wind:null, col:m-1, row:ci });
      }
      for (let wi = 0; wi < WINDS.length; wi++) {
        const w = WINDS[wi];
        deck.push({ id:`${COLORS[ci].code}${w}`, type:"wind", color:ci, month:null, wind:w, col:12+wi, row:ci });
      }
    }
    deckTemplate = deck;
    return deckTemplate.slice();
  }
  function deckCards() {
    if (!deckTemplate) buildDeck();
    return deckTemplate;
  }

  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function roundLabel() { return game.sudden ? "Sudden" : String(game.round); }
  function currentRoundMonth() { return game.sudden ? null : game.round; }
  function totalCards(p) { return p.concealed.concat(p.open); }
  function openCount(p) { return p.open.length; }
  function nextPlayer(i) { return (i + 1) % 4; }
  function sortHand(h) {
    h.sort((a,b) => (a.type === b.type ? 0 : a.type === "month" ? -1 : 1) ||
      ((a.month || 20 + WINDS.indexOf(a.wind)) - (b.month || 20 + WINDS.indexOf(b.wind))) ||
      a.color - b.color);
  }
  function playerVerb(p, firstPerson, thirdPerson) {
    return `${p.name} ${p.name === "You" ? firstPerson : thirdPerson}`;
  }
  function pauseAuto() {
    if (!game.autoPlay) return;
    game.autoPlay = false;
    flash("AUTO PAUSED", "#8dfff1", 44);
  }
  function autoBlockedByDecision() {
    return game.mode === "userClaim" ||
      game.mode === "userRon" ||
      game.mode === "userTsumo" ||
      game.mode === "homeOpen" ||
      game.mode === "matchOpen";
  }
  function forcedAutoDiscard() {
    const human = game.players[0];
    return !!human && openCount(human) >= 5;
  }
  function autoSkipsOptionalCalls() {
    return game.autoPlay || forcedAutoDiscard();
  }
  function openChoiceHoverReady() {
    clearDiscardMatchHint();
    handHoverBlockedUntil = pointer.kind === "touch" ? performance.now() + 90 : 0;
  }
  function clearDiscardMatchHint() {
    discardHint = { card:null, until:0, candidate:null, since:0 };
  }

  function beginTurn(pi) {
    if (game.mode === "gameOver") return;
    if (game.wall.length <= 0) return endHandDraw();
    game.turn = pi;
    const p = game.players[pi];
    const card = game.wall.pop();
    p.concealed.push(card);
    sortHand(p.concealed);
    game.currentDraw = card;
    game.message = playerVerb(p, "draw", "draws");
    game.sub = `${game.wall.length} cards in wall`;
    playSfx("draw");
    updateTenpai();

    const win = bestWin(p, totalCards(p), "tsumo");
    if (win) {
      if (p.ai) return delay(() => declareWin([pi], null, "TSUMO", [win]), 580);
      game.awaiting = { type:"tsumo", win };
      game.mode = "userTsumo";
      flash("TSUMO READY", "#fff1a8", 80);
      playSfx("tenpai");
      return;
    }

    const selfKan = possibleSelfKan(p);
    if (p.ai && selfKan && shouldAiSelfKan(p, selfKan)) {
      return delay(() => claimSelfKan(pi, selfKan), 400);
    }
    if (!p.ai && selfKan && !game.autoPlay) {
      pauseAuto();
      game.awaiting = { type:"selfKan", group:selfKan };
      game.mode = "userTurn";
      flash("KAN READY", "#88d7ff", 45);
      return;
    }

    if (!p.ai) {
      if (openCount(p) >= 5) return delay(() => autoDiscardHuman(), 290);
      if (game.autoPlay) {
        game.mode = "play";
        game.message = "AUTO discard";
        game.sub = p.tenpai ? "TENPAI wait shown" : "Running until a call";
        return delay(() => autoDiscardHuman(), 250);
      }
      game.mode = "userTurn";
      game.message = "Your discard";
      game.sub = p.tenpai ? "TENPAI - choose carefully" : "Tap a card, then Discard";
    } else {
      delay(() => aiDiscard(pi), 390);
    }
  }

  function possibleSelfKan(p) {
    const total = totalCards(p);
    for (const key of groupKeys(total)) {
      const sameTotal = total.filter(c => groupKey(c) === key);
      const sameConcealed = p.concealed.filter(c => groupKey(c) === key);
      if (sameTotal.length === 5 && sameConcealed.length === 5) return key;
    }
    return null;
  }

  function claimSelfKan(pi, key) {
    const p = game.players[pi];
    const moved = removeWhere(p.concealed, c => groupKey(c) === key);
    p.open.push(...moved);
    sortHand(p.open);
    bigCall("SELF KAN", pi, "#77d7ff");
    playSfx("kan");
    if (p.ai) delay(() => aiDiscard(pi), 420);
    else {
      if (p.concealed.length) delay(() => autoDiscardHuman(), 290);
      else advanceTurn();
    }
  }

  function autoDiscardHuman() {
    const p = game.players[0];
    if (!p.concealed.length) return advanceTurn();
    const idx = chooseDiscardIndex(p);
    discardCard(0, idx, true);
  }

  function aiDiscard(pi) {
    const p = game.players[pi];
    if (!p.concealed.length) return advanceTurn();
    discardCard(pi, chooseDiscardIndex(p), false);
  }

  function chooseDiscardIndex(p) {
    let best = -1, bestScore = -Infinity;
    const profile = aiProfile(p);
    const dead = visibleDeadIds(p);
    for (let i = 0; i < p.concealed.length; i++) {
      const c = p.concealed[i];
      const concealed = p.concealed.slice(0, i).concat(p.concealed.slice(i + 1));
      const discardDead = new Set(dead);
      discardDead.add(c.id);
      const plan = evaluateAiState(p, concealed, p.open, discardDead);
      let score = plan.score - discardDanger(p, c) * profile.risk;
      if (!p.ai && dealsIntoPublicRon(p, c)) score -= 10000;
      score += discardReleaseValue(p, c, concealed.concat(p.open)) * 0.8;
      if (game.currentDraw && game.currentDraw.id === c.id) score += 0.18;
      if (plan.waits > 0 && isBonusCardFor(p, c)) score -= 0.85;
      score += Math.random() * profile.noise;
      if (score > bestScore) { bestScore = score; best = i; }
    }
    return Math.max(0, best);
  }

  function aiProfile(p) {
    if (!p || !p.ai) return { call:0.76, risk:0.55, gear:0.78, noise:0.03 };
    if (p.name === "Akari") return { call:0.78, risk:0.48, gear:0.78, noise:0.07 };
    if (p.name === "Ren") return { call:0.62, risk:0.82, gear:0.55, noise:0.04 };
    if (p.name === "Mika") return { call:0.9, risk:0.38, gear:1.05, noise:0.09 };
    return { call:0.76, risk:0.55, gear:0.78, noise:0.05 };
  }

  function evaluateAiState(p, concealed, open, deadIds = visibleDeadIds(p)) {
    const total = concealed.concat(open);
    const sim = { ...p, concealed, open };
    const wins = winningDrawAnalysis(sim, total, deadIds);
    const shape = shapeScore(sim, total);
    const gear = gearScore(sim, total);
    const fullGear = fullGearEndgameScore(sim, wins.count);
    const attack = attackPressure(sim);
    const future = wins.count ? 0 : futureWaitHint(sim, concealed, open, deadIds);
    const score = wins.count
      ? wins.count * (24 + attack * 18) + wins.avg * (2.7 + attack) + wins.best * 1.2 + shape * 0.35 + gear + fullGear
      : shape * 0.82 + gear + fullGear + future * (9 + attack * 5);
    return { score, waits:wins.count, avg:wins.avg, best:wins.best, shape, gear, fullGear, future, attack };
  }

  function winningDrawAnalysis(player, fiveCards, deadIds = visibleDeadIds(player)) {
    let count = 0, total = 0, best = 0;
    const seen = new Set(fiveCards.map(c => c.id));
    for (const c of deckCards()) {
      if (seen.has(c.id)) continue;
      if (deadIds && deadIds.has(c.id)) continue;
      const win = bestWin(player, fiveCards.concat(c), "draw");
      if (!win) continue;
      count++;
      total += win.total;
      best = Math.max(best, win.total);
    }
    return { count, avg:count ? total / count : 0, best };
  }

  function shapeScore(player, cards) {
    if (!cards.length) return 0;
    const months = cards.filter(c => c.type === "month");
    const winds = cards.filter(c => c.type === "wind");
    const monthCounts = counts(months.map(c => c.month));
    const windCounts = counts(winds.map(c => c.wind));
    const colorCounts = counts(cards.map(c => c.color));
    const mVals = Object.keys(monthCounts).map(Number).sort((a,b)=>a-b);
    const colorDiversity = Object.keys(colorCounts).length;
    let score = 0;
    for (const v of vals(monthCounts)) score += v * v * 1.25 + (v >= 3 ? 2.4 : 0);
    for (const v of vals(windCounts)) score += v * v * 1.15 + (v >= 3 ? 2.1 : 0);
    for (const v of vals(colorCounts)) score += v >= 2 ? (v - 1) * 1.35 : 0;
    const road = longestConsecutiveRun(mVals);
    score += road * 1.35;
    if (months.length >= 4 && road >= 4) score += colorDiversity * 0.8;
    if (months.length >= 5 && colorDiversity >= 5) score += 2.6;
    if (months.length === cards.length && colorDiversity === cards.length) score += 3.4;
    score += parityCount(mVals, 0) >= 4 ? 2.1 : 0;
    score += parityCount(mVals, 1) >= 4 ? 2.1 : 0;
    score += consecutivePairGroups(monthCounts) * 1.8;
    score += compassSeedScore(cards) * 1.5;
    if (currentRoundMonth()) score += (monthCounts[currentRoundMonth()] || 0) * 2.2;
    score += (windCounts[player.seat] || 0) * 2.0;
    if (months.length === cards.length) score += 1.2;
    if (winds.length === cards.length) score += 1.2;
    return score;

  function gearScore(player, cards) {
    const open = openCount(player);
    let score = open * 1.35;
    if (open >= 3) score += 8;
    if (open === 5) score += 4;
    const highBaseSeed = vals(counts(cards.map(groupKey))).some(v => v >= 3) ||

      (currentRoundMonth() && cards.some(c => c.month === currentRoundMonth()) && cards.some(c => c.wind === player.seat));

  function fullGearEndgameScore(player, waits) {
    const pressure = fullGearPressure(waits);

    let eligible = 0, allKnown = 0, opponentNear = 0;

  function fullGearPressure(waits) {

  function futureWaitHint(player, concealed, open, deadIds) {
    const total = concealed.concat(open);
    const seen = new Set(total.map(c => c.id));
    const currentShape = shapeScore(player, total) + gearScore(player, total);
    const candidates = deckCards().filter(c => !seen.has(c.id) && !(deadIds && deadIds.has(c.id)));
    const sampleSize = Math.min(attackPressure(player) > 0.7 ? 8 : 5, candidates.length);
    const stride = sampleSize ? Math.max(1, Math.floor(candidates.length / sampleSize)) : 1;
    const offset = candidates.length ? ((game.handNo * 7 + (player.name || "").length * 5 + open.length * 3) % candidates.length) : 0;
    let checked = 0, sumBest = 0;
    for (let s = 0; s < sampleSize; s++) {
      const draw = candidates[(offset + s * stride) % candidates.length];
      const sixConcealed = concealed.concat(draw);
      let best = -Infinity;
      for (let i = 0; i < sixConcealed.length; i++) {
        const nextConcealed = sixConcealed.slice(0, i).concat(sixConcealed.slice(i + 1));
        const sim = { ...player, concealed:nextConcealed, open };
        const nextTotal = nextConcealed.concat(open);

        const waits = countWinningDraws(sim, nextTotal, 10, nextDead);

        best = Math.max(best, waits * 4 + Math.max(0, shapeGain) * 0.18);

      sumBest += Math.max(0, best);
      checked++;

    return checked ? sumBest / checked : 0;
  }

  function attackPressure(player) {
    if (!player) return 0;

    if (game.wall && game.wall.length < 42) pressure += 0.12;

      if (!opp || opp === player) continue;

  function patternPathScore(player, cards) {
    if (!cards.length) return 0;

    const mVals = Object.keys(monthCounts).map(Number).sort((a,b)=>a-b);

    const road = longestConsecutiveRun(mVals);

    best = Math.max(best, road * 1.75 + colorDiversity * (road >= 4 ? 0.75 : 0.35));

    best = Math.max(best, vals(monthCounts).filter(v => v >= 2).length * 2.0 + consecutivePairGroups(monthCounts) * 1.3);

    if (player && player.seat) best += Math.min(4, (windCounts[player.seat] || 0) * 1.2);

  function hasConstructiveWinningPath(before, plan, beforePath, afterPath, openingToFull = false) {

  function openCardsCanStillWin(player, open) {

  function quickOpenPromise(player, open) {

  function quickMonthGroups(months) {
    const monthCounts = counts(months.map(c => c.month));
    const valsIn = Object.keys(monthCounts).map(Number);
    const countVals = vals(monthCounts);
    const colorCount = new Set(months.map(c => c.color)).size;
    if (valsIn.length <= 3 && countVals.every(v => v <= 2)) {

      if (sameParity(valsIn)) return true;
      if (colorCount <= 2) return true;
    }
    if (valsIn.length <= 2 && countVals.every(v => v <= 3)) {
      if (fitsConsecutiveWindow(valsIn, 2)) return true;
      if (sameParity(valsIn)) return true;
      if (colorCount <= 3) return true;

  }

  function quickWindCompass(open) {
    const winds = open.filter(c => c.type === "wind");
    const months = open.filter(c => c.type === "month");
    if (winds.length > 4 || months.length > 2) return false;
    if (winds.length && new Set(winds.map(c => c.color)).size !== 1) return false;
    if (winds.length && new Set(winds.map(c => c.wind)).size !== winds.length) return false;
    if (months.length === 2 && months[0].month !== months[1].month && Math.abs(months[0].month - months[1].month) !== 1) return false;
    return true;
  }

  function quickMonthRoadCompass(open) {
    const months = open.filter(c => c.type === "month");
    const winds = open.filter(c => c.type === "wind");
    if (months.length > 4 || winds.length > 2) return false;
    if (winds.length && new Set(winds.map(c => c.color)).size !== 1) return false;
    if (!months.length) return true;
    if (new Set(months.map(c => c.color)).size !== 1) return false;
    const vals = months.map(c => c.month);
    return new Set(vals).size === vals.length && fitsConsecutiveWindow(vals, 4);
  }

  function fitsConsecutiveWindow(valsIn, size) {
    if (!valsIn.length) return true;
    const vals = [...new Set(valsIn)].sort((a,b)=>a-b);
    if (vals.length !== valsIn.length) return false;
    for (let start = 1; start <= 13 - size; start++) {
      const end = start + size - 1;
      if (vals.every(v => v >= start && v <= end)) return true;

    return false;
  }

  function openCompletionSearch(player, open, pool, need, start, pick) {

    for (let i = start; i <= pool.length - need; i++) {

    return false;

  function discardReleaseValue(p, card, after) {

  function discardDanger(p, card) {
    if (!p || !p.ai) return 0;

  function dealsIntoPublicRon(discarder, card) {

  function shouldAiSelfKan(p, key) {

  function bestDiscardPlan(p, concealed, open) {

  function isBonusCardFor(p, c) {

  function visibleGroupDeadCount(player, key) {
    let n = 0;
    const own = new Set(player ? totalCards(player).map(c => c.id) : []);
    for (const p of game.players) {

  function longestConsecutiveRun(valsIn) {
    if (!valsIn.length) return 0;

      cur = valsIn[i] === valsIn[i - 1] + 1 ? cur + 1 : 1;

  }

  function parityCount(valsIn, parity) {

  function consecutivePairGroups(monthCounts) {

  function compassSeedScore(cards) {
    let best = 0;

  function discardCard(pi, index, automatic) {

  function resolveMeldClaims(card, discarder) {

  function shouldAiClaim(opt, card) {

    const state = simulatedClaimState(p, opt.type, card);
    const plan = bestPlanAfterClaimDiscard(p, state);
    if (!plan || plan.index < 0) return false;
    const before = evaluateAiState(p, p.concealed, p.open);
    const profile = aiProfile(p);
    const attack = attackPressure(p);
    const claimCost = Math.max(0.8, (opt.type === "chi" ? 7.2 : opt.type === "pon" ? 3.4 : 1.6) - attack * (opt.type === "chi" ? 2.6 : 1.5));
    const gearGain = Math.max(0, state.open.length - p.open.length);
    const visibleValue = gearGain * profile.gear * 2.2 + (state.open.length >= 3 ? 5.4 : 0) + (state.open.length === 5 ? 2.2 : 0);
    const improvement = plan.score + visibleValue - before.score - claimCost;
    const fit = claimFitScore(p, card, state);
    const beforePath = patternPathScore(p, totalCards(p));
    const afterPath = patternPathScore({ ...p, concealed:state.concealed, open:state.open }, state.concealed.concat(state.open));
    const constructive = hasConstructiveWinningPath(before, plan, beforePath, afterPath, state.open.length === 5 && p.open.length < 5);
    const lateFullGear = state.open.length === 5 && p.open.length < 5 && fullGearPressure(plan.waits) >= 0.55;
    if (!lateFullGear && !openCardsCanStillWin({ ...p, concealed:state.concealed, open:state.open }, state.open)) return false;
    if (lateFullGear) return true;
    if (!constructive && !(attack > 0.7 && fit >= 2.6 && afterPath >= beforePath + 0.5)) return false;
    if (plan.waits > 0 && plan.score + visibleValue >= before.score - claimCost * (0.55 + attack * 0.25)) return true;
    if (attack > 0.7 && plan.future > before.future + (opt.type === "chi" ? 1.2 : 0.45)) return true;
    if (attack > 0.7 && state.open.length >= 3 && plan.future >= before.future && improvement > -1.2) return true;
    if (attack > 0.7 && opt.type === "chi" && fit >= 2.6 && improvement > -20.0) return true;
    if (attack > 0.7 && (opt.type === "pon" || opt.type === "kan") && fit >= 4.0 && improvement > -3.0) return true;
    if (opt.type === "kan") return improvement > -1.5;
    if (opt.type === "pon") return improvement > 1.0;
    if (opt.type === "chi") return improvement > 3.0 && Math.random() < profile.call;
    return false;
  }

  function claimFitScore(p, card, state) {
    const before = totalCards(p);
    const after = state.concealed.concat(state.open);
    let fit = 0;
    const sameGroupBefore = before.filter(c => groupKey(c) === groupKey(card)).length;
    const sameColorBefore = before.filter(c => c.color === card.color).length;
    const beforeColors = new Set(before.map(c => c.color));
    fit += sameGroupBefore * 2.3;
    fit += Math.max(0, sameColorBefore - 1) * 1.15;
    if (sameColorBefore >= 3) fit += 1.8;
    if (!beforeColors.has(card.color)) fit += 1.0;
    if (card.type === "month") {
      const months = before.filter(c => c.type === "month").map(c => c.month);
      const neighbors = months.filter(m => Math.abs(m - card.month) === 1).length;
      const nearRoad = months.filter(m => Math.abs(m - card.month) <= 3).length;
      fit += neighbors * 1.35 + nearRoad * 0.35;
      if (neighbors && !beforeColors.has(card.color)) fit += 1.2;
      if (card.month === currentRoundMonth()) fit += 1.4;
    } else {
      const sameWind = before.filter(c => c.wind === card.wind).length;
      fit += sameWind * 1.8;
      if (card.wind === p.seat) fit += 1.5;
    }
    fit += Math.max(0, compassSeedScore(after) - compassSeedScore(before)) * 1.2;
    if (state.open.length >= 3 && p.open.length < 3) fit += 1.2;
    if (state.open.length === 5 && p.open.length < 5 && fullGearPressure(0) > 0.55) fit += 1.2;
    return fit;
  }

  function bestPlanAfterClaimDiscard(p, state) {
    if (!state || state.concealed.length === 0) return null;
    const dead = visibleDeadIds(p);
    for (const c of state.open) dead.delete(c.id);
    let best = { index:-1, score:-Infinity, waits:0 };
    const profile = aiProfile(p);
    for (let i = 0; i < state.concealed.length; i++) {
      const concealed = state.concealed.slice(0, i).concat(state.concealed.slice(i + 1));
      const sim = { ...p, concealed, open:state.open };
      const discardDead = new Set(dead);
      discardDead.add(state.concealed[i].id);
      const plan = evaluateAiState(sim, concealed, state.open, discardDead);
      const score = plan.score - discardDanger(p, state.concealed[i]) * profile.risk;
      if (score > best.score) best = { ...plan, index:i, score };
    }
    return best;
  }

  function chooseAiHomeOpenIndex(p) {
    if (!p || !p.concealed.length || openCount(p) >= 5) return -1;
    const before = evaluateAiState(p, p.concealed, p.open);
    let best = -1, bestScore = -Infinity;
    const profile = aiProfile(p);
    const attack = attackPressure(p);
    const beforePath = patternPathScore(p, p.concealed.concat(p.open));
    for (let i = 0; i < p.concealed.length; i++) {
      const concealed = p.concealed.slice();
      const open = p.open.slice();
      const card = concealed.splice(i, 1)[0];
      open.push(card);
      if (open.length > 5) continue;
      const dead = visibleDeadIds(p);
      for (const c of open) dead.delete(c.id);
      const sim = { ...p, concealed, open };
      const plan = evaluateAiState(sim, concealed, open, dead);
      const openingToFull = open.length === 5 && p.open.length < 5;
      const fullGearUrgency = fullGearPressure(plan.waits);
      if (openingToFull && plan.waits <= 0 && fullGearUrgency < 0.55) continue;
      if (openingToFull && plan.waits < before.waits && fullGearUrgency < 0.42) continue;
      if (openingToFull && fullGearUrgency >= 0.75 && plan.fullGear > before.fullGear) {
        best = i;
        bestScore = Math.max(bestScore, plan.score + 100);
        continue;
      }
      if (!openCardsCanStillWin(sim, open)) continue;
      const afterPath = patternPathScore(sim, concealed.concat(open));
      if (!hasConstructiveWinningPath(before, plan, beforePath, afterPath, openingToFull)) continue;
      const fullGearPush = openingToFull ? 0.9 + fullGearUrgency * 8 : 0;
      const attackPush = attack > 0.7 && plan.future > before.future ? 2.4 : 0;
      const lateDrawPush = openingToFull && fullGearUrgency >= 0.75 && plan.fullGear > before.fullGear ? 12 : 0;
      const openValue = (open.length >= 3 ? 5.4 : 0) + fullGearPush + lateDrawPush + attackPush + profile.gear * 1.5;
      const score = plan.score + openValue - before.score;
      if (score < (attack > 0.7 ? 0.2 : 1.2) && !(plan.waits > before.waits && score > -1.0)) continue;
      if (score > bestScore) {
        best = i;
        bestScore = score;
      }
    }
    return best;
  }

  function canMatchOpen(p, key) {
    return !!p && openCount(p) < 5 && p.concealed.some(c => groupKey(c) === key);
  }

  function chooseAiMatchOpenIndex(p, key) {
    if (!canMatchOpen(p, key)) return -1;
    const before = evaluateAiState(p, p.concealed, p.open);
    let best = -1, bestScore = -Infinity;
    const profile = aiProfile(p);
    const attack = attackPressure(p);
    const beforePath = patternPathScore(p, p.concealed.concat(p.open));
    for (let i = 0; i < p.concealed.length; i++) {
      if (groupKey(p.concealed[i]) !== key) continue;
      const concealed = p.concealed.slice();
      const open = p.open.slice();
      const card = concealed.splice(i, 1)[0];
      open.push(card);
      if (open.length > 5) continue;
      const dead = visibleDeadIds(p);
      for (const c of open) dead.delete(c.id);
      const sim = { ...p, concealed, open };
      const plan = evaluateAiState(sim, concealed, open, dead);
      const openingToFull = open.length === 5 && p.open.length < 5;
      const fullGearUrgency = fullGearPressure(plan.waits);
      if (openingToFull && plan.waits <= 0 && fullGearUrgency < 0.55) continue;
      if (openingToFull && plan.waits < before.waits && fullGearUrgency < 0.42) continue;
      if (openingToFull && fullGearUrgency >= 0.75 && plan.fullGear > before.fullGear) {
        best = i;
        bestScore = Math.max(bestScore, plan.score + 100);
        continue;
      }
      if (!openCardsCanStillWin(sim, open)) continue;
      const afterPath = patternPathScore(sim, concealed.concat(open));
      if (!hasConstructiveWinningPath(before, plan, beforePath, afterPath, openingToFull)) continue;
      const fullGearPush = openingToFull ? 0.9 + fullGearUrgency * 8 : 0;
      const attackPush = attack > 0.7 && plan.future > before.future ? 2.4 : 0;
      const lateDrawPush = openingToFull && fullGearUrgency >= 0.75 && plan.fullGear > before.fullGear ? 12 : 0;
      const openValue = (open.length >= 3 ? 5.4 : 0) + fullGearPush + lateDrawPush + attackPush + profile.gear * 1.35;
      const score = plan.score + openValue - before.score;
      if (score < (attack > 0.7 ? -0.2 : 0.6) && !(plan.waits > before.waits && score > -1.4)) continue;
      if (score > bestScore) {
        best = i;
        bestScore = score;
      }
    }
    return best;
  }

  function takeClaim(pi, type, card, discarder) {
    const p = game.players[pi];
    if (!canTakeClaim(p, type, card)) {
      if (pi === 0) flash("Open area full", "#ff6680", 38);
      return advanceTurn();
    }
    const discards = game.players[discarder].discards;
    if (discards[discards.length - 1] === card) discards.pop();
    if (type === "chi") {
      p.open.push(card);
    } else {
      const need = type === "pon" ? 3 : 4;
      const key = groupKey(card);
      const moved = removeWhere(p.concealed, c => groupKey(c) === key);
      p.open.push(...moved, card);
      if (moved.length < need) {
        const short = need - moved.length;
        let taken = 0;
        p.open = p.open.filter(c => {
          if (groupKey(c) === key && c !== card && taken < short) { taken++; return true; }
          return true;
        });
      }
    }
    sortHand(p.open);
    sortHand(p.concealed);
    game.turn = pi;
    bigCall(type.toUpperCase(), pi, type === "kan" ? "#72dbff" : type === "pon" ? "#ff7b96" : "#ffe07b");
    playSfx(type);
    updateTenpai();
    if (pi === 0) {
      game.claim = null;
      if (openCount(p) >= 5) {
        game.mode = "play";
        delay(() => autoDiscardHuman(), 290);
      } else {
        game.mode = "userTurn";
        game.message = `${type.toUpperCase()} taken`;
        game.sub = "Discard one concealed card";
      }
    } else {
      game.claim = null;
      game.mode = "play";
      delay(() => aiDiscard(pi), 420);
    }
  }

  function advanceTurn() {
    game.claim = null;
    game.awaiting = null;
    game.mode = "play";
    if (game.wall.length <= 0) return endHandDraw();
    delay(() => beginTurn(nextPlayer(game.turn)), 360);
  }

  function claimOpenAdds(p, type, card) {
    if (type === "chi") return 1;
    const key = groupKey(card);
    return 1 + p.concealed.filter(c => groupKey(c) === key).length;
  }

  function canTakeClaim(p, type, card) {
    if (!p || openCount(p) >= 5) return false;
    return openCount(p) + claimOpenAdds(p, type, card) <= 5;
  }

  function simulatedClaimState(p, type, card) {
    const concealed = p.concealed.slice();
    const open = p.open.slice();
    if (type === "chi") {
      open.push(card);
    } else {
      const key = groupKey(card);
      for (let i = concealed.length - 1; i >= 0; i--) {
        if (groupKey(concealed[i]) === key) open.push(concealed.splice(i, 1)[0]);
      }
      open.push(card);
    }
    if (open.length > 5) return null;
    return { concealed, open };
  }

  function declareWin(winners, discarder, method, wins) {
    game.autoPlay = false;
    game.mode = "result";
    game.lastResults = [];
    game.resultIndex = 0;
    game.resultStartedAt = performance.now();
    game.resultFxStep = 0;
    for (let wi = 0; wi < winners.length; wi++) {
      const idx = winners[wi];
      const p = game.players[idx];
      const win = wins[wi] || bestWin(p, totalCards(p), method.toLowerCase());
      let value = win ? win.total : 0;
      if (method === "TSUMO") {
        p.points += value;
        for (let i = 0; i < 4; i++) if (i !== idx) game.players[i].points -= value / 3;
      } else {
        p.points += value;
        game.players[discarder].points -= value;
      }
      const resultCards = method === "RON" && game.lastDiscard
        ? totalCards(p).concat(game.lastDiscard)
        : totalCards(p);
      game.lastResults.push({
        player:idx,
        method,
        win,
        value,
        rank:handRank(value),
        lines:win ? resultScoreLines(win, method) : [],
        cards:resultCards.slice(0, 6)
      });
      bigCall(method, idx, method === "TSUMO" ? "#fff1a8" : "#ff4f73", true);
      burst(DESIGN_W/2, DESIGN_H/2, method === "TSUMO" ? "#fff1a8" : "#ff4f73", 160, 6);
    }
    playSfx("win");
    const eastWon = winners.some(i => game.players[i].seat === "E");
    if (!eastWon) game.dealer = nextPlayer(game.dealer);
    game.message = game.lastResults.map(r => `${game.players[r.player].name} ${r.method} ${r.value}`).join("  ");
    game.sub = game.lastResults.map(r => r.win ? r.win.name : "").join(" / ");
  }

  function endHandDraw() {
    game.autoPlay = false;
    game.mode = "result";
    game.lastResults = [];
    game.resultIndex = 0;
    game.message = "Exhaustive Draw";
    game.resultStartedAt = performance.now();
    game.resultFxStep = 0;
    const fullGear = settleFullGear();
    game.sub = fullGear ? fullGear.summary : "No score";
    game.dealer = nextPlayer(game.dealer);
    flash(fullGear ? "FULL GEAR" : "DRAW", fullGear ? "#ffe07b" : "#d7dbe0", 100);
    playSfx(fullGear ? "claim" : "draw");
  }

  function settleFullGear() {
    const eligible = [];
    const payers = [];
    for (let i = 0; i < game.players.length; i++) {
      if (fullGearEligible(game.players[i])) eligible.push(i);
      else payers.push(i);
    }
    if (!eligible.length || !payers.length) return null;
    for (const i of eligible) game.players[i].points += payers.length;
    for (const i of payers) game.players[i].points -= eligible.length;
    return {
      eligible,
      payers,
      summary:`Full Gear: ${eligible.map(i => game.players[i].name).join(", ")} +${payers.length}; others -${eligible.length}`
    };
  }

  function fullGearEligible(p) {
    return !!p && p.open.length === 5;
  }

  function afterHand(dealNow = false) {
    if (matchShouldEnd()) return endMatch();
    if (game.round >= 12 && !game.sudden) game.sudden = true;
    else if (!game.sudden) game.round++;
    if (dealNow) {
      game.mode = "play";
      startHand();
      return;
    }
    game.mode = "between";
    game.message = "Next Hand";
    game.sub = "Deal next hand";
  }

  function soleLeader() {
    const high = Math.max(...game.players.map(p => p.points));
    return game.players.filter(p => p.points === high).length === 1;
  }

  function matchShouldEnd() {
    const busted = game.players.some(p => p.points <= 0);
    return busted || (game.round >= 12 && soleLeader());
  }

  function endMatch() {
    game.mode = "gameOver";
    const sorted = game.players.slice().sort((a,b) => b.points - a.points);
    game.message = `${playerVerb(sorted[0], "win", "wins")} the match`;
    game.sub = game.players.map(p => `${p.name} ${p.points}`).join("  ");
    playSfx("win");
  }

  function bestWin(player, cards, method) {
    if (cards.length !== 6) return null;
    const cacheKey = `${game.sudden ? "S" : game.round}:${player.seat}:${openCount(player)}:${method}:${cardSetKey(cards)}`;
    if (bestWinCache.has(cacheKey)) return bestWinCache.get(cacheKey);
    const open = openCount(player);
    const scoredPatterns = findPatterns(player, cards)
      .map((pattern, index) => {
        const scored = applyGear(pattern, open);
        if (!scored) return null;
        const lineScore = baseLineScore(scored.base);
        return { ...scored, index, lineScore, gearBonus:Math.max(0, scored.score - lineScore) };
      })
      .filter(Boolean);
    if (!scoredPatterns.length) {
      bestWinCache.set(cacheKey, null);
      if (bestWinCache.size > 60000) bestWinCache.clear();
      return null;
    }
    const patterns = resultPatterns(scoredPatterns)
      .sort((a,b) => b.lineScore - a.lineScore || a.name.localeCompare(b.name) || a.index - b.index);
    const best = scoredPatterns.slice().sort((a,b) => b.score - a.score || b.base - a.base || a.index - b.index)[0];
    const patternScore = patterns.reduce((sum, p) => sum + p.lineScore, 0);
    const gearBonus = Math.max(0, ...patterns.map(p => p.gearBonus || 0));
    const roundBonus = currentRoundMonth() && cards.some(c => c.month === currentRoundMonth()) ? 3 : 0;
    const homeWindBonus = cards.some(c => c.wind === player.seat) ? 3 : 0;
    const methodBonus = method === "tsumo" || method === "draw" ? 3 : 0;
    const rainbowBonus = methodBonus > 0 && rainbowPrismReady(cards) ? 3 : 0;
    const prismBonus = open === 5 && rainbowPrismReady(cards) ? 3 : 0;
    const bonus = roundBonus + homeWindBonus + rainbowBonus + prismBonus;
    const total = patternScore + gearBonus + bonus + methodBonus;
    const result = {
      ...best,
      name:best.name,
      patterns,
      patternScore,
      gearBonus,
      roundBonus,
      homeWindBonus,
      rainbowBonus,
      prismBonus,
      methodBonus,
      bonus,
      open,
      score:patternScore + gearBonus,
      total,
      method
    };
    bestWinCache.set(cacheKey, result);
    if (bestWinCache.size > 60000) bestWinCache.clear();
    return result;
  }

  function baseLineScore(base) {
    if (base === 3) return 3;
    if (base === 6) return 3;
    if (base === 9) return 3;
    if (base === 12) return 6;
    if (base === 15) return 9;
    return base;
  }

  function resultPatterns(patterns) {
    const names = new Set(patterns.map(p => p.name));
    return patterns.filter(p => {
      if (names.has("Mono Compass") && (p.name === "Mono" || p.name === "Compass")) return false;
      if (names.has("Mono Skip") && (p.name === "Mono" || p.name === "Skip")) return false;
      if (names.has("Mono Run") && (p.name === "Mono" || p.name === "Run")) return false;
      if (names.has("Grand Crown") && p.name === "Crown") return false;
      return true;
    });
  }

  function resultScoreLines(win, method) {
    const lines = [];
    if (method === "TSUMO") lines.push({ label:"Tsumo", points:win.methodBonus || 3, kind:"method" });
    for (const p of win.patterns || []) lines.push({ label:p.name, points:p.lineScore, kind:"pattern" });
    if (win.gearBonus > 0) lines.push({ label:gearLineLabel(win.open), points:win.gearBonus, kind:"gear" });
    if (win.rainbowBonus > 0) lines.push({ label:"Rainbow", points:win.rainbowBonus, kind:"bonus" });
    if (win.prismBonus > 0) lines.push({ label:"Prism", points:win.prismBonus, kind:"bonus" });
    if (win.roundBonus > 0) lines.push({ label:"Round Month", points:win.roundBonus, kind:"bonus" });
    if (win.homeWindBonus > 0) lines.push({ label:"Home Wind", points:win.homeWindBonus, kind:"bonus" });
    return lines;
  }

  function rainbowPrismReady(cards) {
    return cards.length === 6 &&
      new Set(cards.map(c => c.color)).size === 6 &&
      new Set(cards.map(groupKey)).size === 6;
  }

  function gearLineLabel(open) {
    if (open === 5) return "Full Gear";
    if (open === 4) return "Half Gear";
    return `${open} Gears`;
  }

  function handRank(total) {
    if (total >= 24) return "Triple Yakuman";
    if (total >= 21) return "Double Yakuman";
    if (total >= 18) return "Yakuman";
    if (total >= 15) return "Sanbaiman";
    if (total >= 12) return "Baiman";
    if (total >= 9) return "Haneman";
    if (total >= 6) return "Mangan";
    return "";
  }

  function applyGear(p, open) {
    let score = null;
    if (p.base === 3) score = open >= 3 ? 3 : null;
    if (p.base === 6) score = open >= 3 ? (open === 3 ? 3 : 6) : null;
    if (p.base === 9) score = open >= 3 ? (open === 3 ? 3 : open === 4 ? 6 : 9) : null;
    if (p.base === 12) score = open <= 3 ? 6 : open === 4 ? 9 : 12;
    if (p.base === 15) score = open <= 3 ? 9 : open === 4 ? 12 : 15;
    if (score == null) return null;
    return { ...p, score };
  }

  function findPatterns(player, cards) {
    const cacheKey = `${game.sudden ? "S" : game.round}:${player.seat}:${cardSetKey(cards)}`;
    if (findPatternCache.has(cacheKey)) return findPatternCache.get(cacheKey);
    const out = [];
    const months = cards.filter(c => c.type === "month");
    const winds = cards.filter(c => c.type === "wind");
    const colors = new Set(cards.map(c => c.color));
    const round = currentRoundMonth();
    const seat = player.seat;
    const monthCounts = counts(months.map(c => c.month));
    const windCounts = counts(winds.map(c => c.wind));
    const groupCounts = counts(cards.map(groupKey));
    const mVals = Object.keys(monthCounts).map(Number).sort((a,b)=>a-b);
    const wVals = Object.keys(windCounts);
    const allMonths = months.length === 6;
    const allWinds = winds.length === 6;
    const allColors = colors.size === 6;
    const allSameColor = colors.size === 1;
    const pairCounts = vals(monthCounts).sort((a,b)=>a-b).join(",");
    const windPairCounts = vals(windCounts).sort((a,b)=>a-b).join(",");
    const groupPairCounts = vals(groupCounts).sort((a,b)=>a-b).join(",");

    if (allSameColor) out.push({ name:"Mono", base:3 });
    if (allMonths && mVals.length === 6 && allColors && sameParity(mVals)) out.push({ name:"Skip", base:3 });
    if (allMonths && mVals.length === 6 && allColors && consecutive(mVals)) out.push({ name:"Run", base:3 });
    if (allWinds && allColors) out.push({ name:"Wind", base:3 });
    if (cross(cards, months, winds, mVals, wVals, allColors)) out.push({ name:"Cross", base:3 });

    if (allMonths && pairCounts === "2,2,2" && consecutive(mVals)) out.push({ name:"Triple Pair", base:6 });
    if (allWinds && windPairCounts === "2,2,2" && wVals.length === 3) out.push({ name:"Wind Pairs", base:6 });
    if (round && axisCounts(cards, seat, round, 2, 4)) out.push({ name:"Axis", base:6 });
    if (groupPairCounts === "2,2,2" && Object.keys(groupCounts).length === 3 && colors.size <= 2) out.push({ name:"Twin Tone Pairs", base:6 });
    if (allMonths && pairCounts === "2,2,2" && sameParity(mVals)) out.push({ name:"Parity Pairs", base:6 });

    if (allMonths && pairCounts === "3,3" && consecutive(mVals)) out.push({ name:"Twin Triples", base:9 });
    if (allWinds && windPairCounts === "3,3" && wVals.length === 2) out.push({ name:"Wind Triples", base:9 });
    if (round && axisCounts(cards, seat, round, 3, 3)) out.push({ name:"Grand Axis", base:9 });
    if (groupPairCounts === "3,3" && colors.size <= 3) out.push({ name:"Tri Tone Triples", base:9 });
    if (allMonths && pairCounts === "3,3" && sameParity(mVals)) out.push({ name:"Parity Triples", base:9 });

    if (allMonths && allColors && (pairCounts === "6" || crownFiveOne(monthCounts))) out.push({ name:"Crown", base:12 });
    if (allWinds && wVals.length === 1 && wVals[0] !== seat) out.push({ name:"Tempest", base:12 });
    if (allMonths && allColors && escort(monthCounts)) out.push({ name:"Escort", base:12 });
    if (allMonths && allColors && splitEscort(monthCounts)) out.push({ name:"Split Escort", base:12 });
    if (compass(cards, false)) out.push({ name:"Compass", base:12 });

    if (allMonths && allSameColor && mVals.length === 6 && sameParity(mVals)) out.push({ name:"Mono Skip", base:15 });
    if (allMonths && allSameColor && mVals.length === 6 && consecutive(mVals)) out.push({ name:"Mono Run", base:15 });
    if (round && allMonths && mVals.length === 1 && mVals[0] === round) out.push({ name:"Grand Crown", base:15 });
    if (allWinds && wVals.length === 1 && wVals[0] === seat) out.push({ name:"Grand Tempest", base:15 });
    if (compass(cards, true)) out.push({ name:"Mono Compass", base:15 });
    findPatternCache.set(cacheKey, out);
    if (findPatternCache.size > 60000) findPatternCache.clear();
    return out;
  }
  function cardSetKey(cards) {
    return cards.map(c => c.id).sort().join("|");
  }

  function counts(arr) { const o = {}; for (const x of arr) o[x] = (o[x] || 0) + 1; return o; }
  function vals(o) { return Object.keys(o).map(k => o[k]); }
  function sameParity(a) { return a.length && a.every(x => x % 2 === a[0] % 2); }

      winds.length === 4 &&
      mVals.length === 2 &&
      wVals.length === 4 &&
      allColors &&
      mVals[0] === 1 &&
      mVals[1] === 12;

  function crownFiveOne(mc) {
    const e = Object.entries(mc).map(([m,c]) => [Number(m), c]);
    if (e.length !== 2) return false;
    const five = e.find(x => x[1] === 5), one = e.find(x => x[1] === 1);

  }
  function escort(mc) {
    const e = Object.entries(mc).map(([m,c]) => [Number(m), c]).sort((a,b)=>b[1]-a[1]);

    const core = e.find(x => x[1] === 4);
    const singles = e.filter(x => x[1] === 1).map(x => x[0]).sort((a,b)=>a-b);
    return !!core && singles.length === 2 && singles[0] === core[0] - 1 && singles[1] === core[0] + 1;
  }
  function axisCounts(cards, seat, round, a, b) {
    let sw = 0, rm = 0, other = 0;
    for (const c of cards) {
      if (c.wind === seat) sw++;
      else if (c.month === round) rm++;
      else other++;
    }
    return other === 0 && ((sw === a && rm === b) || (sw === b && rm === a));
  }
  function compass(cards, mono) {
    if (windCompass(cards, mono)) return true;
    return monthRoadCompass(cards, mono);
  }

  function windCompass(cards, mono) {
    for (let color = 0; color < COLORS.length; color++) {
      const windSet = new Set(cards.filter(c => c.type === "wind" && c.color === color).map(c => c.wind));
      if (!WINDS.every(w => windSet.has(w))) continue;
      const rest = cards.filter(c => !(c.type === "wind" && c.color === color));
      if (rest.length !== 2 || rest.some(c => c.type !== "month")) continue;
      if (mono && rest.some(c => c.color !== color)) continue;
      if (rest[0].month === rest[1].month || Math.abs(rest[0].month - rest[1].month) === 1) return true;
    }
    return false;
  }

  function monthRoadCompass(cards, mono) {
    const months = cards.filter(c => c.type === "month");
    const winds = cards.filter(c => c.type === "wind");
    if (months.length !== 4 || winds.length !== 2) return false;
    if (new Set(winds.map(c => c.color)).size !== 1) return false;
    for (let color = 0; color < COLORS.length; color++) {
      const road = months.filter(c => c.color === color);
      if (road.length !== 4) continue;
      const mVals = [...new Set(road.map(c => c.month))].sort((a,b)=>a-b);
      if (mVals.length !== 4 || !consecutive(mVals)) continue;
      if (mono && cards.some(c => c.color !== color)) continue;
      return true;
    }
    return false;
  }

  function visibleDeadIds(player) {
    const own = new Set(player ? totalCards(player).map(c => c.id) : []);
    const dead = new Set();
    for (const p of game.players) {
      if (!p) continue;
      for (const c of p.discards || []) dead.add(c.id);
      for (const c of p.open || []) {
        if (!own.has(c.id)) dead.add(c.id);
      }
    }
    return dead;
  }

  function countWinningDraws(player, fiveCards, max, deadIds = visibleDeadIds(player)) {
    let n = 0;
    const seen = new Set(fiveCards.map(c => c.id));
    for (const c of deckCards()) {
      if (seen.has(c.id)) continue;
      if (deadIds && deadIds.has(c.id)) continue;
      if (bestWin(player, fiveCards.concat(c), "draw")) n++;
      if (n >= max) return n;
    }
    return n;
  }

  function winningDrawCards(player, fiveCards, max = 30, deadIds = visibleDeadIds(player)) {
    const waits = [];
    const seen = new Set(fiveCards.map(c => c.id));
    for (const c of deckCards()) {
      if (seen.has(c.id)) continue;
      if (deadIds && deadIds.has(c.id)) continue;
      if (bestWin(player, fiveCards.concat(c), "draw")) waits.push(c);
      if (waits.length >= max) break;
    }
    sortHand(waits);
    return waits;
  }

  function updateTenpai() {
    for (const p of game.players) {
      const cards = totalCards(p);
      if (cards.length === 5) {
        p.waitCards = winningDrawCards(p, cards, 30);
        p.tenpai = p.waitCards.length > 0;
        p.close = p.waitCards.length > 0 || nearShape(p);
      } else {
        p.tenpai = false;
        p.waitCards = [];
        p.close = nearShape(p);
      }
    }
    const human = game.players[0];
    if (human.tenpai && !game.seenTenpai) {

  function nearShape(p) {
    const cards = totalCards(p);
    const m = counts(cards.filter(c => c.month).map(c => c.month));
    const w = counts(cards.filter(c => c.wind).map(c => c.wind));
    return vals(m).some(v => v >= 3) || vals(w).some(v => v >= 3) ||
      new Set(cards.map(c => c.color)).size <= 2;
  }

  function groupKey(c) { return c.type === "month" ? `m${c.month}` : `w${c.wind}`; }
  function groupKeys(cards) { return [...new Set(cards.map(groupKey))]; }
  function removeWhere(arr, pred) {
    const out = [];
    for (let i = arr.length - 1; i >= 0; i--) if (pred(arr[i])) out.push(arr.splice(i,1)[0]);
    return out.reverse();
  }
  function cardLabel(c) { return c.type === "month" ? `${COLORS[c.color].code}${c.month}` : `${COLORS[c.color].code}${c.wind}`; }

  function ensureAudio() {
    if (game.muted) return;

    if (!audio && AC) audio = new AC();

  function syncBgm() {
    bgm.volume = BGM_VOLUME;

  function tone(freq, dur, type, gain, at) {
    if (!audio || game.muted) return;
    const t = audio.currentTime + (at || 0);
    const osc = audio.createOscillator();
    const g = audio.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.min(0.22, (gain || 0.08) * SFX_GAIN), t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(audio.destination);
    osc.start(t);
    osc.stop(t + dur + 0.04);
  }
  function tapTone(freq, dur, type, gain, at, endFreq) {
    if (!audio || game.muted) return;
    const t = audio.currentTime + (at || 0);
    const osc = audio.createOscillator();
    const g = audio.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(Math.max(20, freq), t);
    if (endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.min(0.18, (gain || 0.025) * SFX_GAIN), t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    osc.stop(t + dur + 0.025);
  }
  function noiseSweep(dur, gain, at, filterType, startFreq, endFreq, q) {
    if (!audio || game.muted) return;
    const t = audio.currentTime + (at || 0);

    const buffer = audio.createBuffer(1, len, audio.sampleRate);
    const data = buffer.getChannelData(0);
    let smooth = 0;
    for (let i = 0; i < len; i++) {
      const tail = 1 - i / len * .5;
      smooth = smooth * .82 + (Math.random() * 2 - 1) * .18;
      data[i] = smooth * tail;

    const filter = audio.createBiquadFilter();
    const g = audio.createGain();

  function playSfx(name, variant = 0) {

    else if (name === "pon") { tone(220,.08,"square",.06); tone(330,.12,"square",.04,.06); }
    else if (name === "kan") { tone(130,.18,"sawtooth",.08); tone(520,.22,"triangle",.05,.08); }
    else if (name === "tenpai") { tone(660,.12,"sine",.07); tone(990,.18,"sine",.06,.09); tone(1320,.18,"triangle",.04,.18); }
    else if (name === "win") { [392,523,659,784,1046].forEach((f,i)=>tone(f,.28,"triangle",.09,i*.075)); }
    else if (name === "start") { [196,294,392].forEach((f,i)=>tone(f,.16,"sine",.06,i*.08)); }
    else if (name === "draw") {
      const variants = [
        { shift:-24, body:.040, tick:.028, hum:.014 },
        { shift:-10, body:.037, tick:.030, hum:.015 },
        { shift:0, body:.039, tick:.026, hum:.015 },
        { shift:18, body:.035, tick:.028, hum:.014 },
        { shift:32, body:.037, tick:.024, hum:.016 }

      const v = variants[Math.floor(Math.random() * variants.length)];
      const drift = (Math.random() - .5) * 10;
      const delay = Math.random() * .006;
      tapTone(158 + v.shift * .24, .046, "triangle", v.body, delay, 108 + v.shift * .18);
      tapTone(720 + v.shift * 1.9 + drift, .034, "sine", v.tick, .018 + delay, 480 + v.shift * 1.1);

      tone(196 + v.shift * .25, .085, "sine", v.hum, .064 + delay);
    }
    else if (name === "claim") { tone(720,.08,"triangle",.05); }
    else if (name === "button") { tone(620,.045,"triangle",.04); tone(930,.065,"sine",.03,.035); }
    else if (name === "slice") {
      const lift = Math.min(8, variant) * 55;

      tone(1540 + lift * .8, .075, "triangle", .026, .018);
      tone(260 + lift * .08, .052, "square", .018, .045);

      tone(38, .48, "triangle", .08, .045);

  function updateFx(dt) {
    const f = dt / 16.67;
    shake *= Math.pow(0.86, f);
    let write = 0;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx*f; p.y += p.vy*f; p.vx *= .985; p.vy *= .985; p.vy += .025*f; p.life -= f;
      if (p.life > 0) particles[write++] = p;
    }
    particles.length = write;
    write = 0;
    for (let i = 0; i < floats.length; i++) {
      const fl = floats[i];
      fl.y += fl.vy*f; fl.life -= f;
      if (fl.life > 0) floats[write++] = fl;
    }
    floats.length = write;
    write = 0;
    for (let i = 0; i < ripples.length; i++) {
      const r = ripples[i];
      r.r += 5.2*f; r.life -= f;
      if (r.life > 0) ripples[write++] = r;
    }
    ripples.length = write;
  }

  function wrapText(text, x, y, maxWidth, lineHeight) {
    const words = text.split(" ");

      if (ctx.measureText(test).width > maxWidth && line) {
        ctx.fillText(line, x, y);
        line = word;
        y += lineHeight;

        const col = Math.floor(k / z.stack);
        const row = k % z.stack;
        const x = z.x + col * (cw + 7);
        const y = z.y + row * z.step;
        const c = p.discards[k];
        const dim = hintKey && groupKey(c) !== hintKey;
        drawCard(c, x, y, cw, ch, 0, true, dim ? .2 : .98);
        // drawDiscardBadge(c, x, y, cw, ch); NOTE: Commented-out for aesthetic, redesign if really needed to put back the badge on discarded cards
        if (game.lastDiscard === c && game.lastDiscarder === i) {
          ctx.save();
          ctx.globalAlpha = dim ? .2 : 1;
          ctx.strokeStyle = "#ffec72";
          ctx.lineWidth = 3;
          roundedRect(x-2,y-2,cw+4,ch+4,5);
          ctx.stroke();
          ctx.restore();
        }
      }
      ctx.restore();
    }
  }

  function hoveredHumanHandCard(now = frameNow || performance.now()) {
    if (game.mode !== "userTurn" || now < handHoverBlockedUntil) {
      clearDiscardMatchHint();
      return null;
    }
    const p = game.players[0];
    if (!p || !p.concealed) return null;
    const count = p.concealed.length;
    const cw = count > 6 ? 86 : 96;
    const ch = cw * 1.4;
    const gap = count > 6 ? 5 : 8;
    const start = DESIGN_W/2 - (count*cw + (count-1)*gap)/2;
    const y = 1060;
    for (let i = 0; i < count; i++) {
      const x = start + i * (cw + gap);
      if (pointer.x >= x && pointer.x <= x + cw && pointer.y >= y - 24 && pointer.y <= y + ch) {
        const card = p.concealed[i];
        if (pointer.kind !== "touch" || discardHint.card) {
          discardHint = { card, until:now + 140, candidate:card, since:discardHint.since };
          return card;
        }
        if (!pointer.down) return null;
        if (discardHint.candidate !== card) discardHint = { card:null, until:0, candidate:card, since:now };
        if (now - discardHint.since < 180) return null;
        discardHint = { card, until:now + 140, candidate:card, since:discardHint.since };
        return card;
      }
    }
    if (discardHint.card && now < discardHint.until) return discardHint.card;
    clearDiscardMatchHint();
    return null;
  }

  function renderDiscardMatchHints(now, hoverCard) {

      for (let k = 0; k < p.discards.length; k++) {
        const c = p.discards[k];
        if (groupKey(c) !== key) continue;
        const col = Math.floor(k / z.stack);
        const row = k % z.stack;
        const x = z.x + col * (cw + 7);
        const y = z.y + row * z.step;
        drawCard(c, x, y, cw, ch, 0, true, .98);

  function renderWaitCards(now) {
    const p = game.players[0];
    let waits = (p && p.tenpai && p.waitCards) ? p.waitCards : [];
    if (!waits.length) return;
    const cardW = 37, cardH = 50, gap = 5, perRow = 8;
    const shown = waits.slice(0, waits.length > 16 ? 15 : 16);
    const extra = waits.length - shown.length;
    const rows = Math.ceil((shown.length + (extra > 0 ? 1 : 0)) / perRow);
    const x = 198, y = rows > 1 ? 941 : 979;
    const blink = 0.52 + Math.sin(now / 190) * 0.32;

    const cardStartX = x + 88;
    const cardStartY = y + (rows > 1 ? 10 : 9);
    const cells = shown.concat(extra > 0 ? [null] : []);
    for (let i = 0; i < cells.length; i++) {
      const col = i % perRow;
      const row = Math.floor(i / perRow);

  function renderHumanHand(now) {
    const p = game.players[0];

    const ch = cw * 1.4;
    const gap = count > 6 ? 5 : 8;

    const allowHover = now >= handHoverBlockedUntil;
    const allowPointerHover = pointer.kind !== "touch" || pointer.down;
    for (let i=0;i<count;i++) {
      const x = start + i*(cw+gap);

      const canOpen = game.mode !== "matchOpen" || (game.awaiting && groupKey(c) === game.awaiting.key);
      const canAct = allowHover && allowPointerHover && (game.mode === "userTurn" || game.mode === "homeOpen" || (game.mode === "matchOpen" && canOpen));
      const hot = canAct && pointer.x >= x && pointer.x <= x + cw && pointer.y >= y - 24 && pointer.y <= y + ch;
      const lift = hot ? -20 : 0;
      const glow = p.tenpai ? (Math.sin(now/120)+1)/2 : 0;
      if (glow || hot) {
        ctx.save();
        ctx.globalAlpha = hot ? .34 : .15 + glow*.16;

      drawCard(c, x, y+lift, cw, ch, 0, true, 1);
      if (game.mode === "matchOpen" && canOpen) {
        ctx.save();

        ctx.lineWidth = 3;
        roundedRect(x - 4, y + lift - 4, cw + 8, ch + 8, 10);

      modal("Match open", "Tap a matching hand card to open it as gear", 760, 292);

  }

  function resultPanel(now = frameNow) {
    ctx.save();
    advanceResultQueue(now);
    const resultIndex = activeResultIndex();
    const result = game.lastResults[resultIndex];
    const elapsed = Math.max(0, now - game.resultStartedAt);
    if (result && elapsed < RESULT_MODAL_DELAY) {
      ctx.restore();
      return;
    }

    drawResultBackdrop(now, !!result);
    if (!result) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff1a8";
      ctx.font = "900 42px Georgia,serif";
      ctx.fillText(game.message, DESIGN_W/2, 410);
      ctx.fillStyle = "rgba(255,255,255,.72)";
      ctx.font = "800 20px Georgia,serif";
      ctx.fillText(game.sub || "", DESIGN_W/2, 452);
      drawStandingsCompact(570);
      ctx.restore();
      return;
    }

    updateResultReveal(result, now);
    const lines = result.lines || [];
    const lineClock = elapsed - RESULT_MODAL_DELAY - RESULT_LINE_DELAY;
    const visibleLines = lineClock < 0 ? 0 : Math.min(lines.length, Math.floor(lineClock / RESULT_LINE_INTERVAL) + 1);
    const finalAt = resultFinalRevealAt(result);
    const finalVisible = elapsed >= finalAt;
    const winner = game.players[result.player];
    const accent = result.method === "TSUMO" ? "#fff1a8" : "#ff6680";

    ctx.fillStyle = "rgba(5,8,12,.68)";
    roundedRect(42, 72, 636, 1012, 20);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,224,123,.36)";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.textAlign = "center";
    ctx.shadowColor = accent;
    ctx.shadowBlur = 24;
    ctx.fillStyle = accent;
    ctx.font = "900 30px Georgia,serif";
    ctx.fillText(`${winner.name} ${result.method}`, DESIGN_W/2, 120);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.font = "800 15px Georgia,serif";
    ctx.fillText(result.player === 0 ? "Your winning hand" : `${winner.name}'s winning hand`, DESIGN_W/2, 148);

    drawResultCards(result.cards || [], 176, resultIndex, result.method);

    const panelY = 310;
    ctx.fillStyle = "rgba(4,10,16,.78)";
    roundedRect(74, panelY, 572, 440, 14);
    ctx.fill();
    ctx.strokeStyle = "rgba(141,255,241,.24)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    const gap = lines.length > 7 ? 42 : 50;
    const startY = panelY + 52;
    for (let i = 0; i < visibleLines; i++) {
      const lineElapsed = lineClock - i * RESULT_LINE_INTERVAL;
      drawResultLine(lines[i], i, startY + i * gap, lineElapsed, gap);
    }

    if (finalVisible) drawResultFinal(result.rank, result.value, elapsed - finalAt);
    drawStandingsCompact(964);
    ctx.restore();
  }

  function resultFinalRevealAt(result) {
    const lines = result && result.lines ? result.lines.length : 0;
    return RESULT_MODAL_DELAY + RESULT_LINE_DELAY + lines * RESULT_LINE_INTERVAL + RESULT_FINAL_DELAY;
  }

  function resultCanAdvance(now = frameNow) {
    const result = game.lastResults[activeResultIndex()];
    if (!result) return true;
    if (activeResultIndex() < game.lastResults.length - 1) return false;
    return Math.max(0, now - game.resultStartedAt) >= resultFinalRevealAt(result) + 360;
  }

  function activeResultIndex() {
    if (!game.lastResults.length) return 0;
    return Math.max(0, Math.min(game.resultIndex || 0, game.lastResults.length - 1));
  }

  function advanceResultQueue(now = frameNow) {
    const index = activeResultIndex();
    const result = game.lastResults[index];
    if (!result || index >= game.lastResults.length - 1) return;
    const elapsed = Math.max(0, now - game.resultStartedAt);
    if (elapsed < resultFinalRevealAt(result) + RESULT_QUEUE_DELAY) return;
    game.resultIndex = index + 1;
    game.resultStartedAt = now - RESULT_MODAL_DELAY;
    game.resultFxStep = 0;
  }

  function drawResultBackdrop(now, hasWin) {
    ctx.fillStyle = "rgba(0,0,0,.92)";
    ctx.fillRect(0, 0, DESIGN_W, DESIGN_H);
    const pulse = hasWin ? (Math.sin(now * 0.0028) + 1) / 2 : 0;
    const glow = ctx.createRadialGradient(DESIGN_W/2, 310, 20, DESIGN_W/2, 330, 700);
    glow.addColorStop(0, `rgba(255,224,123,${0.18 + pulse * 0.06})`);
    glow.addColorStop(.42, "rgba(141,255,241,.08)");
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, DESIGN_W, DESIGN_H);
  }

  function updateResultReveal(result, now) {
    const lines = result.lines || [];
    const elapsed = Math.max(0, now - game.resultStartedAt);
    const lineClock = elapsed - RESULT_MODAL_DELAY - RESULT_LINE_DELAY;
    let targetStep = lineClock < 0 ? 0 : Math.min(lines.length, Math.floor(lineClock / RESULT_LINE_INTERVAL) + 1);
    if (elapsed >= resultFinalRevealAt(result)) targetStep = lines.length + 1;
    while (game.resultFxStep < targetStep) {
      if (game.resultFxStep < lines.length) {
        playSfx("slice", game.resultFxStep);
        burst(132, 360 + game.resultFxStep * 44, "#fff1a8", 18, 2.8);
      } else {
        playSfx("impact");
        shake = Math.max(shake, 12);
        ripple(DESIGN_W/2, 842, "#ffe07b");
        burst(DESIGN_W/2, 842, "#ffe07b", 96, 5.4);
      }
      game.resultFxStep++;
    }
  }

  function drawResultCards(cards, y, resultIndex = 0, method = "RON") {
    if (!cards.length) return;
    const cw = 66, ch = 93, gap = 8;
    const start = DESIGN_W/2 - (cards.length * cw + (cards.length - 1) * gap) / 2;
    for (let i = 0; i < cards.length; i++) {
      const lift = Math.sin(frameNow * 0.003 + i) * 2;
      drawCard(cards[i], start + i * (cw + gap), y + lift, cw, ch, 0, true, 1);
    }
    if (game.lastResults.length > 1) {
      ctx.fillStyle = "rgba(255,255,255,.66)";
      ctx.font = "800 13px Georgia,serif";
      ctx.textAlign = "center";
      const label = method === "RON" ? "Ron winner" : "Winner";
      ctx.fillText(`${label} ${resultIndex + 1} / ${game.lastResults.length}`, DESIGN_W/2, y + ch + 26);
    }
  }

  function drawResultLine(line, index, y, lineElapsed, gap) {
    const t = Math.max(0, Math.min(1, lineElapsed / 260));
    const ease = 1 - Math.pow(1 - t, 3);
    const x = 100 + (1 - ease) * 54;
    const w = 520;
    const h = Math.min(40, gap - 8);
    const colors = line.kind === "method" ? ["#fff1a8", "#ff8d4a"] :
      line.kind === "gear" ? ["#8dfff1", "#2fd3ff"] :
      line.kind === "bonus" ? ["#ffd66e", "#ff6680"] :
      ["#f7f3df", "#8dfff1"];
    ctx.save();
    ctx.globalAlpha = ease;
    ctx.shadowColor = colors[0];
    ctx.shadowBlur = 16 * ease;
    const g = ctx.createLinearGradient(x, y - h + 6, x + w, y + 8);
    g.addColorStop(0, "rgba(255,255,255,.12)");
    g.addColorStop(.42, "rgba(255,224,123,.08)");
    g.addColorStop(1, "rgba(141,255,241,.08)");
    ctx.fillStyle = g;
    roundedRect(x, y - h + 2, w, h, 8);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = `rgba(255,255,255,${0.14 + ease * 0.18})`;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.globalAlpha = ease * .32;
    ctx.strokeStyle = colors[0];
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - 12 + ease * 32, y - h + 7);
    ctx.lineTo(x + 94 + ease * 42, y + 2);
    ctx.stroke();
    ctx.globalAlpha = ease;
    ctx.textAlign = "left";
    const fontSize = gap < 46 ? 22 : 25;
    ctx.font = `900 ${fontSize}px Georgia,serif`;
    ctx.fillStyle = colors[0];
    ctx.fillText(line.label, x + 24, y - 11);
    ctx.textAlign = "right";
    ctx.font = `900 ${fontSize + 2}px Georgia,serif`;
    ctx.fillStyle = colors[1];
    ctx.fillText(`${line.points}pt`, x + w - 24, y - 11);
    ctx.restore();
  }

  function drawResultFinal(rank, total, elapsed) {
    const t = Math.max(0, Math.min(1, elapsed / 360));
    const ease = 1 - Math.pow(1 - t, 4);
    const y = rank ? 852 : 838;
    ctx.save();
    ctx.globalAlpha = ease;
    ctx.translate(DESIGN_W/2, y);
    ctx.scale(.84 + ease * .16, .84 + ease * .16);
    ctx.shadowColor = "#ffe07b";
    ctx.shadowBlur = 34;
    ctx.textAlign = "center";
    if (rank) {
      const g = ctx.createLinearGradient(-260, -42, 260, 32);
      g.addColorStop(0, "#8dfff1");
      g.addColorStop(.34, "#fff1a8");
      g.addColorStop(.68, "#ff6680");

  function toGamePoint(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) * dpr;
    const cy = (e.clientY - rect.top) * dpr;
    return { x:(cx - ox) / scale, y:(cy - oy) / scale };
  }
  function pointerDown(e) {
    e.preventDefault();
    ensureAudio();
    const p = toGamePoint(e.touches ? e.touches[0] : e);
    pointer.x = p.x; pointer.y = p.y; pointer.down = true; pointer.kind = e.touches ? "touch" : "mouse"; pointer.downAt = performance.now();
  }
  function pointerMove(e) {
    const p = toGamePoint(e.touches ? e.touches[0] : e);
    pointer.kind = e.touches ? "touch" : "mouse";
    pointer.x = p.x; pointer.y = p.y;
  }
  function pointerUp(e) {
    e.preventDefault();

    pointer.x = p.x; pointer.y = p.y; pointer.down = false; pointer.kind = e.changedTouches ? "touch" : pointer.kind;
    if (pointer.kind === "touch") discardHint = { card:null, until:0, candidate:null, since:0 };
    clickSpark(p.x, p.y);
    handleTap(p.x, p.y);

  canvas.addEventListener("mousedown", pointerDown);
  canvas.addEventListener("mousemove", pointerMove);
  canvas.addEventListener("mouseup", pointerUp);

  canvas.addEventListener("touchmove", pointerMove, { passive:false });

  function handleTap(x,y) {
    for (const b of buttons) {
      if (x >= b.x && x <= b.x+b.w && y >= b.y && y <= b.y+b.h) {
        if (performance.now() < game.lockUntil && !canUseWhileLocked(b.action)) return;
        playSfx("button");
        return action(b.action);
      }
    }
    if (performance.now() < game.lockUntil) return;
    if (game.mode === "between") return startHand();
    if (game.mode === "homeOpen") {
      for (const r of handRects) {
        if (x >= r.x && x <= r.x+r.w && y >= r.y && y <= r.y+r.h) {
          playSfx("button");

      }
    }
    if (game.mode === "matchOpen") {

  function canUseWhileLocked(actionName) {
    return ["sound", "help", "helpClose", "helpPrev", "helpNext", "auto", "home"].includes(actionName);
