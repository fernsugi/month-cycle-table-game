function applySelfKan(playerIndex, choice = buildSelfKanState(playerIndex)) {
  const player = getPlayer(playerIndex);
  if (!choice) return false;

  player.hand = choice.remainingHand;
  player.openCards = choice.nextOpenCards;
  setOpenClaimType(choice.claimGroup, "kan");
  state.currentTurn = playerIndex;
  state.pendingClaim = null;
  state.call = "Kan";
  state.lastDiscard = null;
  state.lastDrawnCardId = player.hand.some((card) => card.id === state.lastDrawnCardId) ? state.lastDrawnCardId : null;
  state.selectedCardId = null;
  logEvent(`${player.name} declares self-kan on ${claimGroupLabel(choice.claimGroup[0])}.`);

  if (player.isHuman) {
    state.phase = "human-discard";
    render();
    return true;
  }

  state.phase = "ai-thinking";
  render();
  setTimeout(() => {
    const discardChoice = chooseHardAIDiscard(playerIndex);
    const dangerNote = discardChoice.publicDanger > 0
      ? `Estimated discard danger ${Math.round(discardChoice.publicDanger)} after self-kan.`
      : `Discard after self-kan keeps ${discardChoice.drawStats.winningDraws} live public draws.`;
    discardCard(playerIndex, discardChoice.card.id, dangerNote);
  }, GAME_CONFIG.aiThinkDelayMs);
  return true;
}

function setInspect(card) {
  state.inspectCardId = card ? card.id : null;
}

function positionInspectPopup(target, pointerX = null, pointerY = null) {
  const popup = document.getElementById("inspectPopup");
  const rect = target.getBoundingClientRect();
  const popupRect = popup.getBoundingClientRect();
  const margin = 18;
  const anchorX = pointerX ?? rect.right;
  const anchorY = pointerY ?? rect.top + rect.height / 2;

  let left = anchorX + margin;
  if (left + popupRect.width > window.innerWidth - margin) {
    left = rect.left - popupRect.width - margin;
  }
  left = Math.max(margin, Math.min(left, window.innerWidth - popupRect.width - margin));

  let top = anchorY - popupRect.height / 2;
  top = Math.max(margin, Math.min(top, window.innerHeight - popupRect.height - margin));

  popup.style.left = `${left}px`;
  popup.style.top = `${top}px`;
}

function hideInspectPopup() {
  const popup = document.getElementById("inspectPopup");
  popup.classList.remove("open");
  popup.setAttribute("aria-hidden", "true");
}

function showInspectPopup(card, target, pointerX = null, pointerY = null) {
  setInspect(card);
  renderInspector();
  const popup = document.getElementById("inspectPopup");
  positionInspectPopup(target, pointerX, pointerY);
  popup.classList.add("open");
  popup.setAttribute("aria-hidden", "false");
}

function attachInspectHandlers(target, card) {
  if (!target || !card) return;
  target.addEventListener("mouseenter", (event) => {
    showInspectPopup(card, target, event.clientX, event.clientY);
  });
  target.addEventListener("mousemove", (event) => {
    positionInspectPopup(target, event.clientX, event.clientY);
  });
  target.addEventListener("mouseleave", hideInspectPopup);
  target.addEventListener("focus", () => {
    showInspectPopup(card, target);
  });
  target.addEventListener("blur", hideInspectPopup);
}

function cardById(id) {
  return allCards.find((card) => card.id === id) || null;
}

function claimWin(playerIndex, type, layouts, sourceCard = null, discarderIndex = null) {
  if (state.phase === "finished") return;
  const openCardCount = getPlayer(playerIndex).openCards.length;
  const scoringLayout = chooseBestLayout(layouts, openCardCount, playerIndex);
  const { basePoints, bonusPoints, points } = getLayoutPointBreakdown(scoringLayout || [], openCardCount, playerIndex);
  const settlement = settleWin(playerIndex, type, points, discarderIndex);
  clearTimeout(state.timer);
  state.phase = "finished";
  state.call = type.toUpperCase();
  state.pendingClaim = {
    playerIndex,
    type,
    layouts,
    scoringLayout,
    openCardCount,
    basePoints,
    bonusPoints,
    points,
    settlement,
    sourceCard,
    discarderIndex,
  };
  state.winner = playerIndex;
  state.winners = [playerIndex];
  const winnerTag = formatPlayerTag(playerIndex);
  const verb = type === "tsumo" ? "wins by tsumo" : `wins by ron on ${formatCardSource(sourceCard, discarderIndex)}`;
  logEvent(`${winnerTag} ${verb} for ${formatPointSummary(points, bonusPoints)}. ${formatSettlement(settlement)}`);
  updateMatchSummary();
  if (state.matchSummary) logEvent(formatMatchSummaryText());
  if (type === "tsumo") {
    sound.tsumo();
  } else {
    sound.ron();
  }
  render();
  setWinOverlay(true);
}

function claimMultiRon(threats, sourceCard, discarderIndex) {
  if (state.phase === "finished" || !threats.length) return;
  const { results, settlement } = settleRonThreats(threats, discarderIndex);
  const totalPoints = results.reduce((sum, result) => sum + result.points, 0);
  clearTimeout(state.timer);
  state.phase = "finished";
  state.call = "RON";
  state.pendingClaim = {
    type: "ron",
    ronResults: results,
    points: totalPoints,
    settlement,
    sourceCard,
    discarderIndex,
  };
  state.winners = results.map((result) => result.playerIndex);
  state.winner = state.winners[0] ?? null;
  const winnerNames = results.map((result) => formatPlayerTag(result.playerIndex)).join(" + ");
  const bonusText = results.some((result) => result.bonusPoints)
    ? ` (${results.map((result) => `${getPlayer(result.playerIndex).seat}: ${formatPointSummary(result.points, result.bonusPoints)}`).join(" · ")})`
    : "";
  logEvent(`${winnerNames} win by ron on ${formatCardSource(sourceCard, discarderIndex)} for ${totalPoints} points${bonusText}. ${formatSettlement(settlement)}`);
  updateMatchSummary();
  if (state.matchSummary) logEvent(formatMatchSummaryText());
  sound.ron();
  render();
  setWinOverlay(true);
}

function chiPlayerIndexFor(discarderIndex) {
  return (discarderIndex + 1) % state.players.length;
}

function canPlayerChi(playerIndex) {
  return getPlayer(playerIndex).hand.length > 0;
}

function beginDiscardClaimWindow(playerIndex, card) {
  state.pendingClaim = null;
  state.phase = "check-ron";
  render();
  setTimeout(() => resolveRon(playerIndex, card), GAME_CONFIG.ronCheckDelayMs);
}

function beginPostOpenClaimWindow(playerIndex, card) {
  state.pendingClaim = null;
  state.phase = "check-kan";

  setTimeout(() => resolveKan(playerIndex, card), GAME_CONFIG.ronCheckDelayMs);
}

function chooseAIHomeWindOpenCard(playerIndex, context = PUBLIC_AI_CONTEXT) {
  const player = getPlayer(playerIndex);
  if (!player?.hand.length) return null;

  const baseline = evaluateFutureHand(playerIndex, player.hand, player.openCards, [], context);
  const baselineWindAffinity = evaluateWindAffinity(getFullHand(playerIndex, player.hand, player.openCards), player.openCards.length, playerIndex);
  const candidates = player.hand
    .map((card) => {
      const nextHand = removeCardById(player.hand, card.id).next;
      const nextOpenCards = sortCardsForDisplay(player.openCards.concat(card));
      if (!lockedOpenCardsCanWin(nextOpenCards, playerIndex)) return null;
      const future = evaluateFutureHand(playerIndex, nextHand, nextOpenCards, [], context);
      const windAffinityGain = evaluateWindAffinity(getFullHand(playerIndex, nextHand, nextOpenCards), nextOpenCards.length, playerIndex) - baselineWindAffinity;
      const gearGain = gearUpgradeValue(baseline.focus, player.openCards.length, future.focus, nextOpenCards.length);
      const exposure = estimateOpenExposure(playerIndex, card);
      return {
        card,
        nextHand,
        nextOpenCards,
        future,
        gearGain,
        windAffinityGain,
        exposure,
        adjustedScore: future.score + gearGain * 34 + windAffinityGain * 0.55 - exposure * 10,
      };
    })
    .filter(Boolean)
    .sort((a, b) => {
      if (b.adjustedScore !== a.adjustedScore) return b.adjustedScore - a.adjustedScore;
      if (a.future.shape.bestDistance !== b.future.shape.bestDistance) {
        return a.future.shape.bestDistance - b.future.shape.bestDistance;
      }
      return b.card.id - a.card.id;
    });

  const best = candidates[0];
  if (!best) return null;

  const improvesDistance = best.future.shape.bestDistance < baseline.shape.bestDistance;
  const improvesWins = best.future.drawStats.winningDraws > baseline.drawStats.winningDraws;
  const improvesPoints = best.future.drawStats.bestWinningPoints > baseline.drawStats.bestWinningPoints;
  const improvesScore = best.adjustedScore >= baseline.score + 18;
  const improvesGear = best.gearGain > 0;
  const improvesWindPlan = best.windAffinityGain >= 18;
  const exposureIsAcceptable = best.exposure <= 2.1 || improvesDistance || improvesWins || improvesGear;
  return (exposureIsAcceptable && (improvesDistance || improvesWins || improvesPoints || improvesScore || improvesGear || improvesWindPlan))
    ? best.card
    : null;
}

function finalizeHomeWindOpen(playerIndex, discardedCard, openedCard = null) {
  const player = getPlayer(playerIndex);
  if (openedCard) {
    player.status = `Opened ${formatCardShort(openedCard)} after discarding home wind.`;
    logEvent(`${formatPlayerTag(playerIndex)} opens ${formatCardShort(openedCard)} after discarding home wind.`);
  } else {
    player.status = "Skipped home wind open.";
    logEvent(`${formatPlayerTag(playerIndex)} skips the home wind open.`);
  }
  state.call = "Open";
  beginPostOpenClaimWindow(playerIndex, discardedCard);
}

function maybeHandleHomeWindDiscard(playerIndex, discardedCard) {
  const player = getPlayer(playerIndex);
  if (!cardHomeWindMatchesPlayer(discardedCard, playerIndex) || !player.hand.length) {
    return false;
  }

  if (player.isHuman) {
    state.phase = "human-home-wind-open";
    state.pendingClaim = {
      playerIndex,
      type: "home-wind-open",
      sourceCard: discardedCard,
    };
    player.status = `Discarded home wind. Open 1 concealed card or pass.`;
    sound.prompt();
    render();
    return true;
  }

  state.phase = "ai-thinking";
  state.pendingClaim = {
    playerIndex,
    type: "home-wind-open",
    sourceCard: discardedCard,
  };
  render();
  setTimeout(() => {
    const openCard = chooseAIHomeWindOpenCard(playerIndex, decisionContextForPlayer(playerIndex, BRUTAL_AI_CONTEXT));
    if (openCard) {
      const removal = removeCardById(player.hand, openCard.id);
      player.hand = sortCardsForDisplay(removal.next);
      player.openCards = sortCardsForDisplay(player.openCards.concat(removal.removed));
      setOpenClaimType([removal.removed], "open");
      finalizeHomeWindOpen(playerIndex, discardedCard, removal.removed);
      return;
    }
    finalizeHomeWindOpen(playerIndex, discardedCard, null);
  }, GAME_CONFIG.aiThinkDelayMs);
  return true;
}

function applyMonthClaim(type, playerIndex, card, discarderIndex) {
  const player = getPlayer(playerIndex);
  const discarder = getPlayer(discarderIndex);
  const claimState = buildMonthClaimState(playerIndex, card, type);
  if (!claimState) return false;

  const removedDiscard = removeLastCardById(discarder.discards, card.id);
  discarder.discards = removedDiscard.next;
  player.hand = claimState.remainingHand;
  player.openCards = claimState.nextOpenCards;
  setOpenClaimType(claimState.claimGroup, type);
  state.currentTurn = playerIndex;
  state.pendingClaim = null;
  state.call = type[0].toUpperCase() + type.slice(1);
  state.lastDiscard = null;
  state.lastDrawnCardId = null;
  state.selectedCardId = null;
  logEvent(`${formatPlayerTag(playerIndex)} calls ${type} on ${formatCardSource(card, discarderIndex)}.`);

  if (player.isHuman) {
    state.phase = "human-discard";
    render();
    return true;
  }

  state.phase = "ai-thinking";
  render();
  setTimeout(() => {
    const choice = chooseHardAIDiscard(playerIndex);
    const dangerNote = choice.publicDanger > 0
      ? `Estimated discard danger ${Math.round(choice.publicDanger)} after ${type}.`
      : `Discard after ${type} keeps ${choice.drawStats.winningDraws} live public draws.`;
    discardCard(playerIndex, choice.card.id, dangerNote);
  }, GAME_CONFIG.aiThinkDelayMs);
  return true;
}

function applyChi(playerIndex, card, discarderIndex) {
  const player = getPlayer(playerIndex);
  const discarder = getPlayer(discarderIndex);
  const removedDiscard = removeLastCardById(discarder.discards, card.id);
  discarder.discards = removedDiscard.next;
  player.openCards = player.openCards.concat(card);
  setOpenClaimType([card], "chi");
  state.currentTurn = playerIndex;
  state.pendingClaim = null;
  state.call = "Chi";
  state.lastDiscard = null;
  state.lastDrawnCardId = null;
  state.selectedCardId = null;
  logEvent(`${formatPlayerTag(playerIndex)} calls chi on ${formatCardSource(card, discarderIndex)}.`);

  if (player.isHuman) {
    state.phase = "human-discard";
    render();
    return;
  }

  state.phase = "ai-thinking";
  render();
  setTimeout(() => {
    const choice = chooseHardAIDiscard(playerIndex);
    const dangerNote = choice.publicDanger > 0
      ? `Estimated discard danger ${Math.round(choice.publicDanger)} after chi.`
      : `Discard after chi keeps ${choice.drawStats.winningDraws} live public draws.`;
    discardCard(playerIndex, choice.card.id, dangerNote);
  }, GAME_CONFIG.aiThinkDelayMs);
}

function resolveKan(discarderIndex, card) {
  const kanThreats = exactKanThreats(discarderIndex, card);
  if (!kanThreats.length) {
    resolvePon(discarderIndex, card);
    return;
  }

  for (let index = 0; index < kanThreats.length; index += 1) {
    const threat = kanThreats[index];
    if (isHumanIndex(threat.playerIndex)) {
      state.phase = "human-kan";
      state.pendingClaim = {
        playerIndex: threat.playerIndex,
        type: "kan",
        sourceCard: card,
        discarderIndex,
        claimers: kanThreats.slice(index),
      };
      sound.prompt();
      render();
      return;
    }

    if (chooseHardAIKan(threat.playerIndex, card)) {
      applyMonthClaim("kan", threat.playerIndex, card, discarderIndex);
      return;
    }
  }

  resolvePon(discarderIndex, card);
}

function resolvePon(discarderIndex, card) {
  const ponThreats = exactPonThreats(discarderIndex, card);
  if (!ponThreats.length) {
    resolveChi(discarderIndex, card);
    return;
  }

  for (let index = 0; index < ponThreats.length; index += 1) {
    const threat = ponThreats[index];
    if (isHumanIndex(threat.playerIndex)) {
      state.phase = "human-pon";
      state.pendingClaim = {
        playerIndex: threat.playerIndex,
        type: "pon",
        sourceCard: card,
        discarderIndex,
        claimers: ponThreats.slice(index),
      };
      sound.prompt();
      render();
      return;
    }

    if (chooseHardAIPon(threat.playerIndex, card)) {
      applyMonthClaim("pon", threat.playerIndex, card, discarderIndex);
      return;
    }
  }

  resolveChi(discarderIndex, card);
}

function resolveChi(discarderIndex, card) {
  const chiPlayerIndex = chiPlayerIndexFor(discarderIndex);
  if (!canPlayerChi(chiPlayerIndex)) {
    advanceTurn();
    return;
  }

  const chiPlayer = getPlayer(chiPlayerIndex);
  if (chiPlayer.isHuman) {
    state.phase = "human-chi";
    state.pendingClaim = {
      playerIndex: chiPlayerIndex,
      type: "chi",
      sourceCard: card,
      discarderIndex,
    };
    sound.prompt();
    render();
    return;
  }

  const chiChoice = chooseHardAIChi(chiPlayerIndex, card);
  if (!chiChoice) {
    advanceTurn();
    return;
  }

  applyChi(chiPlayerIndex, card, discarderIndex);
}

function advanceTurn() {
  state.currentTurn = (state.currentTurn + 1) % state.players.length;
  state.lastDrawnCardId = null;
  state.selectedCardId = null;
  state.pendingClaim = null;
  if (state.wall.length === 0) {
    state.phase = "finished";
    state.call = "Draw";
    logEvent("The wall is exhausted. Hand ends in a draw.");
    updateMatchSummary();
    if (state.matchSummary) {
      logEvent(formatMatchSummaryText());
      setWinOverlay(true);
    }
    render();
    return;
  }
  queueTurn(GAME_CONFIG.nextTurnDelayMs);
}

function resolveRon(discarderIndex, card) {
  const ronThreats = exactRonThreats(discarderIndex, card);
  if (!ronThreats.length) {
    if (maybeHandleHomeWindDiscard(discarderIndex, card)) {
      return;
    }
    resolveKan(discarderIndex, card);
    return;
  }

  const humanThreat = ronThreats.find((threat) => getPlayer(threat.playerIndex).isHuman);
  if (humanThreat) {
    state.phase = "human-ron";
    state.pendingClaim = {
      playerIndex: humanThreat.playerIndex,
      type: "ron",
      layouts: humanThreat.layouts,
      sourceCard: card,
      discarderIndex,
      ronThreats,
    };
    sound.prompt();
    render();
    return;
  }

  claimMultiRon(ronThreats, card, discarderIndex);
}

function discardCard(playerIndex, cardId, note = "") {
  const player = getPlayer(playerIndex);
  const result = removeCardById(player.hand, cardId);
  if (!result.removed) return;
  player.hand = sortCardsForDisplay(result.next);
  player.discards.push(result.removed);
  state.lastDrawnCardId = null;
  player.status = note || "Discarded.";
  state.lastDiscard = {
    playerIndex,
    card: result.removed,
    note,
  };
  state.call = "Discard";
  logEvent(`${formatPlayerTag(playerIndex)} discards ${formatCardShort(result.removed)}.${note ? ` ${note}` : ""}`);
  sound.discard();
  render();
  beginDiscardClaimWindow(playerIndex, result.removed);
}

function beginTurn() {
  if (state.phase === "finished") return;
  const player = getPlayer(state.currentTurn);
  state.phase = "draw";
  state.call = "Draw";
  const drawn = state.wall.pop();
  player.hand = sortCardsForDisplay(player.hand.concat(drawn));
  state.lastDrawnCardId = drawn.id;
  player.status = player.isHuman
    ? `You drew to ${GAME_CONFIG.winningHandSize}. Discard or declare tsumo.`
    : "Brutal AI evaluating draw.";
  setInspect(drawn);
  logEvent(`${formatPlayerTag(state.currentTurn)} draws from the wall.`);
  sound.draw();

  const winningLayouts = findValidWinningLayouts(getFullHand(state.currentTurn), player.openCards.length, player.openCards, state.currentTurn);
  if (winningLayouts.length) {
    if (player.isHuman) {
      state.phase = "human-tsumo";
      state.pendingClaim = {
        playerIndex: state.currentTurn,
        type: "tsumo",
        layouts: winningLayouts,
        sourceCard: drawn,
      };
      sound.prompt();
      render();
      return;
    }
    claimWin(state.currentTurn, "tsumo", winningLayouts, drawn, null);
    return;
  }

  if (!player.isHuman) {
    const selfKanChoice = chooseHardAISelfKan(state.currentTurn);
    if (selfKanChoice) {
      applySelfKan(state.currentTurn, selfKanChoice);
      return;
    }
  }

  if (player.isHuman) {
    state.phase = "human-discard";
    sound.prompt();
    render();
    return;
  }

  state.phase = "ai-thinking";
  render();
  setTimeout(() => {
    const choice = chooseHardAIDiscard(state.currentTurn);
    const dangerNote = choice.publicDanger > 0
      ? `Estimated discard danger ${Math.round(choice.publicDanger)}.`
      : `Kept ${choice.drawStats.winningDraws} live public draws for ${choice.drawStats.totalWinningPoints} total points.`;
    discardCard(state.currentTurn, choice.card.id, dangerNote);
  }, GAME_CONFIG.aiThinkDelayMs);
}

function queueTurn(delay) {
  clearTimeout(state.timer);
  state.timer = setTimeout(beginTurn, delay);
}

function declareHumanTsumo() {
  if (state.phase === "finished") return;
  if (!state.pendingClaim || state.pendingClaim.type !== "tsumo") return;
  claimWin(state.pendingClaim.playerIndex, "tsumo", state.pendingClaim.layouts, state.pendingClaim.sourceCard, null);
}

function declareHumanRon() {
  if (state.phase === "finished") return;
  if (!state.pendingClaim || state.pendingClaim.type !== "ron") return;
  claimMultiRon(
    state.pendingClaim.ronThreats || [],
    state.pendingClaim.sourceCard,
    state.pendingClaim.discarderIndex
  );
}

function declareHumanKan() {
  if (state.phase === "finished") return;
  if (state.pendingClaim?.type === "kan") {
    applyMonthClaim(
      "kan",
      state.pendingClaim.playerIndex,
      state.pendingClaim.sourceCard,
      state.pendingClaim.discarderIndex
    );
    return;
  }
  if (state.phase !== "human-discard" || state.currentTurn !== HUMAN_PLAYER_INDEX) return;
  const selfKanChoice = buildSelfKanState(HUMAN_PLAYER_INDEX);
  if (!selfKanChoice) return;
  applySelfKan(HUMAN_PLAYER_INDEX, selfKanChoice);
}

function declareHumanHomeWindOpen(cardId) {
  if (state.phase !== "human-home-wind-open") return;
  if (!state.pendingClaim || state.pendingClaim.type !== "home-wind-open") return;
  const player = getPlayer(HUMAN_PLAYER_INDEX);
  const result = removeCardById(player.hand, cardId);
  if (!result.removed) return;
  player.hand = sortCardsForDisplay(result.next);
  player.openCards = sortCardsForDisplay(player.openCards.concat(result.removed));
  setOpenClaimType([result.removed], "open");
  state.selectedCardId = null;
  finalizeHomeWindOpen(HUMAN_PLAYER_INDEX, state.pendingClaim.sourceCard, result.removed);
}

function declareHumanPon() {
  if (state.phase === "finished") return;
  if (!state.pendingClaim || state.pendingClaim.type !== "pon") return;
  applyMonthClaim(
    "pon",
    state.pendingClaim.playerIndex,
    state.pendingClaim.sourceCard,
    state.pendingClaim.discarderIndex
  );
}

function declareHumanChi() {
  if (state.phase === "finished") return;
  if (!state.pendingClaim || state.pendingClaim.type !== "chi") return;
  applyChi(
    state.pendingClaim.playerIndex,
    state.pendingClaim.sourceCard,
    state.pendingClaim.discarderIndex
  );
}

function passHumanClaim() {
  if (!state.pendingClaim) return;
  if (state.pendingClaim.type === "home-wind-open") {
    const sourceCard = state.pendingClaim.sourceCard;
    state.pendingClaim = null;
    state.selectedCardId = null;
    sound.pass();
    finalizeHomeWindOpen(HUMAN_PLAYER_INDEX, sourceCard, null);
    return;
  }
  if (state.pendingClaim.type === "tsumo") {
    const player = getPlayer(state.pendingClaim.playerIndex);
    state.pendingClaim = null;
    state.phase = "human-discard";
    state.call = "Pass";
    player.status = `You pass tsumo and keep playing. Discard to continue.`;
    logEvent("You pass on tsumo and keep the draw.");
    sound.pass();
    render();
    return;
  }

  if (state.pendingClaim.type === "ron") {
    const remainingThreats = (state.pendingClaim.ronThreats || [])
      .filter((threat) => !getPlayer(threat.playerIndex).isHuman);
    const sourceCard = state.pendingClaim.sourceCard;
    const discarderIndex = state.pendingClaim.discarderIndex;
    state.pendingClaim = null;
    state.call = "Pass";
    logEvent("You pass on ron.");
    sound.pass();

    if (remainingThreats.length) {
      claimMultiRon(remainingThreats, sourceCard, discarderIndex);
      return;
    }

    render();
    if (maybeHandleHomeWindDiscard(discarderIndex, sourceCard)) {
      return;
    }
    resolveKan(discarderIndex, sourceCard);
    return;
  }

  if (state.pendingClaim.type === "kan") {
    const remainingClaimers = (state.pendingClaim.claimers || []).slice(1);
    const sourceCard = state.pendingClaim.sourceCard;
    const discarderIndex = state.pendingClaim.discarderIndex;
    state.pendingClaim = null;
    state.call = "Pass";
    logEvent("You pass on kan.");
    sound.pass();

    for (const threat of remainingClaimers) {
      if (chooseHardAIKan(threat.playerIndex, sourceCard)) {
        applyMonthClaim("kan", threat.playerIndex, sourceCard, discarderIndex);
        return;
      }
    }

    render();
    resolvePon(discarderIndex, sourceCard);
    return;
  }

  if (state.pendingClaim.type === "pon") {
    const remainingClaimers = (state.pendingClaim.claimers || []).slice(1);
    const sourceCard = state.pendingClaim.sourceCard;
    const discarderIndex = state.pendingClaim.discarderIndex;
    state.pendingClaim = null;
    state.call = "Pass";
    logEvent("You pass on pon.");
    sound.pass();

    for (const threat of remainingClaimers) {
      if (chooseHardAIPon(threat.playerIndex, sourceCard)) {
        applyMonthClaim("pon", threat.playerIndex, sourceCard, discarderIndex);
        return;
      }
    }

    render();
    resolveChi(discarderIndex, sourceCard);
    return;
  }

  if (state.pendingClaim.type === "chi") {
    state.pendingClaim = null;
    state.call = "Pass";
    logEvent("You pass on chi.");
    sound.pass();
    render();
    advanceTurn();
  }
}

function onHumanDiscard(cardId) {
  if (state.phase !== "human-discard") return;
  if (state.currentTurn !== HUMAN_PLAYER_INDEX) return;
  if (state.pendingClaim?.type === "tsumo") return;
  if (!getHumanPlayer().hand.some((card) => card.id === cardId)) return;
  state.pendingClaim = null;
  state.selectedCardId = cardId;
  render();
  discardCard(HUMAN_PLAYER_INDEX, cardId, `${getPlayer(HUMAN_PLAYER_INDEX).seat} chooses to press the table.`);
}

function dealOpeningHands(resetMatch = false) {
  if (resetMatch) {
    state.points = Array(TABLE_CONFIG.players.length).fill(GAME_CONFIG.startingPoints);
    state.roundNumber = 1;
    state.matchFinished = false;
    state.matchSummary = null;
    state.dealerIndex = Math.floor(Math.random() * TABLE_CONFIG.players.length);
  } else {
    state.dealerIndex = dealerIndexForNextHand();
  }
  state.players = makePlayers();
  state.wall = shuffle(allCards);
  state.currentTurn = state.dealerIndex;
  state.phase = "dealing";
  state.call = "Deal";
  state.pendingClaim = null;
  state.lastDiscard = null;
  state.lastDrawnCardId = null;
  state.openCardClaims = {};
  state.selectedCardId = null;
  state.inspectCardId = null;
  state.logs = [];
  state.winner = null;
  state.winners = [];
  if (!resetMatch) {
    state.matchFinished = false;
    state.matchSummary = null;
  }
  setWinOverlay(false);
  setLogOverlay(false);
  setDiscardOverlay(false);
  setSetsOverlay(false);

  for (let round = 0; round < GAME_CONFIG.startingHandSize; round += 1) {
    state.players.forEach((player) => {
      player.hand.push(state.wall.pop());
      player.hand = sortCardsForDisplay(player.hand);
    });
  }

  logEvent(`Round ${getRoundLabel()} opens. ${getPlayer(state.dealerIndex).name} takes East and opens.`);
  sound.deal();
  render();
  queueTurn(GAME_CONFIG.wallDrawDelayMs);
}

function continueAfterFinishedHand() {
  if (state.matchFinished) {
    dealOpeningHands(true);
    return;
  }
  state.roundNumber += 1;
  dealOpeningHands(false);
}

function getConfigPath(config, path) {
  return path.split(".").reduce((value, key) => value?.[key], config);
}

function setConfigPath(target, path, value) {
  const keys = path.split(".");
  let cursor = target;
  keys.slice(0, -1).forEach((key) => {
    cursor[key] = cursor[key] || {};
    cursor = cursor[key];
  });
  cursor[keys[keys.length - 1]] = value;
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function randomBetween(min, max) {
  return min + Math.random() * (max - min);
}

function tuningProfileFromValues(id, values, parentIds = []) {
  const overrides = {};
  AI_TUNING_PARAMETERS.forEach((parameter) => {
    setConfigPath(overrides, parameter.path, values[parameter.path]);
  });
  return {
    id,
    name: `AI-${id}`,
    parentIds,
    overrides,
    values,
  };
}

function makeRandomTuningProfile(id, spread = 0.35) {
  const values = {};
  AI_TUNING_PARAMETERS.forEach((parameter) => {
    const base = getConfigPath(AI_BASE_CONFIG, parameter.path);
    const low = Math.max(parameter.min, base * (1 - spread));
    const high = Math.min(parameter.max, base * (1 + spread));
    values[parameter.path] = randomBetween(low, high);
  });
  return tuningProfileFromValues(id, values);
}

function mutateTuningProfile(parent, id, mutationScale = 1) {
  const values = {};
  AI_TUNING_PARAMETERS.forEach((parameter) => {
    const base = parent.values[parameter.path] ?? getConfigPath(AI_BASE_CONFIG, parameter.path);
    const swing = parameter.mutation * mutationScale;
    const next = base * (1 + randomBetween(-swing, swing));
    values[parameter.path] = clamp(next, parameter.min, parameter.max);
  });
  return tuningProfileFromValues(id, values, [parent.id]);
}

function breedTuningProfiles(parentA, parentB, id, mutationScale = 0.8) {
  const values = {};
  AI_TUNING_PARAMETERS.forEach((parameter) => {
    const inherited = Math.random() < 0.5
      ? parentA.values[parameter.path]
      : parentB.values[parameter.path];
    const swing = parameter.mutation * mutationScale;
    values[parameter.path] = clamp(inherited * (1 + randomBetween(-swing, swing)), parameter.min, parameter.max);
  });
  return tuningProfileFromValues(id, values, [parentA.id, parentB.id]);
}

function makeBaselineTuningProfile(id = "base") {
  const values = {};
  AI_TUNING_PARAMETERS.forEach((parameter) => {
    values[parameter.path] = getConfigPath(AI_BASE_CONFIG, parameter.path);
  });
  return tuningProfileFromValues(id, values);
}

function makeAIOnlyPlayers(profiles = []) {
  return TABLE_CONFIG.players.map((player, index) => ({
    ...player,
    isHuman: false,
    seat: seatForPlayer(index, state.dealerIndex),
    homeWind: HOME_WIND_BY_SEAT[seatForPlayer(index, state.dealerIndex)],
    points: state.points[index],
    aiProfile: profiles[index] || null,
    hand: [],
    openCards: [],
    discards: [],
    status: "AI simulation",
  }));
}

function recordSimulationWin(metrics, playerIndex, layouts, openCardCount, type, discarderIndex = null) {
  const scoringLayout = chooseBestLayout(layouts, openCardCount, playerIndex);
  const ruleIds = new Set((scoringLayout || []).map((group) => group.ruleId));
  const cards = getLayoutCards(scoringLayout || []);
  const points = totalLayoutPoints(scoringLayout || [], openCardCount, playerIndex);
  metrics.handsEnded += 1;
  metrics.totalWinPoints += points;
  metrics.winPointsByPlayer[playerIndex] = (metrics.winPointsByPlayer[playerIndex] || 0) + points;
  metrics.winsByType[type] = (metrics.winsByType[type] || 0) + 1;
  metrics.winsByPlayer[playerIndex] = (metrics.winsByPlayer[playerIndex] || 0) + 1;
  if (type === "tsumo") {
    const share = points / (state.players.length - 1);
    state.players.forEach((_, index) => {
      if (index === playerIndex) return;
      metrics.pointDelta[index] -= share;
      metrics.pointDelta[playerIndex] += share;
    });
  } else if (discarderIndex !== null) {
    metrics.dealIns[discarderIndex] = (metrics.dealIns[discarderIndex] || 0) + 1;
    metrics.pointDelta[playerIndex] += points;
    metrics.pointDelta[discarderIndex] -= points;
  }
  if (cards.some(isWindCard) || Array.from(ruleIds).some((ruleId) => ALWAYS_WIND_RULE_IDS.has(ruleId))) {
    metrics.windWins += 1;
  }
  ruleIds.forEach((ruleId) => {
    metrics.rules[ruleId] = (metrics.rules[ruleId] || 0) + 1;
  });
}

function simulateAIDiscardResolution(discarderIndex, card, metrics, depth = 0) {
  if (depth > 12) return { ended: false, nextTurn: (discarderIndex + 1) % state.players.length };

  const ronThreats = exactRonThreats(discarderIndex, card);
  if (ronThreats.length) {
    ronThreats.forEach((threat) => {
      recordSimulationWin(metrics, threat.playerIndex, threat.layouts, threat.openCardCount, "ron", discarderIndex);
    });
    return { ended: true, nextTurn: null };
  }

  if (cardHomeWindMatchesPlayer(card, discarderIndex) && getPlayer(discarderIndex).hand.length) {
    const openCard = withAIProfile(discarderIndex, () => (
      chooseAIHomeWindOpenCard(discarderIndex, decisionContextForPlayer(discarderIndex, metrics.decisionContext || BRUTAL_AI_CONTEXT))
    ));
    if (openCard) {
      const player = getPlayer(discarderIndex);
      const removal = removeCardById(player.hand, openCard.id);
      player.hand = sortCardsForDisplay(removal.next);
      player.openCards = sortCardsForDisplay(player.openCards.concat(removal.removed));
      metrics.homeWindOpens += 1;
    } else {
      metrics.homeWindOpenSkips += 1;
    }
  }

  for (const threat of exactKanThreats(discarderIndex, card)) {
    const choice = withAIProfile(threat.playerIndex, () => (
      chooseAIKanWithContext(threat.playerIndex, card, decisionContextForPlayer(threat.playerIndex, metrics.decisionContext || BRUTAL_AI_CONTEXT))
    ));
    if (!choice) continue;
    const claimer = getPlayer(threat.playerIndex);
    const discarder = getPlayer(discarderIndex);
    discarder.discards = removeLastCardById(discarder.discards, card.id).next;
    claimer.hand = choice.remainingHand;
    claimer.openCards = choice.nextOpenCards;
    metrics.kanClaims += 1;
    return simulateAIClaimDiscard(threat.playerIndex, metrics, depth + 1);
  }

  for (const threat of exactPonThreats(discarderIndex, card)) {
    const choice = withAIProfile(threat.playerIndex, () => (
      chooseAIPonWithContext(threat.playerIndex, card, decisionContextForPlayer(threat.playerIndex, metrics.decisionContext || BRUTAL_AI_CONTEXT))
    ));
    if (!choice) continue;
    const claimer = getPlayer(threat.playerIndex);
    const discarder = getPlayer(discarderIndex);
    discarder.discards = removeLastCardById(discarder.discards, card.id).next;
    claimer.hand = choice.remainingHand;
    claimer.openCards = choice.nextOpenCards;
    metrics.ponClaims += 1;
    return simulateAIClaimDiscard(threat.playerIndex, metrics, depth + 1);
  }

  const chiPlayerIndex = chiPlayerIndexFor(discarderIndex);
  if (canPlayerChi(chiPlayerIndex)) {
    metrics.chiOffers += 1;
    const choice = withAIProfile(chiPlayerIndex, () => (
      chooseAIChiWithContext(chiPlayerIndex, card, decisionContextForPlayer(chiPlayerIndex, metrics.decisionContext || BRUTAL_AI_CONTEXT))
    ));
    if (choice) {
      const claimer = getPlayer(chiPlayerIndex);
      const discarder = getPlayer(discarderIndex);
      discarder.discards = removeLastCardById(discarder.discards, card.id).next;
      claimer.openCards = sortCardsForDisplay(claimer.openCards.concat(card));
      metrics.chiClaims += 1;
      if (isWindCard(card)) metrics.windChiClaims += 1;
      return simulateAIClaimDiscard(chiPlayerIndex, metrics, depth + 1);
    }
  }

  return { ended: false, nextTurn: (discarderIndex + 1) % state.players.length };
}

function simulateAIClaimDiscard(playerIndex, metrics, depth = 0) {
  const decisionContext = decisionContextForPlayer(playerIndex, metrics.decisionContext || BRUTAL_AI_CONTEXT);
  const choice = withAIProfile(playerIndex, () => (
    chooseAIDiscardWithContext(playerIndex, getPlayer(playerIndex).hand, getPlayer(playerIndex).openCards, [], true, decisionContext)
  ));
  if (!choice) return { ended: false, nextTurn: (playerIndex + 1) % state.players.length };
  const player = getPlayer(playerIndex);
  const removal = removeCardById(player.hand, choice.card.id);
  player.hand = sortCardsForDisplay(removal.next);
  player.discards.push(removal.removed);
  metrics.discards += 1;
  if (isWindCard(removal.removed)) metrics.windDiscards += 1;
  return simulateAIDiscardResolution(playerIndex, removal.removed, metrics, depth);
}

function simulateAIHandForMetrics(
  roundNumber = 1,
  profiles = [],
  points = Array(TABLE_CONFIG.players.length).fill(GAME_CONFIG.startingPoints),
  dealerIndex = null,
  simOptions = {}
) {
  state.points = points.slice();
  state.roundNumber = roundNumber;
  state.dealerIndex = dealerIndex ?? Math.floor(Math.random() * TABLE_CONFIG.players.length);
  state.players = makeAIOnlyPlayers(profiles);
  state.wall = shuffle(allCards);
  state.currentTurn = state.dealerIndex;
  state.openCardClaims = {};
  state.lastDiscard = null;

  for (let round = 0; round < GAME_CONFIG.startingHandSize; round += 1) {
    state.players.forEach((player) => {
      player.hand = sortCardsForDisplay(player.hand.concat(state.wall.pop()));
    });
  }

  const metrics = {
    handsEnded: 0,
    winsByType: {},
    winsByPlayer: {},
    decisionContext: simOptions.decisionContext || BRUTAL_AI_CONTEXT,
    rules: {},
    dealIns: {},
    pointDelta: Array(TABLE_CONFIG.players.length).fill(0),
    winPointsByPlayer: {},
    totalWinPoints: 0,
    windWins: 0,
    discards: 0,
    windDiscards: 0,
    chiOffers: 0,
    chiClaims: 0,
    windChiClaims: 0,
    ponClaims: 0,
    kanClaims: 0,
    selfKans: 0,
    homeWindOpens: 0,
    homeWindOpenSkips: 0,
    wallDraws: 0,
    draws: 0,
  };

  let turnGuard = 0;
  while (state.wall.length && metrics.handsEnded === 0 && turnGuard < 220) {
    turnGuard += 1;
    const player = getPlayer(state.currentTurn);
    const drawn = state.wall.pop();
    player.hand = sortCardsForDisplay(player.hand.concat(drawn));
    metrics.wallDraws += 1;

    const winningLayouts = findValidWinningLayouts(getFullHand(state.currentTurn), player.openCards.length, player.openCards, state.currentTurn);
    if (winningLayouts.length) {
      recordSimulationWin(metrics, state.currentTurn, winningLayouts, player.openCards.length, "tsumo");
      break;
    }

    const selfKanChoice = withAIProfile(state.currentTurn, () => (
      chooseAISelfKanWithContext(state.currentTurn, decisionContextForPlayer(state.currentTurn, metrics.decisionContext))
    ));
    if (selfKanChoice) {
      player.hand = selfKanChoice.remainingHand;
      player.openCards = selfKanChoice.nextOpenCards;
      metrics.selfKans += 1;
      const result = simulateAIClaimDiscard(state.currentTurn, metrics);
      if (result.ended) break;
      state.currentTurn = result.nextTurn;
      continue;
    }

    const result = simulateAIClaimDiscard(state.currentTurn, metrics);
    if (result.ended) break;
    state.currentTurn = result.nextTurn;
  }

  if (metrics.handsEnded === 0) metrics.draws += 1;
  return metrics;
}

function addHandMetricsToSeatStats(stats, metrics, seatIndex) {
  stats.handsWon += metrics.winsByPlayer[seatIndex] || 0;
  stats.dealIns += metrics.dealIns[seatIndex] || 0;
  stats.totalWinPoints += metrics.winPointsByPlayer[seatIndex] || 0;
  stats.windWins += metrics.winsByPlayer[seatIndex] ? metrics.windWins || 0 : 0;
  stats.draws += metrics.draws || 0;
  stats.chiClaims += metrics.chiClaims || 0;
  stats.chiOffers += metrics.chiOffers || 0;
  stats.windChiClaims += metrics.windChiClaims || 0;
  stats.ponClaims += metrics.ponClaims || 0;
  stats.kanClaims += metrics.kanClaims || 0;
  stats.selfKans += metrics.selfKans || 0;
  stats.homeWindOpens += metrics.homeWindOpens || 0;
  stats.homeWindOpenSkips += metrics.homeWindOpenSkips || 0;
}

function scoreTuningSeatStats(stats) {
  return (
    stats.finalPointDelta +
    stats.matchWins * 36 +
    stats.handsWon * 16 +
    stats.totalWinPoints * 0.35 +
    stats.windWins * 2 -
    stats.dealIns * 14 -
    stats.draws * 1.2
  );
}

function simulateAITuningMatch(profiles, options = {}) {
  const roundsPerMatch = options.roundsPerMatch ?? GAME_CONFIG.matchRounds;
  const startingPoints = options.startingPoints ?? GAME_CONFIG.startingPoints;
  const decisionContext = options.accurate
    ? BRUTAL_AI_CONTEXT
    : { ...FAST_TUNING_AI_CONTEXT, drawSampleMax: options.drawSampleMax ?? FAST_TUNING_AI_CONTEXT.drawSampleMax };
  let points = Array(TABLE_CONFIG.players.length).fill(startingPoints);
  let dealerIndex = options.dealerIndex ?? Math.floor(Math.random() * TABLE_CONFIG.players.length);
  const seatStats = Array.from({ length: TABLE_CONFIG.players.length }, makeTuningSeatStats);

  for (let roundIndex = 0; roundIndex < roundsPerMatch; roundIndex += 1) {
    const roundNumber = (roundIndex % GAME_CONFIG.matchRounds) + 1;
    const metrics = simulateAIHandForMetrics(roundNumber, profiles, points, dealerIndex, { decisionContext });
    points = points.map((value, index) => value + (metrics.pointDelta[index] || 0));
    seatStats.forEach((stats, seatIndex) => addHandMetricsToSeatStats(stats, metrics, seatIndex));

    const dealerWon = Boolean(metrics.winsByPlayer[dealerIndex]);
    dealerIndex = dealerWon ? dealerIndex : (dealerIndex + 1) % TABLE_CONFIG.players.length;
    if (points.some((value) => value <= 0)) break;
  }

  const maxPoints = Math.max(...points);
  const winnerSeats = points
    .map((value, index) => ({ value, index }))
    .filter((entry) => entry.value === maxPoints)
    .map((entry) => entry.index);

  seatStats.forEach((stats, seatIndex) => {
    stats.games += 1;
    stats.finalPointDelta += points[seatIndex] - startingPoints;
    if (winnerSeats.includes(seatIndex)) stats.matchWins += 1 / winnerSeats.length;
    stats.score += scoreTuningSeatStats(stats);
  });

  return {
    profiles,
    points,
    winnerSeats,
    seatStats,
  };
}

function makeTuningAggregate(profile) {
  return {
    id: profile.id,
    name: profile.name,
    profile,
    score: 0,
    games: 0,
    matchWins: 0,
    handsWon: 0,
    dealIns: 0,
    totalWinPoints: 0,
    windWins: 0,
    draws: 0,
    chiClaims: 0,
    chiOffers: 0,
    windChiClaims: 0,
    ponClaims: 0,
    kanClaims: 0,
    selfKans: 0,
    homeWindOpens: 0,
    homeWindOpenSkips: 0,
    finalPointDelta: 0,
  };
}

function addSeatStatsToAggregate(aggregate, stats) {
  aggregate.score += scoreTuningSeatStats(stats);
  aggregate.games += stats.games;
  aggregate.matchWins += stats.matchWins;
  aggregate.handsWon += stats.handsWon;
  aggregate.dealIns += stats.dealIns;
  aggregate.totalWinPoints += stats.totalWinPoints;
  aggregate.windWins += stats.windWins;
  aggregate.draws += stats.draws;
  aggregate.chiClaims += stats.chiClaims;
  aggregate.chiOffers += stats.chiOffers;
  aggregate.windChiClaims += stats.windChiClaims;
  aggregate.ponClaims += stats.ponClaims;
  aggregate.kanClaims += stats.kanClaims;
  aggregate.selfKans += stats.selfKans;
  aggregate.homeWindOpens += stats.homeWindOpens;
  aggregate.homeWindOpenSkips += stats.homeWindOpenSkips;
  aggregate.finalPointDelta += stats.finalPointDelta;
}

function summarizeTuningAggregate(aggregate) {
  const games = Math.max(1, aggregate.games);
  return {
    id: aggregate.id,
    name: aggregate.name,
    scorePerGame: aggregate.score / games,
    matchWinRate: aggregate.matchWins / games,
    handsWonPerGame: aggregate.handsWon / games,
    dealInsPerGame: aggregate.dealIns / games,
    pointsPerGame: aggregate.finalPointDelta / games,
    averageWinPoints: aggregate.handsWon ? aggregate.totalWinPoints / aggregate.handsWon : 0,
    chiTakeRate: aggregate.chiOffers ? aggregate.chiClaims / aggregate.chiOffers : 0,
    windChiShare: aggregate.chiClaims ? aggregate.windChiClaims / aggregate.chiClaims : 0,
    windWinShare: aggregate.handsWon ? aggregate.windWins / aggregate.handsWon : 0,
    profile: aggregate.profile,
  };
}

function pickRandomProfiles(population, count) {
  const pool = population.slice();
  const picked = [];
  while (pool.length && picked.length < count) {
    picked.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  return picked;
}

function rotateProfilesForSeatBias(profiles, offset) {
  return profiles.map((_, index) => profiles[(index + offset) % profiles.length]);
}

function evaluateTuningPopulation(population, options) {
  const aggregates = new Map(population.map((profile) => [profile.id, makeTuningAggregate(profile)]));
  const matchesPerGeneration = options.matchesPerGeneration ?? population.length * 2;
  const seatRotations = options.seatRotations ?? 2;

  for (let matchIndex = 0; matchIndex < matchesPerGeneration; matchIndex += 1) {
    const group = pickRandomProfiles(population, TABLE_CONFIG.players.length);
    for (let rotation = 0; rotation < seatRotations; rotation += 1) {
      const seatedProfiles = rotateProfilesForSeatBias(group, rotation);
      const match = simulateAITuningMatch(seatedProfiles, options);
      match.seatStats.forEach((seatStats, seatIndex) => {
        addSeatStatsToAggregate(aggregates.get(seatedProfiles[seatIndex].id), seatStats);
      });
    }
    if (matchIndex % 8 === 0) clearAnalysisCaches();
  }

  return Array.from(aggregates.values())
    .map(summarizeTuningAggregate)
    .sort((a, b) => b.scorePerGame - a.scorePerGame);
}

function runAITuningTournament(options = {}) {
  const startTime = performance.now();
  const snapshot = makeSimulationStateSnapshot();
  const populationSize = options.populationSize ?? 20;
  const generations = options.generations ?? 6;
  const eliteCount = options.eliteCount ?? Math.max(4, Math.ceil(populationSize * 0.22));
  const randomImmigrants = options.randomImmigrants ?? Math.max(2, Math.ceil(populationSize * 0.12));
  let nextProfileId = 1;
  let population = [makeBaselineTuningProfile("base")];

  while (population.length < populationSize) {
    population.push(makeRandomTuningProfile(nextProfileId++, options.initialSpread ?? 0.42));
  }

  const history = [];
  try {
    for (let generation = 1; generation <= generations; generation += 1) {
      const leaderboard = evaluateTuningPopulation(population, options);
      history.push({
        generation,
        best: leaderboard[0],
        averageScore: leaderboard.reduce((sum, entry) => sum + entry.scorePerGame, 0) / leaderboard.length,
      });

      const elites = leaderboard.slice(0, eliteCount).map((entry) => entry.profile);
      const nextPopulation = elites.slice();
      while (nextPopulation.length < populationSize - randomImmigrants) {
        if (Math.random() < 0.45 && elites.length >= 2) {
          const parentA = elites[Math.floor(Math.random() * elites.length)];
          let parentB = elites[Math.floor(Math.random() * elites.length)];
          if (parentA.id === parentB.id) parentB = elites[(elites.indexOf(parentA) + 1) % elites.length];
          nextPopulation.push(breedTuningProfiles(parentA, parentB, nextProfileId++, options.mutationScale ?? 0.85));
        } else {
          const parent = elites[Math.floor(Math.random() * elites.length)];
          nextPopulation.push(mutateTuningProfile(parent, nextProfileId++, options.mutationScale ?? 1));
        }
      }
      while (nextPopulation.length < populationSize) {
        nextPopulation.push(makeRandomTuningProfile(nextProfileId++, options.initialSpread ?? 0.42));
      }
      population = nextPopulation;
    }

    const finalLeaderboard = evaluateTuningPopulation(population, {
      ...options,
      matchesPerGeneration: options.finalMatches ?? Math.max(options.matchesPerGeneration ?? populationSize * 2, populationSize * 3),
      seatRotations: options.finalSeatRotations ?? Math.max(2, options.seatRotations ?? 2),
    });
    return {
      elapsedMs: performance.now() - startTime,
      options: {
        generations,
        populationSize,
        eliteCount,
        matchesPerGeneration: options.matchesPerGeneration ?? populationSize * 2,
        roundsPerMatch: options.roundsPerMatch ?? GAME_CONFIG.matchRounds,
        seatRotations: options.seatRotations ?? 2,
      },
      best: finalLeaderboard[0],
      leaderboard: finalLeaderboard.slice(0, options.leaderboardSize ?? 10),
      history,
      parameters: AI_TUNING_PARAMETERS.map((parameter) => parameter.path),
    };
  } finally {
    restoreSimulationState(snapshot);
  }
}

function runAISelfPlayMetrics(handCount = 20) {
  const snapshot = makeSimulationStateSnapshot();
  clearAnalysisCaches();

  const totals = {
    hands: handCount,
    wins: 0,
    draws: 0,
    windWins: 0,
    windDiscards: 0,
    discards: 0,
    chiOffers: 0,
    chiClaims: 0,
    windChiClaims: 0,
    ponClaims: 0,
    kanClaims: 0,
    selfKans: 0,
    homeWindOpens: 0,
    homeWindOpenSkips: 0,
    totalWinPoints: 0,
    winsByType: {},
    rules: {},
    dealIns: {},
  };

  try {
    for (let index = 0; index < handCount; index += 1) {
      const metrics = simulateAIHandForMetrics((index % GAME_CONFIG.matchRounds) + 1);
      totals.wins += metrics.handsEnded;
      totals.draws += metrics.draws;
      totals.windWins += metrics.windWins;
      totals.windDiscards += metrics.windDiscards;
      totals.discards += metrics.discards;
      totals.chiOffers += metrics.chiOffers;
      totals.chiClaims += metrics.chiClaims;
      totals.windChiClaims += metrics.windChiClaims;
      totals.ponClaims += metrics.ponClaims;
      totals.kanClaims += metrics.kanClaims;
      totals.selfKans += metrics.selfKans;
      totals.homeWindOpens += metrics.homeWindOpens;
      totals.homeWindOpenSkips += metrics.homeWindOpenSkips;
      totals.totalWinPoints += metrics.totalWinPoints;
      Object.entries(metrics.winsByType).forEach(([key, value]) => {
        totals.winsByType[key] = (totals.winsByType[key] || 0) + value;
      });
      Object.entries(metrics.rules).forEach(([key, value]) => {
        totals.rules[key] = (totals.rules[key] || 0) + value;
      });
      Object.entries(metrics.dealIns).forEach(([key, value]) => {
        totals.dealIns[key] = (totals.dealIns[key] || 0) + value;
      });
    }
  } finally {
    restoreSimulationState(snapshot);
  }

  return {
    ...totals,
    chiTakeRate: totals.chiOffers ? totals.chiClaims / totals.chiOffers : 0,
    windChiShare: totals.chiClaims ? totals.windChiClaims / totals.chiClaims : 0,
    windDiscardShare: totals.discards ? totals.windDiscards / totals.discards : 0,
    windWinShare: totals.wins ? totals.windWins / totals.wins : 0,
    homeWindOpenRate: (totals.homeWindOpens + totals.homeWindOpenSkips)
      ? totals.homeWindOpens / (totals.homeWindOpens + totals.homeWindOpenSkips)
      : 0,
  };
}

function getHumanActionState() {
  const handOpen = state.phase !== "finished";
  const claim = state.pendingClaim;
  const isHumanClaim = Boolean(claim && isHumanIndex(claim.playerIndex));
  const canHomeWindOpen = handOpen && isHumanClaim && claim.type === "home-wind-open";
  const selfKanState = (
    handOpen &&
    state.phase === "human-discard" &&
    state.currentTurn === HUMAN_PLAYER_INDEX &&
    !claim
  ) ? buildSelfKanState(HUMAN_PLAYER_INDEX) : null;
  const canTsumo = handOpen && isHumanClaim && claim.type === "tsumo";
  const canRon = handOpen && isHumanClaim && claim.type === "ron";
  const canKan = handOpen && isHumanClaim && claim.type === "kan";
  const canSelfKan = Boolean(selfKanState);
  const canPon = handOpen && isHumanClaim && claim.type === "pon";
  const canChi = handOpen && isHumanClaim && claim.type === "chi";
  const canPass = handOpen && (canHomeWindOpen || canTsumo || canRon || canKan || canPon || canChi);
  return {
    handOpen,
    canHomeWindOpen,
    selfKanState,
    canTsumo,
    canRon,
    canKan,
    canSelfKan,
    canPon,
    canChi,
    canPass,
  };
}

function getHumanClaimHint() {
  if (!state.assistEnabled) return null;
  const claim = state.pendingClaim;

  function describeChoice(choice) {
    if (!choice) return "";
    return choice.claimTargetLabel || "";
  }

  if (state.phase === "human-discard" && state.currentTurn === HUMAN_PLAYER_INDEX && !claim) {
    const choice = chooseAISelfKan(HUMAN_PLAYER_INDEX);
    return choice
      ? { action: "kan", label: "Self Kan", detail: describeChoice(choice) }
      : null;
  }

  if (!claim || !isHumanIndex(claim.playerIndex) || state.phase === "finished") return null;

  if (claim.type === "tsumo") {
    return { action: "tsumo", label: "Tsumo" };
  }
  if (claim.type === "ron") {
    return { action: "ron", label: "Ron" };
  }
  if (!claim.sourceCard) return null;

  if (claim.type === "kan") {
    const choice = chooseAIKan(HUMAN_PLAYER_INDEX, claim.sourceCard);
    return choice
      ? { action: "kan", label: "Kan", detail: describeChoice(choice) }
      : { action: "pass", label: "Pass" };
  }
  if (claim.type === "pon") {
    const choice = chooseAIPon(HUMAN_PLAYER_INDEX, claim.sourceCard);
    return choice
      ? { action: "pon", label: "Pon", detail: describeChoice(choice) }
      : { action: "pass", label: "Pass" };
  }
  if (claim.type === "chi") {
    const choice = chooseAIChi(HUMAN_PLAYER_INDEX, claim.sourceCard);
    return choice
      ? { action: "chi", label: "Chi", detail: describeChoice(choice) }
      : { action: "pass", label: "Pass" };
  }
  return null;
}

function triggerPrimaryClaim() {
  const actionState = getHumanActionState();
  if (actionState.canTsumo) {
    declareHumanTsumo();

  if (actionState.canRon) {
    declareHumanRon();

  if (actionState.canKan) {
    declareHumanKan();

  }
  if (actionState.canSelfKan) {
    declareHumanKan();

  }
  if (actionState.canPon) {

  }
  if (actionState.canChi) {

  }
  return false;
}

  } else if (state.phase === "finished") {
    centerTitle.textContent = "Draw";
  } else if (state.pendingClaim?.type === "home-wind-open" && isHumanIndex(state.pendingClaim.playerIndex)) {
    centerTitle.textContent = "Open";
  } else if (state.pendingClaim?.type === "ron" && isHumanIndex(state.pendingClaim.playerIndex)) {
    centerTitle.textContent = "Ron";
  } else if (state.pendingClaim?.type === "kan" && isHumanIndex(state.pendingClaim.playerIndex)) {
    centerTitle.textContent = "Kan";
  } else if (selfKanReady) {
    centerTitle.textContent = "Self Kan";
  } else if (state.pendingClaim?.type === "pon" && isHumanIndex(state.pendingClaim.playerIndex)) {
    centerTitle.textContent = "Pon";
  } else if (state.pendingClaim?.type === "tsumo" && isHumanIndex(state.pendingClaim.playerIndex)) {
    centerTitle.textContent = "Tsumo";
  } else if (state.pendingClaim?.type === "chi" && isHumanIndex(state.pendingClaim.playerIndex)) {
    centerTitle.textContent = "Chi";
  } else {
    centerTitle.textContent = `${getPlayer(state.currentTurn).seat} Turn`;
  }

  if (state.lastDiscard) {
    const threats = exactRonThreats(state.lastDiscard.playerIndex, state.lastDiscard.card);
    if (threats.length) {
      const pill = document.createElement("span");
      pill.className = "pill danger";
      pill.textContent = `${threats.length} ron`;
      dangerPills.appendChild(pill);
    }
  }

  document.getElementById("centerClaimTarget")?.addEventListener("click", triggerPrimaryClaim);
  attachInspectHandlers(inspectTarget, state.lastDiscard?.card || null);
}

function renderWinningLayouts() {
  const container = document.getElementById("winningLayouts");
  container.innerHTML = "";
  const claim = state.pendingClaim;

  if (state.matchSummary) {
    const leaders = state.matchSummary.leaders.map((index) => getPlayer(index)?.name || `P${index + 1}`);
    const summaryEl = document.createElement("div");
    summaryEl.className = "winning-layout";
    summaryEl.innerHTML = `
      <strong>${state.matchFinished ? "Match Result" : "Match Status"}</strong>
      <span>${formatMatchSummaryText()}</span><br>
      <span>Leader${leaders.length === 1 ? "" : "s"}: ${leaders.join(" · ")}</span>
    `;
    container.appendChild(summaryEl);
    if (state.matchFinished && (!claim || state.winner === null)) {
      return;
    }
  }

  if (state.phase === "finished" && claim && state.winner !== null) {
    if (claim.type === "ron" && claim.ronResults?.length) {
      claim.ronResults.forEach((result) => {
        const winner = getPlayer(result.playerIndex);
        const scoringRules = new Set((result.scoringLayout || []).map((group) => group.ruleId));
        const wrapper = document.createElement("div");
        wrapper.className = "winning-layout";
        wrapper.innerHTML = `
          <strong>${formatPlayerTag(result.playerIndex)} · RON</strong>
          <span>Ron on ${formatCardSource(claim.sourceCard, claim.discarderIndex)} · ${formatPointSummary(result.points, result.bonusPoints)}</span>
        `;
        container.appendChild(wrapper);

        result.layouts.forEach((layout) => {
          const cardsEl = document.createElement("div");
          cardsEl.className = "winning-layout";
          cardsEl.innerHTML = `
            <div class="winning-cards">
              ${layout.flatMap((group) => group.cards).map((card) => `
                <div class="winning-card">
                  ${renderCardMarkup(card)}
                </div>
              `).join("")}
            </div>
          `;
          container.appendChild(cardsEl);

          layout.forEach((group) => {
            const el = document.createElement("div");
            el.className = "winning-layout";
            el.innerHTML = `
              <strong>${group.label}${scoringRules.has(group.ruleId) ? ` · ${groupPointsForGear(group, result.openCardCount)} pt` : ""}</strong>
              <span>${group.cards.map((card) => card.chinese).join(" · ")}</span><br>
              <span>${group.detail}</span>
            `;
            container.appendChild(el);
          });
        });
      });

      const settlementEl = document.createElement("div");
      settlementEl.className = "winning-layout";
      settlementEl.innerHTML = `
        <strong>Settlement</strong>
        <span>${formatSettlement(claim.settlement || [])}</span>
      `;
      container.appendChild(settlementEl);
      return;
    }

    const winner = getPlayer(state.winner);
    const sourceText = claim.type === "ron"
      ? `Ron on ${formatCardSource(claim.sourceCard, claim.discarderIndex)}`
      : "Tsumo";
    const settlementText = formatSettlement(claim.settlement || []);
    const scoringRules = new Set((claim.scoringLayout || []).map((group) => group.ruleId));

    claim.layouts.forEach((layout) => {
      const wrapper = document.createElement("div");
      wrapper.className = "winning-layout";
      wrapper.innerHTML = `
        <strong>${formatPlayerTag(state.winner)} · ${claim.type.toUpperCase()}</strong>
        <span>${sourceText} · ${formatPointSummary(claim.points, claim.bonusPoints)}</span><br>
        <span>${settlementText}</span>
        <div class="winning-cards">
          ${layout.flatMap((group) => group.cards).map((card) => `
            <div class="winning-card">
              ${renderCardMarkup(card)}
            </div>
          `).join("")}
        </div>
      `;
      container.appendChild(wrapper);

      layout.forEach((group) => {
        const el = document.createElement("div");
        el.className = "winning-layout";
        el.innerHTML = `
          <strong>${group.label}${scoringRules.has(group.ruleId) ? ` · ${groupPointsForGear(group, claim.openCardCount)} pt` : ""}</strong>
          <span>${group.cards.map((card) => card.chinese).join(" · ")}</span><br>
          <span>${group.detail}</span>
        `;
        container.appendChild(el);
      });
    });
    return;
  }

  if (!claim || !isHumanIndex(claim.playerIndex)) {
    container.innerHTML = `
      <div class="winning-layout">
        <strong>No current claim</strong>
        <span>Waiting</span>
      </div>
    `;
    return;
  }

  if (claim.type !== "tsumo" && claim.type !== "ron") {
    container.innerHTML = `
      <div class="winning-layout">
        <strong>No winning claim</strong>
        <span>${claim.type.toUpperCase()} is not a win.</span>
      </div>
    `;
    return;
  }

  claim.layouts.forEach((layout) => {
    layout.forEach((group) => {
      const el = document.createElement("div");
      el.className = "winning-layout";
      el.innerHTML = `
        <strong>${group.label}</strong>
        <span>${group.cards.map((card) => card.chinese).join(" · ")}</span><br>
        <span>${group.detail}</span>
      `;
      container.appendChild(el);
    });
  });
}

function renderActions() {
  const hint = document.getElementById("actionHint");
  const tsumoButton = document.getElementById("tsumoButton");
  const ronButton = document.getElementById("ronButton");
  const kanButton = document.getElementById("kanButton");
  const ponButton = document.getElementById("ponButton");
  const chiButton = document.getElementById("chiButton");
  const passButton = document.getElementById("passButton");
  const winButton = document.getElementById("openWinButton");
  const assistButton = document.getElementById("toggleAssistButton");
  const { canHomeWindOpen, canTsumo, canRon, canKan, canSelfKan, canPon, canChi, canPass, selfKanState } = getHumanActionState();
  const claimHint = getHumanClaimHint();
  const hasWinningView = (state.phase === "finished" && state.pendingClaim && state.winner !== null)
    || Boolean(state.matchSummary)
    || Boolean(
      state.pendingClaim &&
      isHumanIndex(state.pendingClaim.playerIndex) &&
      (state.pendingClaim.type === "tsumo" || state.pendingClaim.type === "ron")
    );

  tsumoButton.disabled = !canTsumo;
  ronButton.disabled = !canRon;
  kanButton.disabled = !(canKan || canSelfKan);
  ponButton.disabled = !canPon;
  chiButton.disabled = !canChi;
  passButton.disabled = !canPass;
  winButton.disabled = !hasWinningView;
  assistButton.setAttribute("aria-pressed", state.assistEnabled ? "true" : "false");
  [tsumoButton, ronButton, kanButton, ponButton, chiButton, passButton].forEach((button) => {
    button.classList.remove("recommended");
  });

  if (claimHint) {
    const claimButtons = {
      tsumo: tsumoButton,
      ron: ronButton,
      kan: kanButton,
      pon: ponButton,
      chi: chiButton,
      pass: passButton,
    };
    claimButtons[claimHint.action]?.classList.add("recommended");
  }

  if (state.phase === "finished") {
    if (state.matchFinished) {
      hint.textContent = "Match over · Enter starts a new match";
    } else if (state.matchSummary) {
      hint.textContent = "Sudden death · Enter starts next round";
    } else if (state.winner !== null) {
      hint.textContent = "Hand over · Enter starts next round";
    } else {
      hint.textContent = "Draw · Enter starts next round";
    }
  } else if (claimHint) {
    const sourceText = claimHint.action === "pass" || !state.pendingClaim?.sourceCard
      ? ""
      : ` · ${state.pendingClaim.sourceCard.chinese}`;
    const detailText = claimHint.detail ? ` · ${claimHint.detail}` : "";
    hint.textContent = `Hint: ${claimHint.label}${sourceText}${detailText}`;
  } else if (canHomeWindOpen) {
    hint.textContent = "Home wind discard: open 1 concealed card or Pass";
  } else if (canRon) {
    hint.textContent = `Ron: ${state.pendingClaim.sourceCard.chinese} · Enter or R`;
  } else if (canKan) {
    hint.textContent = `Kan: ${state.pendingClaim.sourceCard.chinese} · Enter or K`;
  } else if (canSelfKan) {
    hint.textContent = `Self Kan: ${claimGroupLabel(selfKanState?.claimGroup?.[0])} · Enter or K`;
  } else if (canPon) {
    hint.textContent = `Pon: ${state.pendingClaim.sourceCard.chinese} · Enter or P`;
  } else if (canChi) {
    hint.textContent = `Chi: ${state.pendingClaim.sourceCard.chinese} · Enter or C`;
  } else if (canTsumo) {
    hint.textContent = "Tsumo ready · Enter or T";
  } else if (state.currentTurn === HUMAN_PLAYER_INDEX && state.phase === "human-discard") {
    hint.textContent = "Discard a card";
  } else {
    hint.textContent = "Waiting";
  }
}

function renderHumanHand() {
  const container = document.getElementById("humanHand");
  const human = getHumanPlayer();
  const canDiscard =
    state.phase === "human-discard" &&
    state.currentTurn === HUMAN_PLAYER_INDEX &&
    state.pendingClaim?.type !== "tsumo";
  const canHomeWindOpen =
    state.phase === "human-home-wind-open" &&
    state.currentTurn === HUMAN_PLAYER_INDEX &&
    state.pendingClaim?.type === "home-wind-open";
  const suggestedCardId = canDiscard && state.assistEnabled ? chooseAIDiscard(HUMAN_PLAYER_INDEX)?.card.id ?? null : null;
  const handCards = [
    ...human.hand.map((card) => ({ card, kind: "concealed" })),
    ...human.openCards.map((card) => ({ card, kind: getOpenClaimType(card) })),
  ];

  container.innerHTML = "";

  handCards.forEach(({ card, kind }) => {
    const isOpenClaim = kind !== "concealed";
    const isArrived = state.lastDrawnCardId === card.id;
    const isDiscardable = canDiscard && !isOpenClaim;
    const isOpenSelectable = canHomeWindOpen && !isOpenClaim;
    const openClaimLabel = ({
      chi: "Chi Card",
      pon: "Pon Card",
      kan: "Kan Card",
      open: "Open Card",
    })[kind] || "Open Card";
    const button = document.createElement("button");
    button.type = "button";
    button.className = `hand-card${state.selectedCardId === card.id ? " selected" : ""}${suggestedCardId === card.id ? " suggested" : ""}${(isDiscardable || isOpenSelectable) ? "" : " locked"}${isOpenClaim ? " open-claimed" : ""}${isArrived ? " arrived" : ""}`;
    button.innerHTML = `
      ${renderCardMarkup(card)}
      ${isArrived ? `<div class="hand-arrival-badge">New</div>` : ""}
      ${isOpenClaim ? `<div class="hand-claim-badge">${openClaimLabel}</div><div class="hand-claim-note">Open claim · cannot discard</div>` : ""}
    `;
    button.addEventListener("mouseenter", (event) => {
      showInspectPopup(card, button, event.clientX, event.clientY);
    });
    button.addEventListener("mousemove", (event) => {
      positionInspectPopup(button, event.clientX, event.clientY);
    });
    button.addEventListener("mouseleave", hideInspectPopup);
    button.addEventListener("focus", () => {
      showInspectPopup(card, button);
    });
    button.addEventListener("blur", hideInspectPopup);
    if (isDiscardable) {
      button.addEventListener("click", () => onHumanDiscard(card.id));
    } else if (isOpenSelectable) {
      button.addEventListener("click", () => declareHumanHomeWindOpen(card.id));
    }
    container.appendChild(button);
  });
}

function renderPossibleWall() {
  const container = document.getElementById("possibleList");
  container.innerHTML = "";

  const possibleCards = sortCardsForDisplay(publicRemainingCardsFor(HUMAN_PLAYER_INDEX));
  const possibleInWall = state.wall.length;
  const possibleInOpponentHands = Math.max(0, possibleCards.length - possibleInWall);

  const summary = document.createElement("div");
  summary.className = "set-item";
  summary.innerHTML = `
    <strong>${possibleCards.length} unseen cards</strong>
    <span>${possibleInWall} could still be in the wall. The other ${possibleInOpponentHands} are in concealed opponent hands. This only removes your hand and public information.</span>
  `;
  container.appendChild(summary);

  if (!possibleCards.length) {
    const group = document.createElement("div");
    group.className = "discard-group";
    group.innerHTML = `
      <strong>No possible cards left</strong>
      <div class="discard-empty">There are no unseen cards remaining.</div>
    `;
    container.appendChild(group);
    return;
  }

  MONTH_ORDER.forEach((month) => {
    const monthCards = possibleCards.filter((card) => isMonthCard(card) && card.month === month);
    if (!monthCards.length) return;

    const group = document.createElement("div");
    group.className = "discard-group";
    group.innerHTML = `
      <strong>Month ${month} · ${monthCards.length}</strong>
      <div class="discard-cards">
        ${monthCards.map((card) => `
          <button class="discard-detail-card" type="button" data-inspect="${card.id}" aria-label="Possible ${card.label}">
            ${renderCardMarkup(card)}
          </button>
        `).join("")}
      </div>
    `;
    container.appendChild(group);
  });

  WIND_SYMBOLS.forEach((wind) => {
    const windCards = possibleCards.filter((card) => isWindCard(card) && card.wind === wind);
    if (!windCards.length) return;

    const group = document.createElement("div");
    group.className = "discard-group";
    group.innerHTML = `
      <strong>${WIND_NAMES[wind]} · ${windCards.length}</strong>
      <div class="discard-cards">
        ${windCards.map((card) => `
          <button class="discard-detail-card" type="button" data-inspect="${card.id}" aria-label="Possible ${card.label}">
            ${renderCardMarkup(card)}
          </button>
        `).join("")}
      </div>
    `;
    container.appendChild(group);
  });
}

function updateViewportFit() {
  const shell = document.getElementById("viewportShell");
  const shouldUseFluidLayout =
    window.innerWidth <= VIEWPORT_FIT.minFluidWidth ||
    window.innerHeight <= VIEWPORT_FIT.minFluidHeight;

  document.body.classList.toggle("fluid-mode", shouldUseFluidLayout);
  shell.classList.toggle("fluid", shouldUseFluidLayout);

  if (shouldUseFluidLayout) {
    shell.style.setProperty("--app-scale", "1");
    return;
  }

  const baseWidth = GAME_CONFIG ? Number(getComputedStyle(document.documentElement).getPropertyValue("--app-base-width")) : 1236;
  const baseHeight = GAME_CONFIG ? Number(getComputedStyle(document.documentElement).getPropertyValue("--app-base-height")) : 1040;
  const scale = Math.min(
    (window.innerWidth - VIEWPORT_FIT.chromePaddingX) / baseWidth,
    (window.innerHeight - VIEWPORT_FIT.chromePaddingY) / baseHeight,
    1
  );

  shell.style.setProperty("--app-scale", String(Math.max(scale, 0.7)));
}

window.addEventListener("keydown", (event) => {
  const target = event.target;
  if (target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.tagName === "SELECT" || target.isContentEditable)) {
    return;
  }

  const actionState = getHumanActionState();
  const key = event.key.toLowerCase();
  const discardIndex = Number(event.key) - 1;
  const isSpace = event.key === " ";
  const isEnter = event.key === "Enter";

  if (event.key === "Escape") {
    if (anyOverlayOpen()) {
      closeAllOverlays();
      return;
    }
    if (actionState.canPass) {
      event.preventDefault();
      passHumanClaim();
    }
    return;
  }

  if ((isEnter || isSpace) && anyOverlayOpen()) {
    event.preventDefault();
    closeAllOverlays();
    return;
  }

  if ((isEnter || isSpace) && state.phase === "finished") {
    event.preventDefault();
    continueAfterFinishedHand();
    return;
  }

  if (!anyOverlayOpen() && Number.isInteger(discardIndex) && discardIndex >= 0 && discardIndex < 6) {
    const openableCards = getHumanHomeWindOpenCards();
    const openCard = openableCards[discardIndex];
    if (openCard) {
      event.preventDefault();
      declareHumanHomeWindOpen(openCard.id);
      return;
    }

    const discardableCards = getHumanDiscardableCards();
    const card = discardableCards[discardIndex];
    if (card) {
      event.preventDefault();
      onHumanDiscard(card.id);
      return;
    }
  }

  if (isEnter) {
    if (actionState.canHomeWindOpen) {
      event.preventDefault();
      passHumanClaim();
      return;
    }
    if (triggerPrimaryClaim()) {
      event.preventDefault();
    }
    return;
  }

  if (isSpace && !anyOverlayOpen() && actionState.canPass) {
    event.preventDefault();
    passHumanClaim();
    return;
  }

  if (isSpace && !anyOverlayOpen()) {
    const freshDrawCard = getHumanFreshDrawCard();
    if (freshDrawCard) {
      event.preventDefault();
      onHumanDiscard(freshDrawCard.id);
      return;
    }
  }

  if (key === "r" && actionState.canRon) {
    event.preventDefault();
    declareHumanRon();
    return;
  }

  if (key === "c" && actionState.canChi) {
    event.preventDefault();
    declareHumanChi();
    return;
  }

  if (key === "k" && (actionState.canKan || actionState.canSelfKan)) {
    event.preventDefault();
    declareHumanKan();
    return;
  }

  if (key === "p" && actionState.canPon) {
    event.preventDefault();
    declareHumanPon();
    return;
  }

  if (key === "t" && actionState.canTsumo) {
    event.preventDefault();
    declareHumanTsumo();
    return;
  }

  if (key === "n" && state.phase === "finished") {
    event.preventDefault();
    continueAfterFinishedHand();
  }
});
