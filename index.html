<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Month Cycle Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --felt: #18392f;
  --felt-2: #102820;
  --wood: #6d5032;
  --gold: #d9bb7a;
  --gold-soft: rgba(217, 187, 122, 0.24);
  --ink: #f5efde;
  --muted: rgba(245, 239, 222, 0.7);
  --muted-2: rgba(245, 239, 222, 0.5);
  --danger: #ef9175;
  --good: #87cf9c;
  --line: rgba(255, 246, 221, 0.1);
  --shadow: 0 22px 60px rgba(0, 0, 0, 0.38);
  --app-base-width: 1280;
  --app-base-height: 920;
  --app-scale: 1;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
}

body {
  font-family: "Alegreya", serif;
  color: var(--ink);
  background:
    radial-gradient(circle at top, rgba(217, 187, 122, 0.08), transparent 25%),
    radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.06), transparent 20%),
    linear-gradient(180deg, #07110f 0%, #0d1b18 45%, #0f1d1a 100%);
  overflow: hidden;
}

body.fluid-mode {
  overflow: auto;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    linear-gradient(90deg, transparent 0, rgba(255, 255, 255, 0.015) 50%, transparent 100%),
    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px);
  background-size: 100% 100%, 18px 18px;
  pointer-events: none;
  opacity: 0.4;
}

button {
  font: inherit;
}

.app {
  width: calc(var(--app-base-width) * 1px);
  height: calc(var(--app-base-height) * 1px);
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: 62px minmax(0, 1fr) 226px;
  gap: 10px;
  padding: 10px;
  overflow: hidden;
}

.board-shell {
  min-height: 0;
  display: block;
}

.viewport-shell {
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  display: grid;
  place-items: start center;
  padding: 0;
}

.viewport-shell .app {
  transform: scale(var(--app-scale));
  transform-origin: top center;
}

.viewport-shell.fluid {
  width: auto;
  height: auto;
  overflow: visible;
  display: block;
}

.viewport-shell.fluid .app {
  width: auto;
  height: auto;
  transform: none;
}

.panel {
  position: relative;
  background: rgba(14, 28, 23, 0.88);
  border: 1px solid var(--line);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px);
}

.panel::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(145deg, rgba(217, 187, 122, 0.08), transparent 24%),
    radial-gradient(circle at top right, rgba(255, 255, 255, 0.05), transparent 32%);
  pointer-events: none;
}

.header {
  padding: 5px 14px;
  display: grid;
  grid-template-columns: auto auto;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
}

.eyebrow {
  font-family: "Alegreya SC", serif;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-size: 0.58rem;
  color: var(--muted-2);
}

.header h1 {
  margin: 0;
  font-family: "Alegreya SC", serif;
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  line-height: 1;
}

.title-lockup {
  display: grid;
  gap: 2px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(74px, 1fr));
  gap: 6px;
}

.stat {
  padding: 7px 9px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.07);
  text-align: center;
}

.stat-label {
  display: block;
  font-size: 0.62rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted-2);
}

.stat-value {
  display: block;
  margin-top: 2px;
  font-family: "Alegreya SC", serif;
  font-size: 0.96rem;
}

.pill-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.pill {
  padding: 5px 9px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.07);
  font-size: 0.75rem;
  color: var(--ink);
}

.pill.good {
  border-color: rgba(135, 207, 156, 0.28);
  color: var(--good);
}

.pill.danger {
  border-color: rgba(239, 145, 117, 0.28);
  color: var(--danger);
}

.button-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.button-row.compact {
  gap: 6px;
}

.utility-row {
  display: flex;
  gap: 6px;
  margin-top: 0;
  flex-wrap: wrap;
}

.utility-button {
  appearance: none;
  min-width: 40px;
  height: 36px;
  border-radius: 12px;
  border: 1px solid rgba(217, 187, 122, 0.2);
  background: rgba(255, 255, 255, 0.03);
  color: var(--ink);
  cursor: pointer;
  font-family: "Alegreya SC", serif;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  transition: border-color 140ms ease, opacity 140ms ease, color 140ms ease;
}

.utility-button:hover {
  border-color: rgba(217, 187, 122, 0.42);
}

.utility-button[aria-pressed="true"] {
  border-color: rgba(135, 207, 156, 0.5);
  background: rgba(135, 207, 156, 0.12);
  color: #dff8e5;
}

.utility-button:disabled {
  opacity: 0.36;
  color: var(--muted-2);
  border-color: rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.02);
  cursor: default;
}

.utility-button:disabled:hover {
  border-color: rgba(255, 255, 255, 0.08);
}

.action {
  appearance: none;
  border: 1px solid rgba(217, 187, 122, 0.25);
  background: linear-gradient(135deg, rgba(217, 187, 122, 0.18), rgba(217, 187, 122, 0.04));
  color: var(--ink);
  border-radius: 12px;
  padding: 8px 12px;
  cursor: pointer;
  transition: transform 140ms ease, border-color 140ms ease;
  font-size: 0.8rem;
}

.action:hover {
  transform: translateY(-1px);
  border-color: rgba(217, 187, 122, 0.45);
}

.action.recommended {
  border-color: rgba(255, 226, 156, 0.98);
  background:
    linear-gradient(135deg, rgba(255, 225, 150, 0.34), rgba(217, 187, 122, 0.14)),
    linear-gradient(135deg, rgba(217, 187, 122, 0.18), rgba(217, 187, 122, 0.04));
  color: #fff6df;
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.18),
    0 0 0 1px rgba(255, 226, 156, 0.5),
    0 0 0 4px rgba(255, 226, 156, 0.12),
    0 0 28px rgba(255, 214, 120, 0.45),
    0 14px 30px rgba(0, 0, 0, 0.26);
  transform: translateY(-1px);
}

.action.recommended:hover {
  border-color: rgba(255, 234, 184, 1);
}

.action.secondary {
  background: rgba(255, 255, 255, 0.03);
}

.action:disabled {
  opacity: 0.4;
  cursor: default;
  transform: none;
}

#tsumoButton {
  border-color: rgba(135, 207, 156, 0.45);
  background: linear-gradient(135deg, rgba(135, 207, 156, 0.24), rgba(135, 207, 156, 0.06));
}

#tsumoButton:hover {
  border-color: rgba(135, 207, 156, 0.72);
}

#ronButton {
  border-color: rgba(239, 145, 117, 0.45);
  background: linear-gradient(135deg, rgba(239, 145, 117, 0.24), rgba(239, 145, 117, 0.06));
}

#ronButton:hover {
  border-color: rgba(239, 145, 117, 0.72);
}

#chiButton {
  border-color: rgba(126, 196, 160, 0.45);
  background: linear-gradient(135deg, rgba(126, 196, 160, 0.24), rgba(126, 196, 160, 0.06));
}

#chiButton:hover {
  border-color: rgba(126, 196, 160, 0.72);
}

#ponButton {
  border-color: rgba(104, 177, 221, 0.45);
  background: linear-gradient(135deg, rgba(104, 177, 221, 0.24), rgba(104, 177, 221, 0.06));
}

#ponButton:hover {
  border-color: rgba(104, 177, 221, 0.72);
}

#kanButton {
  border-color: rgba(224, 162, 101, 0.45);
  background: linear-gradient(135deg, rgba(224, 162, 101, 0.24), rgba(224, 162, 101, 0.06));
}

#kanButton:hover {
  border-color: rgba(224, 162, 101, 0.72);
}

#passButton {
  border-color: rgba(137, 178, 207, 0.3);
  background: rgba(137, 178, 207, 0.08);
}

#passButton:hover {
  border-color: rgba(137, 178, 207, 0.56);
}

#openWinButton {
  border-color: rgba(200, 170, 108, 0.34);
  background: rgba(200, 170, 108, 0.1);
}

#openLogButton {
  border-color: rgba(125, 189, 205, 0.34);
  background: rgba(125, 189, 205, 0.1);
}

#openDiscardsButton {
  border-color: rgba(180, 154, 214, 0.34);
  background: rgba(180, 154, 214, 0.1);
}

#openSetsButton {
  border-color: rgba(126, 196, 160, 0.34);
  background: rgba(126, 196, 160, 0.1);
}

#toggleAssistButton {
  border-color: rgba(135, 207, 156, 0.34);
  background: rgba(135, 207, 156, 0.1);
}

.table-wrap {
  position: relative;
  min-height: 0;
  height: 100%;
  padding: 0;
  display: grid;
  place-items: center;
  background: none;
  border: 0;
  box-shadow: none;
  backdrop-filter: none;
}

.table {
  position: relative;
  width: min(100%, 1048px);
  max-height: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 42px;
  background:
    radial-gradient(circle at 50% 35%, rgba(36, 73, 126, 0.28), transparent 32%),
    linear-gradient(180deg, #26406f 0%, #203763 22%, #1d3159 100%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow:
    inset 0 0 0 2px rgba(255, 255, 255, 0.04),
    inset 0 0 80px rgba(0, 0, 0, 0.18),
    0 24px 60px rgba(0, 0, 0, 0.28);
  overflow: hidden;
}

.table::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 16% 8%, rgba(255, 255, 255, 0.24), transparent 18%),
    linear-gradient(115deg, rgba(255, 255, 255, 0.08), transparent 24%);
  pointer-events: none;
  opacity: 0.7;
}

.table::before {
  content: "";
  position: absolute;
  inset: 74px 92px 92px;
  border-radius: 18px;
  border: 2px solid rgba(22, 40, 78, 0.55);
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.04),
    0 0 0 1px rgba(13, 23, 45, 0.5);
}

.compass {
  position: absolute;
  inset: 50%;
  width: 210px;
  height: 210px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1px solid rgba(217, 187, 122, 0.24);
  box-shadow: inset 0 0 0 1px rgba(217, 187, 122, 0.08);
}

.compass::before,
.compass::after {
  content: "";
  position: absolute;
  inset: 12%;
  border-radius: 50%;
  border: 1px dashed rgba(217, 187, 122, 0.14);
}

.compass::after {
  inset: 50%;
  width: 2px;
  height: 78px;
  border: 0;
  background: linear-gradient(180deg, transparent, rgba(217, 187, 122, 0.35), transparent);
  transform: translate(-50%, -50%);
}

.compass-label {
  position: absolute;
  font-family: "Alegreya SC", serif;
  font-size: 0.74rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(245, 239, 222, 0.44);
}

.compass-label.north { top: 12px; left: 50%; transform: translateX(-50%); }
.compass-label.south { bottom: 12px; left: 50%; transform: translateX(-50%); }
.compass-label.west { left: 12px; top: 50%; transform: translateY(-50%); }
.compass-label.east { right: 12px; top: 50%; transform: translateY(-50%); }

.center-panel {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 210px;
  transform: translate(-50%, -50%);
  border-radius: 18px;
  padding: 10px 12px;
  text-align: center;
  background: rgba(36, 41, 66, 0.86);
  border: 1px solid rgba(217, 187, 122, 0.22);
  box-shadow: 0 14px 26px rgba(0, 0, 0, 0.22);
}

.center-panel h2 {
  margin: 2px 0 6px;
  font-family: "Alegreya SC", serif;
  font-size: 1.2rem;
  letter-spacing: 0.08em;
}

.center-panel p {
  margin: 0;
  color: var(--muted);
  line-height: 1.35;
  font-size: 0.74rem;
}

.center-card {
  width: 118px;
  margin: 10px auto 10px;
}

.center-card.claimable {
  cursor: pointer;
}

.center-claim-target {
  appearance: none;
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
}

.center-claim-target .card-face {
  transition: transform 140ms ease, box-shadow 140ms ease;
}

.center-claim-target:hover .card-face,
.center-claim-target:focus-visible .card-face {
  transform: translateY(-2px) scale(1.03);
  box-shadow:
    0 0 0 1px rgba(217, 187, 122, 0.28),
    0 0 22px var(--card-glow-soft, transparent),
    0 18px 30px rgba(0, 0, 0, 0.4),
    0 0 40px var(--card-glow-deep, transparent);
  outline: none;
}



.center-card .card-face,
.mini-card .card-face,
.open-card .card-face,
.hand-card .card-face,
.discard-card .card-face,
.inspect-popup-card .card-face,
.discard-detail-card .card-face,
.winning-card .card-face {
  width: 100%;
  display: block;
  border-radius: 14px;
  box-shadow:
    0 0 0 1px var(--card-glow-ring, transparent),
    0 0 0 3px var(--card-glow-halo, transparent),
    0 0 24px var(--card-glow-soft, transparent),
    0 16px 28px rgba(0, 0, 0, 0.35),
    0 0 48px var(--card-glow-deep, transparent);
}

.card-face {
  --card-glow-ring: transparent;
  --card-glow-halo: transparent;
  --card-glow-soft: transparent;
  --card-glow-deep: transparent;
  position: relative;
  display: flex !important;
  align-items: center;
  justify-content: center;
  width: 100%;
  aspect-ratio: 2 / 3;
  padding: 8px 7px;
  overflow: hidden;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 34%),
    linear-gradient(135deg, var(--card-accent, #405066), #0e131b 72%);
  color: var(--ink);
  transform: translateZ(0);
  backface-visibility: hidden;
  filter: saturate(1);
}

.card-face.card-back-face {
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 38%),
    repeating-linear-gradient(135deg, rgba(217, 187, 122, 0.12) 0 6px, transparent 6px 12px),
    linear-gradient(135deg, #1a2130, #0d1018 72%);
}

.card-face.white-card-face {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.82), transparent 36%),
    linear-gradient(135deg, #f5f1e6, #cfcabe 76%);
  color: #191b1b;
}

.white-card-face .tile-month {
  color: #191b1b;
}

.tile-month {
  width: 100%;
  font-family: "Alegreya SC", serif;
  font-size: 3.05rem;
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0;
  color: var(--ink);
  text-align: center;
  margin-top: -0.18em;
}

.tile-back-mark {
  font-family: "Alegreya SC", serif;
  font-size: 0.78rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
}

.mini-card .card-face,
.open-card .card-face,
.winning-card .card-face,
.discard-detail-card .card-face {
  padding: 4px;
}

.mini-card .tile-month,
.open-card .tile-month,
.winning-card .tile-month,
.discard-detail-card .tile-month {
  font-size: 1.22rem;
}

.mini-card.mini-card-month .card-face {
  display: block;
  padding: 4px;
}

.mini-card.mini-card-month .tile-month {
  font-size: 1.22rem;
}

.open-card.open-card-month .card-face {
  display: block;
  padding: 4px;
}

.open-card.open-card-month .tile-month {
  font-size: 1.22rem;
}

.mini-card .tile-back-mark,
.open-card .tile-back-mark,
.winning-card .tile-back-mark,
.discard-detail-card .tile-back-mark {
  font-size: 0.48rem;
  letter-spacing: 0.12em;
}

.center-card .card-face {
  padding: 8px 7px;
}

.center-card .tile-month {
  font-size: 3.6rem;
}

.center-card .tile-back-mark {
  font-size: 0.78rem;
  letter-spacing: 0.2em;
}

.inspect-popup-card .tile-month {
  font-size: 4.15rem;
}

.seat {
  position: absolute;
  width: 188px;
  min-height: 72px;
  padding: 8px 9px;
  border-radius: 16px;
  background: rgba(12, 20, 35, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.06);
}

.seat.active {
  box-shadow: 0 0 0 1px rgba(217, 187, 122, 0.32), 0 0 26px rgba(217, 187, 122, 0.12);
}

.seat.east { right: 12px; top: 50%; transform: translateY(-50%); }
.seat.west { left: 12px; top: 50%; transform: translateY(-50%); }
.seat.north { top: 12px; left: 50%; transform: translateX(-50%); width: 232px; }
.seat.south { bottom: 12px; left: 50%; transform: translateX(-50%); width: 250px; }
.seat.south-call {
  width: 882px;
  min-height: 114px;
}

.seat.south-call .seat-head {
  margin-bottom: 6px;
}

.seat-panel-copy {
  color: var(--muted);
  font-size: 0.72rem;
  line-height: 1.2;
  margin-bottom: 8px;
}

.seat-actions {
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  gap: 6px;
}

.seat-actions .action,
.seat-actions .utility-button {
  min-height: 34px;
  padding: 7px 11px;
}

.seat-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: baseline;
}

.seat-name {
  font-family: "Alegreya SC", serif;
  font-size: 0.84rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.seat-role {
  color: var(--muted);
  font-size: 0.72rem;
}

.seat-status {
  display: none;
}

.mini-hand {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.mini-card {
  width: 24px;
}

.open-strip {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.open-card {
  width: 24px;
  flex: 0 0 24px;
}

.mini-card,
.open-card {
  display: block;
  padding: 0;
  border: 0;
  background: none;
  line-height: 0;
}

button.mini-card,
button.open-card {
  appearance: none;
  cursor: pointer;
}

.discard-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 8px;
}

.discard-card {
  width: 24px;
}

.human-panel {
  grid-column: 1 / -1;
  padding: 12px 16px 14px;
  position: relative;
  left: auto;
  right: auto;
  bottom: auto;
  z-index: auto;
  max-height: none;
  overflow: hidden;
  border-color: rgba(217, 187, 122, 0.18);
  background: rgba(8, 18, 16, 0.96);
  box-shadow:
    0 18px 42px rgba(0, 0, 0, 0.34),
    0 0 0 1px rgba(217, 187, 122, 0.08);
}

.human-head {
  display: none;
}

.hand {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
  justify-content: stretch;
  align-content: start;
}

.hand-card {
  appearance: none;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 134px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.03);
  padding: 10px 8px;
  text-align: center;
  color: inherit;
  cursor: pointer;
  transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
  overflow: hidden;
}

.hand-card.arrived {
  border-color: rgba(255, 226, 156, 0.78);
  box-shadow:
    0 0 0 1px rgba(255, 226, 156, 0.28),
    0 0 22px rgba(255, 226, 156, 0.16),
    0 12px 24px rgba(0, 0, 0, 0.28);
}

.hand-card .card-face {
  width: min(100%, 86px);
  border-radius: 0;
  box-shadow:
    0 0 0 1px var(--card-glow-ring, transparent),
    0 0 0 3px var(--card-glow-halo, transparent),
    0 0 24px var(--card-glow-soft, transparent),
    0 12px 22px rgba(0, 0, 0, 0.28),
    0 0 48px var(--card-glow-deep, transparent);
}

.hand-card:hover,
.hand-card:focus-visible {
  transform: translateY(-4px);
  border-color: rgba(217, 187, 122, 0.45);
  box-shadow: 0 20px 30px rgba(0, 0, 0, 0.28);
  outline: none;
}

.hand-card.locked {
  cursor: default;
  opacity: 0.82;
}

function cloneAIConfig(config) {

function mergeAIConfig(target, source = {}) {
  Object.entries(source || {}).forEach(([key, value]) => {
    if (
      value &&
      typeof value === "object" &&
      !Array.isArray(value) &&
      target[key] &&
      typeof target[key] === "object" &&
      !Array.isArray(target[key])
    ) {
      mergeAIConfig(target[key], value);
      return;
    }
    target[key] = value;
  });
  return target;
}

function restoreAIConfig(snapshot) {
  Object.keys(AI_CONFIG).forEach((key) => delete AI_CONFIG[key]);
  mergeAIConfig(AI_CONFIG, snapshot);
}

function aiProfileOverridesForPlayer(playerIndex) {

function withAIProfile(playerIndex, fn) {
  const overrides = aiProfileOverridesForPlayer(playerIndex);
  if (!overrides) return fn();
  const snapshot = cloneAIConfig(AI_CONFIG);
  try {
    restoreAIConfig(AI_BASE_CONFIG);
    mergeAIConfig(AI_CONFIG, overrides);
    return fn();
  } finally {
    restoreAIConfig(snapshot);
  }
}

const soundState = {
  context: null,
  master: null,
};

function getAudioContext() {
  if (!AudioContextClass) return null;
  if (soundState.context) return soundState.context;

  const context = new AudioContextClass();
  const master = context.createGain();
  master.gain.value = SOUND_CONFIG.masterVolume;
  master.connect(context.destination);

  soundState.context = context;
  soundState.master = master;
  return context;
}

function unlockAudio() {
  const context = getAudioContext();
  if (!context || context.state !== "suspended") return;
  context.resume().catch(() => {});
}

function scheduleTone(options) {
  const context = getAudioContext();
  if (!context || !soundState.master || context.state !== "running") return;

  const {
    at = context.currentTime,
    frequency = 440,
    duration = 0.12,
    type = "sine",
    volume = 0.04,
    attack = 0.004,
    release = 0.09,
    endFrequency = frequency,
    detune = 0,
  } = options;

  const oscillator = context.createOscillator();
  const gain = context.createGain();
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, at);
  oscillator.frequency.linearRampToValueAtTime(endFrequency, at + duration);
  oscillator.detune.setValueAtTime(detune, at);

  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.linearRampToValueAtTime(volume, at + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + duration + release);

  oscillator.connect(gain);
  gain.connect(soundState.master);
  oscillator.start(at);
  oscillator.stop(at + duration + release + 0.02);
}

function scheduleNoise(options) {
  const context = getAudioContext();
  if (!context || !soundState.master || context.state !== "running") return;

  const {
    at = context.currentTime,
    duration = 0.08,
    volume = 0.028,
    attack = 0.002,
    release = 0.05,
    filterFrequency = 1400,
    filterQ = 0.8,
  } = options;

  const frameCount = Math.max(1, Math.floor(context.sampleRate * duration));
  const buffer = context.createBuffer(1, frameCount, context.sampleRate);
  const data = buffer.getChannelData(0);
  for (let index = 0; index < frameCount; index += 1) {
    data[index] = (Math.random() * 2 - 1) * (1 - index / frameCount);
  }

  const source = context.createBufferSource();
  source.buffer = buffer;

  const filter = context.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.setValueAtTime(filterFrequency, at);
  filter.Q.setValueAtTime(filterQ, at);

  const gain = context.createGain();
  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.linearRampToValueAtTime(volume, at + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + duration + release);

  source.connect(filter);
  filter.connect(gain);
  gain.connect(soundState.master);
  source.start(at);
  source.stop(at + duration + release + 0.02);
}

function isMonthCard(card) {

function isWindCard(card) {

}

function cardGroupKey(card) {
  if (isMonthCard(card)) return `month:${card.month}`;
  if (isWindCard(card)) return `wind:${card.wind}`;

}

function cardDisplayValue(card) {

}

function cardDisplayName(card) {

function cardMonth(card) {

function cardHomeWindMatchesPlayer(card, playerIndex) {

function claimGroupLabel(card) {

}

function allMonthCards(cards) {
  return cards.every(isMonthCard);
}

function allWindCards(cards) {
  return cards.every(isWindCard);
}

function sortCardsForDisplay(cards) {
  return cards.slice().sort((a, b) => {
    if (a.kind !== b.kind) return a.kind === "month" ? -1 : 1;
    if (isMonthCard(a) && isMonthCard(b)) {
      const monthDiff = MONTH_ORDER_INDEX[a.month] - MONTH_ORDER_INDEX[b.month];
      if (monthDiff !== 0) return monthDiff;
    }
    if (isWindCard(a) && isWindCard(b)) {
      const windDiff = WIND_ORDER_INDEX[a.wind] - WIND_ORDER_INDEX[b.wind];
      if (windDiff !== 0) return windDiff;
    }
    return a.id - b.id;
  });
}

function shuffle(cards) {
  const copy = cards.slice();
  for (let index = copy.length - 1; index > 0; index -= 1) {
    const swapIndex = Math.floor(Math.random() * (index + 1));
    [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
  }
  return copy;
}

function combinations(cards, size, start = 0, prefix = [], out = []) {
  if (prefix.length === size) {
    out.push(prefix.slice());
    return out;
  }
  for (let index = start; index <= cards.length - (size - prefix.length); index += 1) {
    prefix.push(cards[index]);
    combinations(cards, size, index + 1, prefix, out);
    prefix.pop();
  }
  return out;
}

function previousMonth(month) {
  const index = MONTH_ORDER.indexOf(month);
  return MONTH_ORDER[(index - 1 + MONTH_ORDER.length) % MONTH_ORDER.length];
}

function nextMonth(month) {
  const index = MONTH_ORDER.indexOf(month);
  return MONTH_ORDER[(index + 1) % MONTH_ORDER.length];
}

function monthsFormRun(months, runLength) {
  const uniqueMonths = Array.from(new Set(months));
  if (uniqueMonths.length !== runLength) return false;
  return MONTH_ORDER.some((_, start) => (
    Array.from({ length: runLength }, (_, index) => MONTH_ORDER[(start + index) % MONTH_ORDER.length])
      .every((month) => uniqueMonths.includes(month))
  ));
}

function matchingConsecutiveMonthSequence(months) {
  const uniqueMonths = Array.from(new Set(months));
  if (uniqueMonths.length !== months.length) return null;
  for (let start = 0; start < MONTH_ORDER.length; start += 1) {
    const targets = Array.from(
      { length: months.length },
      (_, index) => MONTH_ORDER[(start + index) % MONTH_ORDER.length]
    );
    if (targets.every((month) => uniqueMonths.includes(month))) {
      return targets;
    }
  }
  return null;
}

function bestMonthRunProgress(cards, runLength, capPerMonth) {
  let best = 0;
  for (let start = 0; start < MONTH_ORDER.length; start += 1) {
    const targetMonths = Array.from(
      { length: runLength },
      (_, index) => MONTH_ORDER[(start + index) % MONTH_ORDER.length]
    );
    const progress = targetMonths.reduce((sum, month) => (
      sum + Math.min(capPerMonth, cards.filter((card) => card.month === month).length)
    ), 0);
    best = Math.max(best, progress);
  }
  return best;
}

function countPresentColors(cards, elements) {
  const presentElements = new Set(cards.map((card) => card.element));
  return elements.filter((element) => presentElements.has(element)).length;
}

function countPresentBaseColors(cards) {
  return countPresentColors(cards, ELEMENTS);
}

function allFiveColorsPresent(cards) {
  return countPresentBaseColors(cards) === ELEMENTS.length;
}

function allSixColorsPresent(cards) {

}

function monthParityOfMonth(month) {
  return Number(month) % 2 === 0 ? "even" : "odd";
}

function allSameMonthParity(cards) {
  if (!allMonthCards(cards)) return false;
  return new Set(cards.map((card) => monthParityOfMonth(card.month))).size === 1;
}

function monthParityTargets(parity) {
  return MONTH_ORDER.filter((month) => monthParityOfMonth(month) === parity);
}

function matchingMonthParitySequence(months) {
  const uniqueMonths = Array.from(new Set(months));
  if (uniqueMonths.length !== GAME_CONFIG.winningHandSize) return null;
  for (const parity of ["odd", "even"]) {
    const targets = monthParityTargets(parity);
    if (targets.every((month) => uniqueMonths.includes(month))) {
      return targets;
    }
  }
  return null;
}

function bestMonthParityProgress(cards, capPerMonth = 1) {
  const monthCards = cards.filter(isMonthCard);
  return Math.max(...["odd", "even"].map((parity) => (
    monthParityTargets(parity).reduce((sum, month) => (
      sum + Math.min(capPerMonth, monthCards.filter((card) => card.month === month).length)
    ), 0)
  )));
}

function pairIdentityGroups(cards) {
  const counts = {};
  cards.forEach((card) => {
    const key = cardGroupKey(card);
    counts[key] = (counts[key] || 0) + 1;
  });
  return Object.entries(counts).filter(([, count]) => count === 2);
}

function windCompassProgress(cards) {
  return WIND_SYMBOLS.reduce((sum, wind) => sum + Math.min(1, cards.filter((card) => card.wind === wind).length), 0);
}

function windElementCoverage(cards, element = null) {
  const windCards = cards.filter((card) => isWindCard(card) && (!element || card.element === element));
  return windCompassProgress(windCards);
}

function maxSameWindCount(cards) {
  return Math.max(0, ...WIND_SYMBOLS.map((wind) => cards.filter((card) => isWindCard(card) && card.wind === wind).length));
}

function maxSameElementWindCoverage(cards) {
  return Math.max(0, ...ALL_ELEMENTS.map((element) => windElementCoverage(cards, element)));
}

function twoMonthSequenceProgress(cards) {
  return bestMonthRunProgress(cards.filter(isMonthCard), 2, 1);
}

function twoMonthPairProgress(cards) {
  const monthCounts = cards.filter(isMonthCard).reduce((counts, card) => {
    counts[card.month] = (counts[card.month] || 0) + 1;
    return counts;
  }, {});
  return Math.min(2, Math.max(0, ...Object.values(monthCounts)));
}

function parityOfCard(card) {
  return card.id % 2 === 0 ? "even" : "odd";
}

function allSameParity(cards) {
  return new Set(cards.map((card) => parityOfCard(card))).size === 1;
}

function parityCounts(cards) {
  return cards.reduce((counts, card) => {
    const parity = parityOfCard(card);
    counts[parity] = (counts[parity] || 0) + 1;
    return counts;
  }, { odd: 0, even: 0 });
}

function hasThreeOddThreeEven(cards) {
  const counts = parityCounts(cards);
  return counts.odd === 3 && counts.even === 3;
}

function parityBalanceDistance(cards) {
  const counts = parityCounts(cards);
  return Math.max(0, counts.odd - 3, counts.even - 3);
}

function canContainThreeOddThreeEven(cards) {
  const counts = parityCounts(cards);
  return counts.odd >= 3 && counts.even >= 3;
}

function alternatingMonthTargets(start) {
  return Array.from(
    { length: GAME_CONFIG.winningHandSize },
    (_, index) => MONTH_ORDER[(start + index * 2) % MONTH_ORDER.length]
  );
}

function matchingAlternatingMonthSequence(months) {
  const uniqueMonths = Array.from(new Set(months));
  if (uniqueMonths.length !== GAME_CONFIG.winningHandSize) return null;
  for (let start = 0; start < MONTH_ORDER.length; start += 1) {
    const targets = alternatingMonthTargets(start);
    if (targets.every((month) => uniqueMonths.includes(month))) {
      return targets;
    }
  }
  return null;
}

function bestAlternatingMonthProgress(cards, capPerMonth = 1) {
  let best = 0;
  for (let start = 0; start < MONTH_ORDER.length; start += 1) {
    const targets = alternatingMonthTargets(start);
    const progress = targets.reduce((sum, month) => (
      sum + Math.min(capPerMonth, cards.filter((card) => card.month === month).length)
    ), 0);
    best = Math.max(best, progress);
  }
  return best;
}

function seatForPlayer(playerIndex, dealerIndex) {
  return WIND_ORDER[(playerIndex - dealerIndex + WIND_ORDER.length) % WIND_ORDER.length];
}

    `;
  }

  const accent = ELEMENT_COLORS[card.element] || "#405066";
  const faceClass = card.element === WHITE_ELEMENT ? "card-face white-card-face" : "card-face";
  return `
    <div class="${faceClass}" style="--card-accent: ${accent};" aria-hidden="true">
      <div class="tile-month">${cardDisplayValue(card)}</div>
    </div>
  `;
}

function nextDealerIndex() {
  if (state.phase !== "finished") return state.dealerIndex ?? INITIAL_DEALER_INDEX;
  if (state.winners?.includes(state.dealerIndex)) return state.dealerIndex;
  return ((state.dealerIndex ?? INITIAL_DEALER_INDEX) + 1) % TABLE_CONFIG.players.length;
}

function dealerIndexForNextHand() {
  if (!state.players.length) {
    return Math.floor(Math.random() * TABLE_CONFIG.players.length);
  }
  return nextDealerIndex();
}
