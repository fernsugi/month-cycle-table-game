    points: 9,
    priority: 1,
    size: GAME_CONFIG.winningHandSize,
    matches(cards) {
      if (!allMonthCards(cards)) return false;
      const monthCounts = {};
      cards.forEach((card) => {
        monthCounts[card.month] = (monthCounts[card.month] || 0) + 1;
      });

      const counts = Object.values(monthCounts).sort((a, b) => b - a);
      return counts.length === 2
        && counts.every((count) => count === 3)
        && allSameParity(cards);
    },
    describe(cards) {
      const months = Array.from(new Set(cards.map((card) => card.month)))
        .sort((a, b) => MONTH_ORDER_INDEX[a] - MONTH_ORDER_INDEX[b])
        .map((month) => month);
      return `Three ${months[0]} cards and three ${months[1]} cards, all ${parityOfCard(cards[0])}.`;
    },
    distance(cards) {
      const monthCounts = {};
      cards.forEach((card) => {
        monthCounts[card.month] = (monthCounts[card.month] || 0) + 1;
      });
      const tripleProgress = Object.values(monthCounts)
        .sort((a, b) => b - a)
        .slice(0, 2)
        .reduce((sum, count) => sum + Math.min(3, count), 0);
      const parityCounts = cards.reduce((counts, card) => {
        const parity = parityOfCard(card);
        counts[parity] = (counts[parity] || 0) + 1;
        return counts;
      }, {});
      return Math.max(
        GAME_CONFIG.winningHandSize - tripleProgress,
        GAME_CONFIG.winningHandSize - Math.max(0, ...Object.values(parityCounts))
      );
    },
  },
  // Grand Crown: all six cards of the current round month, or all six of your home wind.
  {
    id: "ending-digit-ladder",
    label: "Grand Crown",
    points: 15,
    size: GAME_CONFIG.winningHandSize,
    matches(cards, playerIndex = null) {
      const roundMonth = getRoundMonthTarget();
      return (Boolean(roundMonth) && allMonthCards(cards) && cards.every((card) => card.month === roundMonth))
        || (playerIndex !== null && allWindCards(cards) && cards.every((card) => cardHomeWindMatchesPlayer(card, playerIndex)));
    },
    describe(cards, playerIndex = null) {
      if (allWindCards(cards)) {
        return `All 6 cards are your home wind: ${WIND_NAMES[HOME_WIND_BY_SEAT[getPlayer(playerIndex)?.seat] || "home wind"]}.`;
      }
      const roundMonth = getRoundMonthTarget() || cards[0]?.month;
      return `All 6 cards are month ${roundMonth}, matching the current round.`;
    },
    distance(cards, playerIndex = null) {
      const roundMonth = getRoundMonthTarget();
      const monthProgress = roundMonth
        ? cards.filter((card) => isMonthCard(card) && card.month === roundMonth).length
        : 0;
      const windProgress = playerIndex === null
        ? 0
        : cards.filter((card) => cardHomeWindMatchesPlayer(card, playerIndex)).length;
      return GAME_CONFIG.winningHandSize - Math.max(monthProgress, windProgress);
    },
  },
  {
    id: "mono-compass",
    label: "Mono Compass",
    points: 15,
    size: GAME_CONFIG.winningHandSize,
    matches(cards) {
      const windCards = cards.filter(isWindCard);
      const otherCards = cards.filter(isMonthCard);
      if (windCards.length !== 4 || otherCards.length !== 2) return false;
      if (new Set(windCards.map((card) => card.wind)).size !== 4) return false;
      if (new Set(cards.map((card) => card.element)).size !== 1) return false;
      return monthsFormRun(otherCards.map((card) => card.month), 2);
    },
    describe(cards) {
      const sequence = cards.filter(isMonthCard).map((card) => card.month).sort((a, b) => Number(a) - Number(b));
      return `N, S, E, W plus the ${sequence.join("-")} sequence, all in one color.`;
    },
    distance(cards) {
      let best = GAME_CONFIG.winningHandSize;
      ALL_ELEMENTS.forEach((element) => {
        const matchingWinds = WIND_SYMBOLS.reduce((sum, wind) => sum + Math.min(1, cards.filter((card) => card.wind === wind && card.element === element).length), 0);
        const sequenceProgress = twoMonthSequenceProgress(cards.filter((card) => card.element === element));
        best = Math.min(best, GAME_CONFIG.winningHandSize - (matchingWinds + sequenceProgress));
      });
      return best;
    },
  },
];

const WIND_RULE_IDS = new Set([
  "any-wind",
  "four-with-neighbors",
  "compass-pair",
  "three-wind-pairs",
  "two-wind-threes",
  "ending-digit-ladder",
  "mono-compass",
]);

const ALWAYS_WIND_RULE_IDS = new Set([
  "any-wind",
  "compass-pair",
  "three-wind-pairs",
  "two-wind-threes",
  "mono-compass",
]);

const analysisCache = {
  winningLayouts: new Map(),
  handShape: new Map(),
  publicPotential: new Map(),
  openCompletion: new Map(),
};

function minimumOpenCardsForPoints(points) {
  if (points === 3) return 3;
  if (points === 6) return 2;
  if (points === 9) return 1;
  return null;
}

function gearAdjustedPoints(points, openCardCount) {
  if (points === 3) return openCardCount >= 3 ? 3 : 0;
  if (points === 6) return openCardCount >= 3 ? 6 : openCardCount >= 2 ? 3 : 0;
  if (points === 9) return openCardCount >= 3 ? 9 : openCardCount >= 2 ? 6 : openCardCount >= 1 ? 3 : 0;
  if (points === 12) return openCardCount >= 5 ? 12 : openCardCount >= 4 ? 9 : 6;
  if (points === 15) return openCardCount >= 5 ? 15 : openCardCount >= 4 ? 12 : 9;
  return points;
}

function gearRequirementText(points) {
  if (points === 3) return "Requires at least 3 open cards";
  if (points === 6) return "2 open cards scores 3 points; 3+ open cards scores 6 points";
  if (points === 9) return "1 open card scores 3 points; 2 open cards scores 6 points; 3+ open cards scores 9 points";
  if (points === 12) return "0-3 open cards scores 6 points; 4 open cards scores 9 points; 5 open cards scores 12 points";
  if (points === 15) return "0-3 open cards scores 9 points; 4 open cards scores 12 points; 5 open cards scores 15 points";
  return "No gear requirement";
}

function gearMatches(points, openCardCount) {
  return gearAdjustedPoints(points, openCardCount) > 0;
}

function gearGapForPoints(points, openCardCount) {
  const required = minimumOpenCardsForPoints(points);
  if (required === null) return 0;
  return Math.max(0, required - openCardCount);
}

function filterLayoutsByGear(layouts, openCardCount) {
  return layouts.filter((layout) => layout.every((group) => {
    const rule = getRuleById(group.ruleId);
    return rule && gearMatches(rule.points, openCardCount);
  }));
}

function openCardsAreConsecutiveInGroup(cards, openCardIds) {
  const openGroupCards = cards.filter((card) => openCardIds.has(card.id));
  if (openGroupCards.length <= 1) return true;
  const orderedMonths = matchingConsecutiveMonthSequence(cards.map((card) => card.month));
  if (!orderedMonths) return true;
  const openMonths = new Set(openGroupCards.map((card) => card.month));
  const openIndexes = orderedMonths
    .map((month, index) => (openMonths.has(month) ? index : -1))
    .filter((index) => index >= 0);
  return openIndexes[openIndexes.length - 1] - openIndexes[0] + 1 === openIndexes.length;
}

function groupMatchesOpenConstraints(group, openCardIds) {
  if (!openCardIds.size) return true;
  if (group.ruleId === "month-run") {
    return openCardsAreConsecutiveInGroup(group.cards, openCardIds);
  }
  return true;
}

function layoutMatchesOpenConstraints(layout, openCards = []) {
  if (!openCards.length) return true;
  const openCardIds = new Set(openCards.map((card) => card.id));
  return layout.every((group) => groupMatchesOpenConstraints(group, openCardIds));
}

function cardsAnalysisKey(cards) {
  return cards
    .map((card) => card.id)
    .slice()
    .sort((a, b) => a - b)
    .join("-");
}

function findWinningLayouts(cards, playerIndex = null) {
  const cacheKey = `${cardsAnalysisKey(cards)}|${playerIndex ?? "none"}`;
  const cached = analysisCache.winningLayouts.get(cacheKey);
  if (cached) return cached;

  const sortedCards = sortCardsByNumber(cards);
  const layouts = [];
  const seen = new Set();

  function walk(remaining, groups) {
    if (remaining.length === 0) {
      const signature = groups
        .map((group) => `${group.ruleId}:${group.cards.map((card) => card.id).join("-")}`)
        .sort()
        .join("|");
      if (!seen.has(signature)) {
        seen.add(signature);
        layouts.push(groups);
      }
      return;
    }

    for (const rule of SET_RULES) {
      if (rule.size > remaining.length) continue;
      const options = combinations(remaining, rule.size);
      for (const option of options) {
        if (!rule.matches(option, playerIndex)) continue;
        const idSet = new Set(option.map((card) => card.id));
        const nextRemaining = remaining.filter((card) => !idSet.has(card.id));
        walk(nextRemaining, groups.concat({
          ruleId: rule.id,
          label: rule.label,
          detail: rule.describe(option, playerIndex),
          cards: sortCardsForDisplay(option),
        }));
      }
    }
  }

  walk(sortedCards, []);
  analysisCache.winningLayouts.set(cacheKey, layouts);
  return layouts;
}

function findValidWinningLayouts(cards, openCardCount, openCards = [], playerIndex = null) {
  return filterLayoutsByGear(findWinningLayouts(cards, playerIndex), openCardCount)
    .filter((layout) => layoutMatchesOpenConstraints(layout, openCards));
}

function lockedOpenCardsCanWin(openCards, playerIndex = null) {
  if (openCards.length > GAME_CONFIG.winningHandSize) return false;
  if (openCards.length < 4) return true;

  const cacheKey = `${cardsAnalysisKey(openCards)}|${openCards.length}|${playerIndex ?? "none"}`;
  const cached = analysisCache.openCompletion.get(cacheKey);
  if (cached !== undefined) return cached;

  const openIds = new Set(openCards.map((card) => card.id));
  const completionSize = GAME_CONFIG.winningHandSize - openCards.length;
  const candidates = allCards.filter((card) => !openIds.has(card.id));
  const canWin = combinations(candidates, completionSize).some((completion) => (
    findValidWinningLayouts(openCards.concat(completion), openCards.length, openCards, playerIndex).length > 0
  ));

  analysisCache.openCompletion.set(cacheKey, canWin);
  return canWin;
}

function removeCardById(cards, cardId) {
  const index = cards.findIndex((card) => card.id === cardId);
  if (index === -1) return { removed: null, next: cards.slice() };
  const next = cards.slice();
  const [removed] = next.splice(index, 1);
  return { removed, next };
}

function removeLastCardById(cards, cardId) {
  const index = cards.map((card) => card.id).lastIndexOf(cardId);
  if (index === -1) return { removed: null, next: cards.slice() };
  const next = cards.slice();
  const [removed] = next.splice(index, 1);
  return { removed, next };
}

const state = {
  players: [],
  points: Array(TABLE_CONFIG.players.length).fill(GAME_CONFIG.startingPoints),
  roundNumber: 1,
  wall: [],
  currentTurn: 0,
  dealerIndex: INITIAL_DEALER_INDEX,
  phase: "idle",
  call: "None",
  pendingClaim: null,
  lastDiscard: null,
  lastDrawnCardId: null,
  openCardClaims: {},
  selectedCardId: null,
  inspectCardId: null,
  logs: [],
  winner: null,
  winners: [],
  matchFinished: false,
  matchSummary: null,
  timer: null,
  assistEnabled: false,
};

function getRoundMonthTarget() {
  if (state.roundNumber < 1 || state.roundNumber > GAME_CONFIG.matchRounds) return null;
  return String(state.roundNumber);
}

function getRoundLabel() {
  if (state.roundNumber <= GAME_CONFIG.matchRounds) return String(state.roundNumber);
  return `SD ${state.roundNumber - GAME_CONFIG.matchRounds}`;
}

function getLayoutCards(layout) {
  const seen = new Set();
  return (layout || []).flatMap((group) => group.cards).filter((card) => {
    if (seen.has(card.id)) return false;
    seen.add(card.id);
    return true;
  });
}

function roundBonusForLayout(layout) {
  const roundMonth = getRoundMonthTarget();
  if (!roundMonth) return 0;
  return getLayoutCards(layout).some((card) => card.month === roundMonth)
    ? GAME_CONFIG.roundBonusPoints
    : 0;
}

function roundBonusForCard(card) {
  const roundMonth = getRoundMonthTarget();
  if (!roundMonth || !card) return 0;
  return card.month === roundMonth ? GAME_CONFIG.roundBonusPoints : 0;
}

function homeWindBonusForLayout(layout, playerIndex = null) {
  if (playerIndex === null || playerIndex === undefined) return 0;
  return getLayoutCards(layout).some((card) => cardHomeWindMatchesPlayer(card, playerIndex))
    ? GAME_CONFIG.homeWindBonusPoints
    : 0;
}

function totalLayoutPoints(layout, openCardCount = null, playerIndex = null) {
  return scoreLayout(layout, openCardCount) + roundBonusForLayout(layout) + homeWindBonusForLayout(layout, playerIndex);
}

function getLayoutPointBreakdown(layout, openCardCount = null, playerIndex = null) {
  const basePoints = scoreLayout(layout || [], openCardCount);
  const bonusPoints = roundBonusForLayout(layout || []) + homeWindBonusForLayout(layout || [], playerIndex);
  return {
    basePoints,
    bonusPoints,
    points: basePoints + bonusPoints,
  };
}

function getMatchLeaders() {
  const best = Math.max(...state.points);
  return state.points
    .map((points, index) => ({ points, index }))
    .filter((entry) => entry.points === best)
    .map((entry) => entry.index);
}

function updateMatchSummary() {
  const leaders = getMatchLeaders();
  const busted = state.points.some((value) => value <= 0);
  const atOrPastLimit = state.roundNumber >= GAME_CONFIG.matchRounds;

  if (busted || (atOrPastLimit && leaders.length === 1)) {
    state.matchFinished = true;
    state.matchSummary = {
      leaders,
      reason: busted ? "bust" : state.roundNumber > GAME_CONFIG.matchRounds ? "sudden-death" : "round-limit",
    };
    return true;
  }

  state.matchFinished = false;
  state.matchSummary = atOrPastLimit ? { leaders, reason: "tie" } : null;
  return false;
}

function formatRoundBonusText(bonusPoints) {
  return bonusPoints ? ` + ${bonusPoints} bonus` : "";
}

function formatPointSummary(points, bonusPoints) {
  if (!bonusPoints) return `${points} points`;
  return `${points} points (${points - bonusPoints} + ${bonusPoints} bonus)`;
}

function groupPointsForGear(group, openCardCount = null) {
  const points = getRuleById(group.ruleId)?.points || 0;
  return openCardCount === null ? points : gearAdjustedPoints(points, openCardCount);
}

function formatPlayerTag(playerIndex) {
  const player = getPlayer(playerIndex);
  return player ? `${player.seat} (${player.name})` : `P${playerIndex + 1}`;
}

function formatCardShort(card) {
  return card ? `${cardDisplayValue(card)} ${card.element}` : "unknown card";
}

function formatCardSource(card, playerIndex) {
  if (playerIndex === null || playerIndex === undefined) return formatCardShort(card);
  return `${formatPlayerTag(playerIndex)}'s ${formatCardShort(card)}`;
}

function formatMatchSummaryText() {
  if (!state.matchSummary) return "";
  const leaderNames = state.matchSummary.leaders.map((index) => formatPlayerTag(index));
  if (state.matchFinished) {
    if (leaderNames.length === 1) {
      return `${leaderNames[0]} wins the match in round ${getRoundLabel()}.`;
    }
    return `Match ends tied between ${leaderNames.join(" and ")} in round ${getRoundLabel()}.`;
  }
  return `Round ${GAME_CONFIG.matchRounds} ends tied between ${leaderNames.join(" and ")}. Sudden death continues.`;
}

function makePlayers() {
  return TABLE_CONFIG.players.map((player, index) => ({
    ...player,
    seat: seatForPlayer(index, state.dealerIndex),
    homeWind: HOME_WIND_BY_SEAT[seatForPlayer(index, state.dealerIndex)],
    points: state.points[index],
    hand: [],
    openCards: [],
    discards: [],
    status: player.isHuman ? "Awaiting opening draw." : "Brutal AI ready.",
  }));
}

function logEvent(text) {
  state.logs.unshift({ text, id: `${Date.now()}-${Math.random()}` });
  state.logs = state.logs.slice(0, GAME_CONFIG.logLimit);
}

function getPlayer(index) {
  return state.players[index];
}

function getHumanPlayer() {
  return getPlayer(HUMAN_PLAYER_INDEX);
}

function getOpenClaimType(card) {
  return state.openCardClaims[card.id] || "open";
}

function setOpenClaimType(cards, type) {
  cards.forEach((card) => {
    state.openCardClaims[card.id] = type;
  });
}

function isHumanIndex(playerIndex) {
  return playerIndex === HUMAN_PLAYER_INDEX;
}

function formatSeatHandSize(count) {
  return String(count);
}

function formatPoints(value) {
  return `${value} pt`;
}

function formatOrdinal(value) {
  const mod100 = value % 100;
  if (mod100 >= 11 && mod100 <= 13) return `${value}th`;
  const mod10 = value % 10;
  if (mod10 === 1) return `${value}st`;
  if (mod10 === 2) return `${value}nd`;
  if (mod10 === 3) return `${value}rd`;
  return `${value}th`;
}

function analyzeWinningDraws(hand, wall, openCardCount = 0, openCards = []) {
  return wall.reduce((summary, card) => {
    const layouts = findValidWinningLayouts(hand.concat(card), openCardCount, openCards, HUMAN_PLAYER_INDEX);
    if (!layouts.length) return summary;
    const points = totalLayoutPoints(chooseBestLayout(layouts, openCardCount, HUMAN_PLAYER_INDEX) || [], openCardCount, HUMAN_PLAYER_INDEX);
    return {
      winningDraws: summary.winningDraws + 1,
      totalWinningPoints: summary.totalWinningPoints + points,
      bestWinningPoints: Math.max(summary.bestWinningPoints, points),
    };
  }, {
    winningDraws: 0,
    totalWinningPoints: 0,
    bestWinningPoints: 0,
  });
}

function getFullHand(playerIndex, concealedHand = getPlayer(playerIndex).hand, openCards = getPlayer(playerIndex).openCards) {
  return sortCardsForDisplay(concealedHand.concat(openCards));
}

function getPublicKnownCardIds(playerIndex, ownHand = getPlayer(playerIndex).hand, extraKnownCards = []) {
  const known = new Set();
  ownHand.forEach((card) => known.add(card.id));
  getPlayer(playerIndex).openCards.forEach((card) => known.add(card.id));
  state.players.forEach((player) => {
    player.discards.forEach((card) => known.add(card.id));
    player.openCards.forEach((card) => known.add(card.id));
  });
  extraKnownCards.forEach((card) => {
    if (card) known.add(card.id);
  });
  return known;
}

function publicRemainingCardsFor(playerIndex, ownHand = getPlayer(playerIndex).hand, ownOpenCards = getPlayer(playerIndex).openCards, extraKnownCards = []) {
  const knownIds = getPublicKnownCardIds(playerIndex, ownHand.concat(ownOpenCards), extraKnownCards);
  return allCards.filter((card) => !knownIds.has(card.id));
}

function publicPotentialCacheKey(playerIndex, concealedHand, openCards, extraKnownCards = []) {
  const visibleHandKey = cardsAnalysisKey(concealedHand.concat(openCards));
  const extraKey = extraKnownCards
    .filter(Boolean)
    .map((card) => card.id)
    .sort((a, b) => a - b)
    .join("-");
  return `${playerIndex}|${visibleHandKey}|${openCards.length}|${extraKey}`;
}

function sampleDrawPoolForContext(drawPool, context = PUBLIC_AI_CONTEXT) {
  const sampleMax = context?.drawSampleMax || 0;
  if (!sampleMax || drawPool.length <= sampleMax) return drawPool;
  const step = drawPool.length / sampleMax;
  return Array.from({ length: sampleMax }, (_, index) => drawPool[Math.floor(index * step)]);
}

function analyzePublicPotential(
  playerIndex,
  concealedHand = getPlayer(playerIndex).hand,
  openCards = getPlayer(playerIndex).openCards,
  extraKnownCards = [],
  currentShape = null,
  currentFocus = null,
  context = PUBLIC_AI_CONTEXT
) {
  const cacheKey = publicPotentialCacheKey(playerIndex, concealedHand, openCards, extraKnownCards);
  const useCache = !context?.useHiddenIntel;
  const cached = useCache ? analysisCache.publicPotential.get(cacheKey) : null;
  if (cached) return cached;

  const fullHand = getFullHand(playerIndex, concealedHand, openCards);
  const shape = currentShape || evaluateHandShape(fullHand, openCards.length, playerIndex);
  const focus = currentFocus || evaluateRuleFocus(shape);
  const drawPool = getDrawPoolForDecision(playerIndex, concealedHand, openCards, extraKnownCards, context);
  const sampledDrawPool = sampleDrawPoolForContext(drawPool, context);
  const sampleScale = sampledDrawPool.length ? drawPool.length / sampledDrawPool.length : 1;

  const result = {
    winningDraws: 0,
    totalWinningPoints: 0,
    bestWinningPoints: 0,
    nearReadyDraws: 0,
    distanceGainDraws: 0,
    focusImproveDraws: 0,
    poolSize: drawPool.length,
  };

  const shouldCheckWins = shape.bestDistance <= 2;

  sampledDrawPool.forEach((drawCard) => {
    const futureFullHand = getFullHand(playerIndex, concealedHand.concat(drawCard), openCards);
    const futureShape = evaluateHandShape(futureFullHand, openCards.length, playerIndex);
    const futureFocus = evaluateRuleFocus(futureShape);

    if (futureShape.bestDistance < shape.bestDistance) {
      result.distanceGainDraws += 1;
    }

    if (futureShape.bestDistance <= 1) {
      result.nearReadyDraws += 1;
    }

    if (futureFocus.primary > focus.primary) {
      result.focusImproveDraws += 1;
    }

    if (!shouldCheckWins || futureShape.bestDistance !== 0) return;

    const winningLayouts = findValidWinningLayouts(futureFullHand, openCards.length, openCards, playerIndex);
    if (!winningLayouts.length) return;
    const points = totalLayoutPoints(chooseBestLayout(winningLayouts, openCards.length, playerIndex) || [], openCards.length, playerIndex);
    result.winningDraws += 1;
    result.totalWinningPoints += points;
    result.bestWinningPoints = Math.max(result.bestWinningPoints, points);
  });

  if (sampleScale !== 1) {
    result.winningDraws *= sampleScale;
    result.totalWinningPoints *= sampleScale;
    result.nearReadyDraws *= sampleScale;
    result.distanceGainDraws *= sampleScale;
    result.focusImproveDraws *= sampleScale;
  }

  if (useCache) {
    analysisCache.publicPotential.set(cacheKey, result);
  }
  return result;
}

function actualWallDrawPool(extraKnownCards = []) {
  const excludedIds = new Set(extraKnownCards.filter(Boolean).map((card) => card.id));
  return state.wall.filter((card) => !excludedIds.has(card.id));
}

function getDrawPoolForDecision(
  playerIndex,
  concealedHand = getPlayer(playerIndex).hand,
  openCards = getPlayer(playerIndex).openCards,
  extraKnownCards = [],
  context = PUBLIC_AI_CONTEXT
) {
  if (context?.useHiddenIntel) {
    return actualWallDrawPool(extraKnownCards);
  }
  return publicRemainingCardsFor(playerIndex, concealedHand, openCards, extraKnownCards);
}

function descendDecisionContext(context = PUBLIC_AI_CONTEXT, overrides = {}) {
  return {
    ...context,
    lookaheadDepth: Math.max(0, (context?.lookaheadDepth ?? 0) - 1),
    exactResponseDepth: Math.max(0, (context?.exactResponseDepth ?? 0) - 1),
    ...overrides,
  };
}

function decisionContextForPlayer(playerIndex, context = BRUTAL_AI_CONTEXT) {
  return isHumanIndex(playerIndex) ? PUBLIC_AI_CONTEXT : context;
}

function getRuleById(ruleId) {
  return SET_RULES.find((rule) => rule.id === ruleId) || null;
}

function ruleFamilyId(ruleId) {
  if (ruleId.startsWith("same-element")) return "same-element";
  if (ruleId === "polarity-five-elements") return "polarity-five-elements";
  if (ruleId.startsWith("month-run")) return "month-run";
  if (
    ruleId === "four-with-neighbors" ||
    ruleId === "four-plus-two-side" ||
    ruleId === "four-plus-split-sides"
  ) {
    return "neighbor-months";
  }
  if (ruleId.startsWith("three-month-pairs")) return "three-month-pairs";
  if (ruleId.startsWith("two-month-threes")) return "two-month-threes";
  if (ruleId === "six-run") return "six-run";
  if (ruleId === "ending-digit-ladder") return "ending-digit-ladder";
  return ruleId;
}

function scoreLayout(layout, openCardCount = null) {
  return layout.reduce((sum, group) => {
    const rawPoints = getRuleById(group.ruleId)?.points || 0;
    const points = openCardCount === null ? rawPoints : gearAdjustedPoints(rawPoints, openCardCount);
    return sum + points;
  }, 0);
}

function layoutPriority(layout) {
  return layout.reduce((sum, group) => sum + (getRuleById(group.ruleId)?.priority || 0), 0);
}

function chooseBestLayout(layouts, openCardCount = null, playerIndex = null) {
  return layouts.slice().sort((a, b) => {
    const pointDiff = totalLayoutPoints(b, openCardCount, playerIndex) - totalLayoutPoints(a, openCardCount, playerIndex);
    if (pointDiff !== 0) return pointDiff;
    const priorityDiff = layoutPriority(b) - layoutPriority(a);
    if (priorityDiff !== 0) return priorityDiff;
    return b.length - a.length;
  })[0] || null;
}

function syncPlayerPoints() {
  state.players.forEach((player, index) => {
    player.points = state.points[index];
  });
}

function settleWin(playerIndex, type, points, discarderIndex = null) {
  const changes = Array(state.players.length).fill(0);

  if (type === "tsumo") {
    const share = points / 3;
    state.players.forEach((_, index) => {
      if (index === playerIndex) return;
      changes[index] -= share;
      changes[playerIndex] += share;
    });
  } else if (discarderIndex !== null) {
    changes[playerIndex] += points;
    changes[discarderIndex] -= points;
  }

  state.points = state.points.map((value, index) => value + changes[index]);
  syncPlayerPoints();
  return changes;
}

function settleRonThreats(threats, discarderIndex) {
  const changes = Array(state.players.length).fill(0);
  const results = threats.map((threat) => {
    const openCardCount = threat.openCardCount ?? getPlayer(threat.playerIndex)?.openCards.length ?? 0;
    const scoringLayout = threat.scoringLayout || chooseBestLayout(threat.layouts, openCardCount, threat.playerIndex);
    const basePoints = threat.basePoints ?? scoreLayout(scoringLayout || [], openCardCount);
    const bonusPoints = threat.bonusPoints ?? (roundBonusForLayout(scoringLayout || []) + homeWindBonusForLayout(scoringLayout || [], threat.playerIndex));
    const points = basePoints + bonusPoints;
    changes[threat.playerIndex] += points;
    changes[discarderIndex] -= points;
    return {
      playerIndex: threat.playerIndex,
      layouts: threat.layouts,
      scoringLayout,
      openCardCount,
      basePoints,
      bonusPoints,
      points,
    };
  });

  state.points = state.points.map((value, index) => value + changes[index]);
  syncPlayerPoints();
  return { results, settlement: changes };
}

function formatSettlement(changes) {
  return changes
    .map((delta, index) => ({ delta, index }))
    .filter((entry) => entry.delta !== 0)
    .map((entry) => `${formatPlayerTag(entry.index)} ${entry.delta > 0 ? "+" : ""}${entry.delta}`)
    .join(" · ");
}

function evaluateWindAffinity(cards, openCardCount = 0, playerIndex = null) {
  const windCards = cards.filter(isWindCard);
  if (!windCards.length) return 0;

  const weights = AI_CONFIG.windStrategy;
  const player = getPlayer(playerIndex);
  const openCardIds = new Set((player?.openCards || []).map((card) => card.id));
  const homeWind = HOME_WIND_BY_SEAT[player?.seat];
  const homeWindCount = homeWind
    ? windCards.filter((card) => card.wind === homeWind).length
    : 0;
  const sameWindCount = maxSameWindCount(windCards);
  const distinctWindCount = windCompassProgress(windCards);
  const monoCompassCoverage = maxSameElementWindCoverage(windCards);
  const openWindCards = windCards.filter((card) => openCardIds.has(card.id));

  let score = 0;
  score += homeWindCount * weights.homeWindCard;
  score += Math.max(0, homeWindCount - 1) * weights.homeWindStack;

  if (sameWindCount >= 2) score += weights.sameWindPair * (sameWindCount - 1);
  if (sameWindCount >= 3) score += weights.sameWindTriple * (sameWindCount - 2);
  if (sameWindCount >= 4) score += weights.sameWindNearCrown * (sameWindCount - 3);

  score += distinctWindCount * weights.distinctWind;
  if (distinctWindCount >= 3) score += weights.compassCoverage * (distinctWindCount - 2);
  if (monoCompassCoverage >= 2) score += weights.monoCompassCoverage * (monoCompassCoverage - 1);
  if (windCards.length >= 4) score += weights.allWindMass * (windCards.length - 3);

  if (openWindCards.length) {
    score += Math.min(openCardCount, openWindCards.length) * weights.openWindGear;
    if (openWindCards.some((card) => cardHomeWindMatchesPlayer(card, playerIndex))) {
      score += weights.openHomeWindGear;
    }
  }

  return score;
}

function evaluateHandShape(hand, openCardCount = 0, playerIndex = null) {
  const cacheKey = `${cardsAnalysisKey(hand)}|${openCardCount}|${playerIndex ?? "none"}`;
  const cached = analysisCache.handShape.get(cacheKey);
  if (cached) return cached;

  const distances = SET_RULES.map((rule) => {
    const rawDistance = rule.distance(hand, playerIndex);
    const gearGap = gearGapForPoints(rule.points, openCardCount);
    const currentPoints = gearAdjustedPoints(rule.points, openCardCount) || rule.points;
    return {
      ruleId: rule.id,
      label: rule.label,
      points: currentPoints,
      basePoints: rule.points,
      rawDistance,
      gearGap,
      distance: rawDistance + gearGap,
    };
  }).sort((a, b) => {
    if (a.distance !== b.distance) return a.distance - b.distance;
    if (a.rawDistance !== b.rawDistance) return a.rawDistance - b.rawDistance;
    return b.points - a.points;
  });

  const familyBest = new Map();
  distances.forEach((item) => {
    const progress = Math.max(0, GAME_CONFIG.winningHandSize - item.distance);
    const candidate = {
      support: progress * item.points,
      near: item.distance <= 2 ? item.points : 0,
    };
    const familyId = ruleFamilyId(item.ruleId);
    const existing = familyBest.get(familyId);
    if (
      !existing ||
      candidate.support > existing.support ||
      (candidate.support === existing.support && candidate.near > existing.near)
    ) {
      familyBest.set(familyId, candidate);
    }
  });

  const result = {
    bestDistance: distances[0]?.distance ?? GAME_CONFIG.winningHandSize,
    support: Array.from(familyBest.values()).reduce((sum, item) => sum + item.support, 0),
    nearRules: Array.from(familyBest.values()).reduce((sum, item) => sum + item.near, 0),
    distances,
  };

  analysisCache.handShape.set(cacheKey, result);
  return result;
}

function evaluateRuleFocus(shape) {
  const ranked = shape.distances
    .map((item) => {
      const progress = Math.max(0, GAME_CONFIG.winningHandSize - item.distance);
      return {
        ...item,
        progress,
        focusScore: progress === 0 ? 0 : (item.points * progress) / Math.max(1, item.distance),
      };
    })
    .sort((a, b) => {
      if (b.focusScore !== a.focusScore) return b.focusScore - a.focusScore;
      if (b.points !== a.points) return b.points - a.points;
      return a.distance - b.distance;
    });

  const primary = ranked[0]?.focusScore || 0;
  const secondary = ranked[1]?.focusScore || 0;
  return {
    primary,
    secondary,
    primaryRuleId: ranked[0]?.ruleId || null,
    primaryDistance: ranked[0]?.distance ?? GAME_CONFIG.winningHandSize,
    primaryPoints: ranked[0]?.points || 0,
    gap: primary - secondary,
    ranked: ranked.slice(0, 3).map((item) => ({
      ruleId: item.ruleId,
      label: item.label,
      points: item.points,
      distance: item.distance,
      focusScore: item.focusScore,
      progress: item.progress,
    })),
  };
}

function evaluateDiscardContinuity(beforeShape, beforeFocus, afterShape, afterFocus) {
  const weights = AI_CONFIG.continuity;
  const afterByRule = new Map(afterShape.distances.map((item) => [item.ruleId, item]));
  let score = 0;

  (beforeFocus.ranked || []).forEach((entry, index) => {
    const after = afterByRule.get(entry.ruleId);
    if (!after) return;

    const distanceShift = after.distance - entry.distance;
    const penaltyWeight = index === 0
      ? weights.primaryDistancePenalty
      : index === 1
        ? weights.secondaryDistancePenalty
        : weights.tertiaryDistancePenalty;
    const bonusWeight = index === 0
      ? weights.primaryDistanceBonus
      : index === 1
        ? weights.secondaryDistanceBonus
        : weights.tertiaryDistanceBonus;

    if (distanceShift > 0) {
      score -= distanceShift * entry.points * penaltyWeight;
      if (entry.distance === 0) {
        score -= weights.readyBreakPenalty * Math.max(1, entry.points / 3);
      } else if (entry.distance === 1) {
        score -= weights.oneAwayBreakPenalty * Math.max(1, entry.points / 4);
      }
    } else if (distanceShift < 0) {
      score += (-distanceShift) * entry.points * bonusWeight;
    }
  });

  const committedLine = beforeFocus.primaryRuleId && beforeFocus.primaryDistance <= 2 && beforeFocus.gap >= 6;
  const commitmentScale = Math.max(1, beforeFocus.primaryPoints / 6);
  if (committedLine) {
    if (beforeFocus.primaryRuleId === afterFocus.primaryRuleId) {
      score += weights.committedPreserveBonus * commitmentScale;
    } else {
      score -= weights.committedSwitchPenalty * commitmentScale;
    }
  }

  if (beforeShape.bestDistance <= 1 && afterShape.bestDistance > beforeShape.bestDistance) {
    score -= weights.readyBreakPenalty * Math.max(1, beforeFocus.primaryPoints / 4);
  }

  return score;
}

function evaluateStrategyProfile(playerIndex) {
  const player = getPlayer(playerIndex);
  const others = state.players
    .filter((_, index) => index !== playerIndex)
    .map((entry) => entry);
  const leaderOtherPoints = others.length ? Math.max(...others.map((entry) => entry.points)) : player.points;
  const gapBehind = Math.max(0, leaderOtherPoints - player.points);
  const leadOverTable = Math.max(0, player.points - leaderOtherPoints);
  const strategy = AI_CONFIG.strategy;
  const hottestOpponent = others.reduce((best, opponent) => (
    Math.max(best, opponent.openCards.length + (opponent.points >= player.points ? 0.5 : 0))
  ), 0);

  let offense = 1
    + Math.min(strategy.maxTrailingAggression, gapBehind * strategy.trailingAggressionPerPoint)
    + player.openCards.length * strategy.openCardAggression
    + hottestOpponent * strategy.exposedOpponentPressure;
  if (player.seat === "East") {
    offense += strategy.dealerAggression;
  }

  const defense = 0.68 + Math.min(strategy.maxLeadingDefense, leadOverTable * strategy.leadingDefensePerPoint);
  let claimBias = 1
    + Math.min(strategy.maxClaimBias, gapBehind * strategy.claimBiasPerPoint)
    + player.openCards.length * strategy.openCardAggression
    + hottestOpponent * strategy.exposedOpponentPressure;
  let risk = 1.06
    + Math.min(strategy.maxTrailingAggression * 0.6, gapBehind * strategy.trailingAggressionPerPoint)
    + player.openCards.length * 0.03;
  risk -= Math.min(strategy.maxLeadRiskBrake, leadOverTable * strategy.leadRiskBrakePerPoint);

  return {
    offense: Math.max(1, offense),
    defense: Math.min(0.96, Math.max(0.56, defense)),
    claimBias: Math.max(1, claimBias),
    risk: Math.max(0.92, risk),
  };
}

function opponentsInRonOrder(discarderIndex) {
  const order = [];
  for (let step = 1; step < state.players.length; step += 1) {
    order.push((discarderIndex + step) % state.players.length);
  }
  return order;
}

function exactRonThreats(discarderIndex, card) {
  return opponentsInRonOrder(discarderIndex)
    .map((playerIndex) => {
      const openCardCount = getPlayer(playerIndex).openCards.length;
      const layouts = findValidWinningLayouts(
        getFullHand(playerIndex).concat(card),
        openCardCount,
        getPlayer(playerIndex).openCards,
        playerIndex
      );
      if (!layouts.length) return null;
      const bestLayout = chooseBestLayout(layouts, openCardCount, playerIndex);
      const { basePoints, bonusPoints, points } = getLayoutPointBreakdown(bestLayout || [], openCardCount, playerIndex);
      return {
        playerIndex,
        layouts,
        scoringLayout: bestLayout,
        openCardCount,
        basePoints,
        bonusPoints,
        points,
      };
    })
    .filter(Boolean);
}

function buildMonthClaimState(
  playerIndex,
  card,
  type,
  concealedHand = getPlayer(playerIndex).hand,
  openCards = getPlayer(playerIndex).openCards
) {
  const neededCount = type === "kan" ? 4 : 3;
  const groupKey = cardGroupKey(card);
  const matchingConcealed = concealedHand.filter((item) => cardGroupKey(item) === groupKey);
  const matchingOpen = openCards.filter((item) => cardGroupKey(item) === groupKey);
  const totalMatching = matchingConcealed.length + matchingOpen.length;
  if (totalMatching !== neededCount) return null;

  const remainingHand = sortCardsForDisplay(concealedHand.filter((item) => cardGroupKey(item) !== groupKey));
  if (!remainingHand.length) return null;

  const otherOpenCards = openCards.filter((item) => cardGroupKey(item) !== groupKey);
  const claimGroup = sortCardsForDisplay(matchingOpen.concat(matchingConcealed, card));
  return {
    playerIndex,
    type,
    groupKey,
    month: card.month,
    wind: card.wind,
    card,
    matchingConcealed,
    matchingOpen,
    remainingHand,
    claimGroup,
    nextOpenCards: otherOpenCards.concat(claimGroup),
  };
}

function buildSelfKanState(
  playerIndex,
  concealedHand = getPlayer(playerIndex).hand,
  openCards = getPlayer(playerIndex).openCards
) {
  const countsByGroup = concealedHand.reduce((counts, card) => {
    const key = cardGroupKey(card);
    if (!key) return counts;
    counts[key] = (counts[key] || 0) + 1;
    return counts;
  }, {});
  const targetGroup = Object.keys(countsByGroup).find((key) => countsByGroup[key] === 5);
  if (!targetGroup) return null;

  const claimGroup = sortCardsForDisplay(concealedHand.filter((card) => cardGroupKey(card) === targetGroup));
  const remainingHand = sortCardsForDisplay(concealedHand.filter((card) => cardGroupKey(card) !== targetGroup));
  if (!remainingHand.length) return null;

  const leadCard = claimGroup[0];
  return {
    playerIndex,
    type: "self-kan",
    groupKey: targetGroup,
    month: leadCard?.month || null,
    wind: leadCard?.wind || null,
    claimGroup,
    remainingHand,
    nextOpenCards: openCards.concat(claimGroup),
  };
}

function exactKanThreats(discarderIndex, card) {
  return opponentsInRonOrder(discarderIndex)
    .map((playerIndex) => buildMonthClaimState(playerIndex, card, "kan"))
    .filter(Boolean);
}

function exactPonThreats(discarderIndex, card) {
  return opponentsInRonOrder(discarderIndex)
    .map((playerIndex) => buildMonthClaimState(playerIndex, card, "pon"))
    .filter(Boolean);
}

function evaluateClaimThreatPenalty(type, choice) {
  const tactical = AI_CONFIG.tactical;
  const basePenalty = type === "kan"
    ? tactical.exactKanPenalty
    : type === "pon"
      ? tactical.exactPonPenalty
      : tactical.exactChiPenalty;

  return (
    basePenalty +
    Math.max(0, choice.scoreGain || 0) * tactical.claimScoreGainPenalty +
    (choice.drawStats?.winningDraws || 0) * tactical.claimWaitPenalty +
    (choice.drawStats?.bestWinningPoints || 0) * tactical.claimPointPenalty +
    (choice.focus?.primary || 0) * tactical.claimFocusPenalty
  );
}

function evaluateImmediateResponseProfile(discarderIndex, card, context = BRUTAL_AI_CONTEXT) {
  const tactical = AI_CONFIG.tactical;
  const ronThreats = exactRonThreats(discarderIndex, card);
  if (ronThreats.length) {
    const totalPoints = ronThreats.reduce((sum, threat) => sum + threat.points, 0);
    return {
      type: "ron",
      claimerIndex: ronThreats[0]?.playerIndex ?? null,
      ronThreats,
      claimChoice: null,
      totalPenalty: tactical.exactRonPenaltyBase * ronThreats.length + totalPoints * tactical.exactRonPointPenalty,
    };
  }

  const responseContext = descendDecisionContext(context, {
    lookaheadDepth: 0,
    exactResponseDepth: 0,
  });

  for (const threat of exactKanThreats(discarderIndex, card)) {
    const claimChoice = withAIProfile(threat.playerIndex, () => (
      chooseAIKanWithContext(
        threat.playerIndex,
        card,
        decisionContextForPlayer(threat.playerIndex, responseContext)
      )
    ));
    if (claimChoice) {
      return {
        type: "kan",
        claimerIndex: threat.playerIndex,
        ronThreats: [],
        claimChoice,
        totalPenalty: evaluateClaimThreatPenalty("kan", claimChoice),
      };
    }
  }

  for (const threat of exactPonThreats(discarderIndex, card)) {
    const claimChoice = withAIProfile(threat.playerIndex, () => (
      chooseAIPonWithContext(
        threat.playerIndex,
        card,
        decisionContextForPlayer(threat.playerIndex, responseContext)
      )
    ));
    if (claimChoice) {
      return {
        type: "pon",
        claimerIndex: threat.playerIndex,
        ronThreats: [],
        claimChoice,
        totalPenalty: evaluateClaimThreatPenalty("pon", claimChoice),
      };
    }
  }

  const chiPlayerIndex = chiPlayerIndexFor(discarderIndex);
  if (canPlayerChi(chiPlayerIndex)) {
    const claimChoice = withAIProfile(chiPlayerIndex, () => (
      chooseAIChiWithContext(
        chiPlayerIndex,
        card,
        decisionContextForPlayer(chiPlayerIndex, responseContext)
      )
    ));
    if (claimChoice) {
      return {
        type: "chi",
        claimerIndex: chiPlayerIndex,
        ronThreats: [],
        claimChoice,
        totalPenalty: evaluateClaimThreatPenalty("chi", claimChoice),
      };
    }
  }

  return {
    type: null,
    claimerIndex: null,
    ronThreats: [],
    claimChoice: null,
    totalPenalty: 0,
  };
}

function evaluateImmediateRonResponseProfile(discarderIndex, card) {
  const tactical = AI_CONFIG.tactical;
  const ronThreats = exactRonThreats(discarderIndex, card);
  if (!ronThreats.length) {
    return {
      type: null,
      claimerIndex: null,
      ronThreats: [],
      totalPenalty: 0,
    };
  }

  const totalPoints = ronThreats.reduce((sum, threat) => sum + threat.points, 0);
  return {
    type: "ron",
    claimerIndex: ronThreats[0]?.playerIndex ?? null,
    ronThreats,
    totalPenalty: tactical.exactRonPenaltyBase * ronThreats.length + totalPoints * tactical.exactRonPointPenalty,
  };
}

function threatPointsForRule(ruleId, openCardCount, card, playerIndex = null) {
  const rule = getRuleById(ruleId);
  if (!rule) return 0;
  const basePoints = gearAdjustedPoints(rule.points, openCardCount);
  if (!basePoints) return 0;
  return basePoints + roundBonusForCard(card) + (cardHomeWindMatchesPlayer(card, playerIndex) ? GAME_CONFIG.homeWindBonusPoints : 0);
}

function estimatePublicDiscardDanger(card, publicPool, openCardCount = 0, playerIndex = null) {
  if (isWindCard(card)) {
    const sameWindCount = publicPool.filter((item) => item.wind === card.wind).length;
    const sameElementCount = publicPool.filter((item) => item.element === card.element).length;
    const publicWindCards = publicPool.filter(isWindCard);
    const windCoverage = new Set(publicWindCards.map((item) => item.wind));
    const monoWindCoverage = new Set(
      publicWindCards.filter((item) => item.element === card.element).map((item) => item.wind)
    );
    const pairOrSequenceProgress = Math.max(twoMonthPairProgress(publicPool), twoMonthSequenceProgress(publicPool));
    const opponentSignals = AI_CONFIG.opponentSignals;
    const opponentOpenCards = getPlayer(playerIndex)?.openCards || [];
    const openWindCards = opponentOpenCards.filter(isWindCard);
    const openSameWindCount = openWindCards.filter((item) => item.wind === card.wind).length;
    const openWindCoverage = new Set(openWindCards.map((item) => item.wind));
    const openMonoWindCoverage = new Set(
      openWindCards.filter((item) => item.element === card.element).map((item) => item.wind)
    );

    let danger = 0;
    if (cardHomeWindMatchesPlayer(card, playerIndex)) {
      danger += opponentSignals.homeWindDanger + threatPointsForRule("ending-digit-ladder", openCardCount, card, playerIndex) * 0.8;
    }
    if (openSameWindCount >= 1) {
      danger += opponentSignals.openSameWindDanger * openSameWindCount;
      if (openSameWindCount >= 3) {
        danger += threatPointsForRule(
          cardHomeWindMatchesPlayer(card, playerIndex) ? "ending-digit-ladder" : "four-with-neighbors",
          openCardCount,
          card,
          playerIndex
        );
      }
    }
    if (!openWindCoverage.has(card.wind) && openWindCoverage.size >= 2) {
      danger += opponentSignals.openCompassDanger * (openWindCoverage.size - 1);
    }
    if (!openMonoWindCoverage.has(card.wind) && openMonoWindCoverage.size >= 2) {
      danger += opponentSignals.openMonoCompassDanger * (openMonoWindCoverage.size - 1);
    }
    if (publicWindCards.length >= GAME_CONFIG.winningHandSize - 1) {
      danger += threatPointsForRule("any-wind", openCardCount, card, playerIndex);
    }
    if (sameElementCount >= GAME_CONFIG.winningHandSize - 1) {
      danger += threatPointsForRule("same-element", openCardCount, card, playerIndex);
    }
    if (sameWindCount >= GAME_CONFIG.winningHandSize - 1) {
      danger += threatPointsForRule(
        cardHomeWindMatchesPlayer(card, playerIndex) ? "ending-digit-ladder" : "four-with-neighbors",
        openCardCount,
        card,
        playerIndex
      ) * 1.5;
    }
    if (WIND_SYMBOLS.every((wind) => wind === card.wind || windCoverage.has(wind))) {
      danger += threatPointsForRule("compass-pair", openCardCount, card, playerIndex) * (pairOrSequenceProgress >= 2 ? 1.2 : 0.75);
    }
    if (WIND_SYMBOLS.every((wind) => wind === card.wind || monoWindCoverage.has(wind))) {
      danger += threatPointsForRule("mono-compass", openCardCount, card, playerIndex) * (twoMonthSequenceProgress(publicPool) >= 2 ? 1.2 : 0.75);
    }
    const windCounts = publicWindCards.concat(card).reduce((counts, item) => {
      counts[item.wind] = (counts[item.wind] || 0) + 1;
      return counts;
    }, {});
    if (Object.values(windCounts).filter((count) => count >= 2).length >= 3) {
      danger += threatPointsForRule("three-wind-pairs", openCardCount, card, playerIndex);
    }
    if (Object.values(windCounts).filter((count) => count >= 3).length >= 2) {
      danger += threatPointsForRule("two-wind-threes", openCardCount, card, playerIndex);
    }
    return danger;
  }

  const sameMonthCount = publicPool.filter((item) => item.month === card.month).length;
  const sameElementCount = publicPool.filter((item) => item.element === card.element).length;
  const sideMonthSet = new Set([previousMonth(card.month), nextMonth(card.month)]);
  const sideMonthCount = publicPool.filter((item) => sideMonthSet.has(item.month)).length;

  let danger = 0;

  const sameElementPool = publicPool.filter((item) => item.element === card.element).concat(card);
  if (sameElementPool.length >= GAME_CONFIG.winningHandSize && bestMonthParityProgress(sameElementPool, 1) >= GAME_CONFIG.winningHandSize) {
    danger += threatPointsForRule("six-run", openCardCount, card, playerIndex);
  }

  let elementFamilyDanger = 0;
  if (sameElementCount >= 5) {
    elementFamilyDanger = Math.max(
      elementFamilyDanger,
      threatPointsForRule("same-element", openCardCount, card, playerIndex) * (1 + (sameElementCount - 5) * 0.35)
    );
  }
  danger += elementFamilyDanger;

  const colorsMonthsPool = publicPool.concat(card);
  if (
    allSixColorsPresent(colorsMonthsPool) &&
    bestMonthParityProgress(colorsMonthsPool, 1) >= GAME_CONFIG.winningHandSize
  ) {
    danger += threatPointsForRule("polarity-five-elements", openCardCount, card, playerIndex) * 2;
  }

  for (let start = 0; start < MONTH_ORDER.length; start += 1) {
    const windowMonths = Array.from(
      { length: GAME_CONFIG.winningHandSize },
      (_, index) => MONTH_ORDER[(start + index) % MONTH_ORDER.length]
    );
    if (!windowMonths.includes(card.month)) continue;
    const monthComplete = windowMonths.every((month) => (
      month === card.month || publicPool.some((item) => item.month === month)
    ));
    if (monthComplete) {
      danger += threatPointsForRule("month-run", openCardCount, card, playerIndex);
    }
    const elementComplete = windowMonths.every((month) => (
      month === card.month || publicPool.some((item) => item.month === month && item.element === card.element)
    ));
    if (elementComplete) {
      danger += threatPointsForRule("month-run-element", openCardCount, card, playerIndex);
    }
  }

  const hasSixColorsWithCard = allSixColorsPresent(publicPool.concat(card));

  if (sameMonthCount >= GAME_CONFIG.winningHandSize - 1 && hasSixColorsWithCard) {
    danger += threatPointsForRule("four-with-neighbors", openCardCount, card, playerIndex) * 1.5;
  } else if (sameMonthCount >= 4 && sideMonthCount >= 1 && hasSixColorsWithCard) {
    danger += threatPointsForRule("four-with-neighbors", openCardCount, card, playerIndex) * 1.5;
  }

  const previousCount = publicPool.filter((item) => item.month === previousMonth(card.month)).length;
  const nextCount = publicPool.filter((item) => item.month === nextMonth(card.month)).length;
  if (sameMonthCount >= 3 && (previousCount >= 2 || nextCount >= 2) && hasSixColorsWithCard) {
    danger += threatPointsForRule("four-plus-two-side", openCardCount, card, playerIndex) * 1.3;
  }
  if (sameMonthCount >= 3 && previousCount >= 1 && nextCount >= 1 && hasSixColorsWithCard) {
    danger += threatPointsForRule("four-plus-split-sides", openCardCount, card, playerIndex) * 1.2;
  }

  [previousMonth(card.month), nextMonth(card.month)].forEach((coreMonth) => {
    const coreCount = publicPool.filter((item) => item.month === coreMonth).length;
    if (coreCount >= 5 && hasSixColorsWithCard) {
      danger += threatPointsForRule("four-with-neighbors", openCardCount, card, playerIndex) * 0.75;
    }
    if (coreCount >= 4 && sameMonthCount >= 1 && hasSixColorsWithCard) {
      danger += threatPointsForRule("four-plus-two-side", openCardCount, card, playerIndex);
    }
    const oppositeSideMonth = coreMonth === previousMonth(card.month)
      ? previousMonth(coreMonth)
      : nextMonth(coreMonth);
    const oppositeSideCount = publicPool.filter((item) => item.month === oppositeSideMonth).length;
    if (coreCount >= 4 && oppositeSideCount >= 1 && sameMonthCount >= 1 && hasSixColorsWithCard) {
      danger += threatPointsForRule("four-plus-split-sides", openCardCount, card, playerIndex);
    }
  });

  if (sameMonthCount >= 1) {
    let consecutivePairRuns = 0;
    for (let start = 0; start < MONTH_ORDER.length; start += 1) {
      const windowMonths = Array.from(
        { length: 3 },
        (_, index) => MONTH_ORDER[(start + index) % MONTH_ORDER.length]
      );
      if (!windowMonths.includes(card.month)) continue;
      const otherMonths = windowMonths.filter((month) => month !== card.month);
      if (otherMonths.every((month) => publicPool.filter((item) => item.month === month).length >= 2)) {
        consecutivePairRuns += 1;
      }
    }
    if (consecutivePairRuns >= 1) {
      danger += threatPointsForRule("three-month-pairs", openCardCount, card, playerIndex) * Math.min(2, consecutivePairRuns);
    }
  }

  const consecutiveTripleMonths = [previousMonth(card.month), nextMonth(card.month)]
    .filter((month) => publicPool.filter((item) => item.month === month).length >= 3)
    .length;
  if (sameMonthCount >= 2 && consecutiveTripleMonths >= 1) {
    danger += threatPointsForRule("two-month-threes", openCardCount, card, playerIndex) * Math.min(2, consecutiveTripleMonths);
  }

  const roundMonth = getRoundMonthTarget();
  if (roundMonth && card.month === roundMonth && sameMonthCount >= 5) {
    danger += threatPointsForRule("ending-digit-ladder", openCardCount, card, playerIndex) * 2;
  }

  return danger;
}

function calculateHandValue(drawStats, shape) {
  const weights = AI_CONFIG.discardWeights;
  return (
    drawStats.winningDraws * weights.winningDraw +
    drawStats.totalWinningPoints * weights.winningPoint +
    drawStats.bestWinningPoints * weights.bestWinningPoint +
    (drawStats.nearReadyDraws || 0) * weights.nearReadyDraw +
    (drawStats.distanceGainDraws || 0) * weights.distanceGainDraw +
    (drawStats.focusImproveDraws || 0) * weights.focusImproveDraw +
    shape.support * weights.shapeSupport +
    shape.nearRules * weights.nearRule -
    shape.bestDistance * weights.distancePenalty
  );
}

function estimateOpponentCardInterest(playerIndex, card) {
  const player = getPlayer(playerIndex);
  const signals = AI_CONFIG.opponentSignals;
  const openCards = player.openCards;
  const discards = player.discards;
  const groupKey = cardGroupKey(card);

  const openMonthMatches = openCards.filter((item) => cardGroupKey(item) === groupKey).length;
  const openElementMatches = openCards.filter((item) => item.element === card.element).length;
  const openNeighborMatches = isMonthCard(card)
    ? openCards.filter((item) => (
      isMonthCard(item) && (previousMonth(item.month) === card.month || nextMonth(item.month) === card.month)
    )).length
    : 0;
  const openColors = new Set(openCards.map((item) => item.element));
  const openMonths = new Set(openCards.filter(isMonthCard).map((item) => item.month));
  const openWinds = new Set(openCards.filter(isWindCard).map((item) => item.wind));

  const discardMonthMatches = discards.filter((item) => cardGroupKey(item) === groupKey).length;
  const discardElementMatches = discards.filter((item) => item.element === card.element).length;

  let signal = 1;
  signal += openCards.length * signals.openCardPressure;
  signal += openMonthMatches * signals.openMonthBonus;
  signal += openElementMatches * signals.openElementBonus;
  signal += openNeighborMatches * signals.sideMonthBonus;
  if (openCards.length) {
    signal += openCards.length * signals.sixColorOpenPressure;
    if (!openColors.has(card.element)) signal += signals.sixColorNewColorBonus;
    if (isMonthCard(card) && !openMonths.has(card.month)) signal += signals.sixColorNewMonthBonus;
    if (isWindCard(card) && !openWinds.has(card.wind)) signal += signals.sixColorNewMonthBonus;
    if (openColors.size >= 4 || openMonths.size >= 4 || openWinds.size >= 3) signal += signals.sixColorNearBonus;
  }

  signal -= Math.min(
    signals.maxDiscardRelief,
    discardMonthMatches * signals.discardMonthRelief +
      discardElementMatches * signals.discardElementRelief
  );

  if (player.seat === "East") {
    signal += signals.dealerPressure;
  }

  const visibleLeaderPoints = Math.max(...state.players.map((entry) => entry.points));
  const trailingGap = Math.max(0, visibleLeaderPoints - player.points);
  signal += Math.min(signals.maxTrailingPressure, trailingGap * signals.trailingPointFactor);

  return Math.max(signals.minSignal, Math.min(signal, signals.maxSignal));
}

function estimateOpponentDiscardDanger(playerIndex, card, publicPool) {
  const baseDanger = estimatePublicDiscardDanger(card, publicPool, getPlayer(playerIndex).openCards.length, playerIndex);
  const interest = estimateOpponentCardInterest(playerIndex, card);
  return {
    playerIndex,
    baseDanger,
    interest,
    danger: baseDanger * interest,
  };
}

function estimateDiscardDangerProfile(discarderIndex, card, publicPool) {
  const detail = opponentsInRonOrder(discarderIndex)
    .map((playerIndex) => estimateOpponentDiscardDanger(playerIndex, card, publicPool));
  const total = detail.reduce((sum, entry) => sum + entry.danger, 0);
  return {
    detail,
    total,
    average: detail.length ? total / detail.length : 0,
    max: detail.reduce((best, entry) => Math.max(best, entry.danger), 0),
  };
}

function estimateOpponentClaimPressure(playerIndex, discarderIndex, card, publicPool) {
  const player = getPlayer(playerIndex);
  const claimSignals = AI_CONFIG.claimSignals;
  if (!player.hand.length) {
    return {
      playerIndex,
      chi: 0,
      pon: 0,
      kan: 0,
      total: 0,
    };
  }

  const interest = estimateOpponentCardInterest(playerIndex, card);
  const groupKey = cardGroupKey(card);
  const sameMonthOpen = player.openCards.filter((item) => cardGroupKey(item) === groupKey).length;
  const sameMonthDiscards = player.discards.filter((item) => cardGroupKey(item) === groupKey).length;
  const unseenSameMonth = publicPool.filter((item) => cardGroupKey(item) === groupKey).length;
  const visibleLeaderPoints = Math.max(...state.players.map((entry) => entry.points));
  const isLeader = player.points === visibleLeaderPoints;
  const isDealer = player.seat === "East";
  const discardRelief = Math.min(
    claimSignals.maxDiscardRelief,
    sameMonthDiscards * claimSignals.discardMonthRelief
  );
  const threatBoost = 1
    + (isDealer ? claimSignals.dealerThreatBonus : 0)
    + (isLeader ? claimSignals.leaderThreatBonus : 0);

  let chi = 0;
  if (playerIndex === chiPlayerIndexFor(discarderIndex)) {
    const openWindCoverage = new Set(player.openCards.filter(isWindCard).map((item) => item.wind));
    const windChiFactor = isWindCard(card)
      ? claimSignals.windChiMultiplier +
        player.openCards.filter((item) => cardGroupKey(item) === groupKey).length * claimSignals.windChiOpenSupport +
        (openWindCoverage.size >= 2 && !openWindCoverage.has(card.wind) ? claimSignals.windChiCompassSupport : 0)
      : 1;
    chi = (
      claimSignals.nextChiBase +
      interest * claimSignals.nextChiInterest +
      sameMonthOpen * claimSignals.nextChiMonthBonus
    ) * windChiFactor * threatBoost * (1 - discardRelief * 0.5);
  }

  function estimateSetClaimPressure(type, neededTotal) {
    const hiddenNeed = Math.max(0, neededTotal - sameMonthOpen);
    if (hiddenNeed >= claimSignals.hiddenNeedFactors.length) return 0;
    if (unseenSameMonth < hiddenNeed) return 0;
    const base = type === "kan" ? claimSignals.kanBase : claimSignals.ponBase;
    const availability = unseenSameMonth * claimSignals.sameMonthDepthBonus;
    return (
      base +
      interest * claimSignals.claimInterest +
      sameMonthOpen * claimSignals.openMonthBonus +
      availability
    ) * claimSignals.hiddenNeedFactors[hiddenNeed] * threatBoost * (1 - discardRelief);
  }

  let pon = estimateSetClaimPressure("pon", 3);
  let kan = estimateSetClaimPressure("kan", 4);
  if (isWindCard(card)) {
    const homeWindFactor = cardHomeWindMatchesPlayer(card, playerIndex)
      ? claimSignals.homeWindSetClaimMultiplier
      : 1;
    pon *= claimSignals.windPonMultiplier * homeWindFactor;
    kan *= claimSignals.windKanMultiplier * homeWindFactor;
  }
  return {
    playerIndex,
    chi,
    pon,
    kan,
    total: chi + pon + kan,
  };
}

function estimateClaimPressureProfile(discarderIndex, card, publicPool) {
  const detail = opponentsInRonOrder(discarderIndex)
    .map((playerIndex) => estimateOpponentClaimPressure(playerIndex, discarderIndex, card, publicPool));
  const total = detail.reduce((sum, entry) => sum + entry.total, 0);
  return {
    detail,
    total,
    average: detail.length ? total / detail.length : 0,
    max: detail.reduce((best, entry) => Math.max(best, entry.total), 0),
  };
}

function rankLookaheadDraws(playerIndex, concealedHand, openCards, publicDrawPool) {
  return publicDrawPool
    .map((drawCard) => {
      const fullHand = getFullHand(playerIndex, concealedHand.concat(drawCard), openCards);
      const winningLayouts = findValidWinningLayouts(fullHand, openCards.length, openCards, playerIndex);
      if (winningLayouts.length) {
        return {
          drawCard,
          priority: 100000 + totalLayoutPoints(
            chooseBestLayout(winningLayouts, openCards.length, playerIndex) || [],
            openCards.length,
            playerIndex
          ),
        };
      }

      const shape = evaluateHandShape(fullHand, openCards.length, playerIndex);
      const focus = evaluateRuleFocus(shape);
      return {
        drawCard,
        priority:
          shape.support * 2 +
          shape.nearRules * 6 +
          focus.primary * 14 +
          focus.gap * 8 -
          shape.bestDistance * 52,
      };
    })
    .sort((a, b) => {
      if (b.priority !== a.priority) return b.priority - a.priority;
      return b.drawCard.id - a.drawCard.id;
    });
}

function selectLookaheadDraws(playerIndex, concealedHand, openCards, publicDrawPool) {
  const shape = evaluateHandShape(getFullHand(playerIndex, concealedHand, openCards), openCards.length, playerIndex);
  if (
    publicDrawPool.length <= AI_CONFIG.lookaheadExactPoolMax ||
    shape.bestDistance <= AI_CONFIG.lookaheadExactDistance
  ) {
    return publicDrawPool.slice();
  }

  return rankLookaheadDraws(playerIndex, concealedHand, openCards, publicDrawPool)
    .slice(0, Math.min(AI_CONFIG.lookaheadDrawSample, publicDrawPool.length))
    .map((entry) => entry.drawCard);
}

function evaluateLookaheadContinuation(
  playerIndex,
  concealedHand,
  openCards,
  extraKnownCards = [],
  context = PUBLIC_AI_CONTEXT
) {
  const drawPool = getDrawPoolForDecision(playerIndex, concealedHand, openCards, extraKnownCards, context);
  if (!drawPool.length) {
    return {
      averageScore: 0,
      peakScore: 0,
      sampleCount: 0,
    };
  }

  const sampledDraws = selectLookaheadDraws(playerIndex, concealedHand, openCards, drawPool);
  const maxSampleCount = context.lookaheadDepth > 1
    ? AI_CONFIG.lookaheadDrawSample
    : AI_CONFIG.lookaheadRecursiveDrawSample;
  const trimmedDraws = sampledDraws.slice(0, Math.min(maxSampleCount, sampledDraws.length));
  let totalScore = 0;
  let peakScore = 0;
  const nextContext = descendDecisionContext(context);

  trimmedDraws.forEach((drawCard) => {
    const simulatedConcealed = sortCardsForDisplay(concealedHand.concat(drawCard));
    const winningLayouts = findValidWinningLayouts(
      getFullHand(playerIndex, simulatedConcealed, openCards),
      openCards.length,
      openCards,
      playerIndex
    );
    let futureScore = 0;

    if (winningLayouts.length) {
      const points = totalLayoutPoints(chooseBestLayout(winningLayouts, openCards.length, playerIndex) || [], openCards.length, playerIndex);
      futureScore = AI_CONFIG.lookaheadImmediateWinBase + points * AI_CONFIG.lookaheadImmediateWinPoint;
    } else {
      const futureChoice = chooseAIDiscardWithContext(
        playerIndex,
        simulatedConcealed,
        openCards,
        extraKnownCards.concat(drawCard),
        nextContext.lookaheadDepth > 0,
        nextContext
      );
      futureScore = futureChoice?.score || 0;
    }

    totalScore += futureScore;
    peakScore = Math.max(peakScore, futureScore);
  });

  return {
    averageScore: totalScore / trimmedDraws.length,
    peakScore,
    sampleCount: trimmedDraws.length,
  };
}

function evaluateFutureHand(
  playerIndex,
  concealedHand,
  openCards,
  extraKnownCards = [],
  context = PUBLIC_AI_CONTEXT
) {
  const fullHand = getFullHand(playerIndex, concealedHand, openCards);
  const shape = evaluateHandShape(fullHand, openCards.length, playerIndex);
  const focus = evaluateRuleFocus(shape);
  const strategy = evaluateStrategyProfile(playerIndex);
  const weights = AI_CONFIG.discardWeights;
  const drawStats = analyzePublicPotential(
    playerIndex,
    concealedHand,
    openCards,
    extraKnownCards,
    shape,
    focus,
    context
  );
  let score =
    calculateHandValue(drawStats, shape) +
    focus.primary * weights.focusPrimary +
    focus.secondary * weights.focusSecondary +
    focus.gap * weights.focusGap +
    evaluateWindAffinity(fullHand, openCards.length, playerIndex) * weights.windAffinity +
    openCards.length * weights.openPressureBonus;

  if (shape.bestDistance === 0) {
    score += weights.readyBonus;
  } else if (shape.bestDistance === 1) {
    score += weights.oneAwayBonus;
  }

  return {
    drawStats,
    shape,
    focus,
    strategy,
    score: score * strategy.offense,
  };
}

function analyzeClaimCandidate(baseline, candidate) {
  const baselineByRule = new Map(baseline.shape.distances.map((item) => [item.ruleId, item]));
  const improvedRules = candidate.shape.distances
    .map((item) => {
      const previous = baselineByRule.get(item.ruleId);
      if (!previous) return null;
      const distanceGain = previous.distance - item.distance;
      if (distanceGain <= 0) return null;
      return {
        ruleId: item.ruleId,
        label: item.label,
        points: item.points,
        beforeDistance: previous.distance,
        afterDistance: item.distance,
        distanceGain,
        valueGain: distanceGain * item.points,
      };
    })
    .filter(Boolean)
    .sort((a, b) => {
      if (b.valueGain !== a.valueGain) return b.valueGain - a.valueGain;
      if (a.afterDistance !== b.afterDistance) return a.afterDistance - b.afterDistance;
      if (b.points !== a.points) return b.points - a.points;
      return a.label.localeCompare(b.label);
    });

  return {
    scoreGain: candidate.score - baseline.score,
    bestDistanceGain: baseline.shape.bestDistance - candidate.shape.bestDistance,
    focusGain: candidate.focus.primary - baseline.focus.primary,
    baselinePrimaryRuleId: baseline.focus.primaryRuleId,
    candidatePrimaryRuleId: candidate.focus.primaryRuleId,
    winningDrawGain: candidate.drawStats.winningDraws - baseline.drawStats.winningDraws,
    totalWinningPointGain: candidate.drawStats.totalWinningPoints - baseline.drawStats.totalWinningPoints,
    bestWinningPointGain: candidate.drawStats.bestWinningPoints - baseline.drawStats.bestWinningPoints,
    improvedRules,
    bestRuleImprovement: improvedRules[0] || null,
    primaryRuleChanged: baseline.focus.primaryRuleId !== candidate.focus.primaryRuleId,
  };
}

function shouldTakeClaim(type, analysis, scoreThreshold, strategy = { claimBias: 1 }, claimedCard = null) {
  const adjustedThreshold = scoreThreshold / Math.max(1, strategy.claimBias || 1);
  const bestRule = analysis.bestRuleImprovement;
  const sixColorPush =
    analysis.candidatePrimaryRuleId === "polarity-five-elements" ||
    bestRule?.ruleId === "polarity-five-elements";
  const windSetPush =
    isWindCard(claimedCard) &&
    (WIND_RULE_IDS.has(analysis.candidatePrimaryRuleId) || WIND_RULE_IDS.has(bestRule?.ruleId));
  const samePrimaryRule =
    analysis.baselinePrimaryRuleId &&
    analysis.baselinePrimaryRuleId === analysis.candidatePrimaryRuleId;
  const speedGain = analysis.bestDistanceGain >= 1 || analysis.winningDrawGain >= 1;
  const strongSpeedGain = analysis.bestDistanceGain >= 2 || analysis.winningDrawGain >= 2;
  const pointGain =
    analysis.totalWinningPointGain >= 4 ||
    analysis.bestWinningPointGain >= 4;
  const focusGain = analysis.focusGain >= 2;
  const strongRuleJump = Boolean(bestRule && bestRule.valueGain >= 10);

  if (strongSpeedGain || strongRuleJump) return true;
  if (sixColorPush && (speedGain || pointGain || focusGain)) return true;
  if ((type === "pon" || type === "kan") && windSetPush && (speedGain || pointGain || focusGain)) {
    return analysis.scoreGain >= adjustedThreshold * 0.45 || analysis.bestDistanceGain >= 1;
  }
  if (samePrimaryRule && speedGain) return true;
  if ((type === "pon" || type === "kan") && speedGain && (pointGain || focusGain)) return true;
  if (type === "chi" && analysis.bestDistanceGain >= 1 && (focusGain || pointGain)) return true;
  if (!speedGain && !pointGain && !focusGain) return false;
  return analysis.scoreGain >= adjustedThreshold;
}

function shouldTakeChiClaim(baseline, candidate, analysis, strategy, claimedCard = null) {
  const adjustedThreshold = AI_CONFIG.chiThreshold / Math.max(1, strategy.claimBias || 1);
  const samePrimaryRule =
    analysis.baselinePrimaryRuleId &&
    analysis.baselinePrimaryRuleId === analysis.candidatePrimaryRuleId;
  const bestRule = analysis.bestRuleImprovement;
  const sixColorPush =
    analysis.candidatePrimaryRuleId === "polarity-five-elements" ||
    bestRule?.ruleId === "polarity-five-elements";
  const windPush =
    isWindCard(claimedCard) &&
    (WIND_RULE_IDS.has(analysis.candidatePrimaryRuleId) || WIND_RULE_IDS.has(bestRule?.ruleId));
  const handIsAlreadyClose = baseline.shape.bestDistance <= 2;
  const reachesReady = candidate.shape.bestDistance <= 1;
  const strongSpeedGain = analysis.bestDistanceGain >= 2 || analysis.winningDrawGain >= 2;
  const decentSpeedGain = analysis.bestDistanceGain >= 1 || analysis.winningDrawGain >= 1;
  const strongFocusGain = analysis.focusGain >= 4;
  const strongPointGain =
    analysis.totalWinningPointGain >= 8 ||
    analysis.bestWinningPointGain >= 6;
  const linePreserveGain = samePrimaryRule && (decentSpeedGain || strongFocusGain);
  const meaningfulGain =
    reachesReady ||
    strongSpeedGain ||
    (decentSpeedGain && (samePrimaryRule || strongFocusGain || strongPointGain || windPush || sixColorPush)) ||
    (windPush && candidate.shape.bestDistance <= 2 && (strongFocusGain || strongPointGain || analysis.scoreGain >= adjustedThreshold * 0.75));
  const safeEnoughToOpen = candidate.publicDanger <= 180 || reachesReady || strongSpeedGain;

  if (!meaningfulGain) return false;
  if (!safeEnoughToOpen) return false;
  if (sixColorPush && (reachesReady || decentSpeedGain || strongFocusGain || strongPointGain) && analysis.scoreGain >= adjustedThreshold * 0.45) return true;
  if (windPush && (reachesReady || decentSpeedGain || strongFocusGain || strongPointGain) && analysis.scoreGain >= adjustedThreshold * 0.55) return true;
  if (strongSpeedGain && (samePrimaryRule || strongFocusGain || strongPointGain || windPush) && analysis.scoreGain >= adjustedThreshold * 0.35) return true;
  if (handIsAlreadyClose && reachesReady && (decentSpeedGain || strongFocusGain) && analysis.scoreGain >= adjustedThreshold * 0.35) return true;
  if (linePreserveGain && candidate.score >= baseline.score + adjustedThreshold) return true;
  if (!decentSpeedGain && !strongFocusGain && !strongPointGain) return false;
  if (!samePrimaryRule && baseline.shape.bestDistance >= 3 && !strongSpeedGain) return false;
  return analysis.scoreGain >= adjustedThreshold;
}

function claimTargetLabel(candidate, analysis) {
  if (analysis.bestRuleImprovement?.label) return analysis.bestRuleImprovement.label;
  return getRuleById(candidate.focus.primaryRuleId)?.label || "";
}

function gearUpgradeValue(beforeFocus, beforeOpenCount, afterFocus, afterOpenCount) {
  const rule = getRuleById(afterFocus.primaryRuleId);
  if (!rule) return 0;
  return gearAdjustedPoints(rule.points, afterOpenCount) - gearAdjustedPoints(rule.points, beforeOpenCount);
}

function estimateOpenExposure(playerIndex, card) {
  const opponents = opponentsInRonOrder(playerIndex);
  if (!opponents.length) return 0;
  return opponents.reduce((sum, opponentIndex) => (
    sum + estimateOpponentCardInterest(opponentIndex, card)
  ), 0) / opponents.length;
}

function evaluateAIDiscardOptions(
  playerIndex,
  concealedHand = getPlayer(playerIndex).hand,
  openCards = getPlayer(playerIndex).openCards,
  extraKnownCards = [],
  includeLookahead = true,
  context = PUBLIC_AI_CONTEXT
) {
  const weights = AI_CONFIG.discardWeights;
  const strategy = evaluateStrategyProfile(playerIndex);
  const baselineFullHand = getFullHand(playerIndex, concealedHand, openCards);
  const baselineShape = evaluateHandShape(baselineFullHand, openCards.length, playerIndex);
  const baselineFocus = evaluateRuleFocus(baselineShape);

  return concealedHand.map((card) => {
    const nextHand = removeCardById(concealedHand, card.id).next;
    const publicPool = publicRemainingCardsFor(playerIndex, nextHand, openCards, extraKnownCards.concat(card));
    const dangerProfile = estimateDiscardDangerProfile(playerIndex, card, publicPool);
    const claimPressure = estimateClaimPressureProfile(playerIndex, card, publicPool);
    const future = evaluateFutureHand(playerIndex, nextHand, openCards, extraKnownCards.concat(card), context);
    const shape = future.shape;
    const focus = future.focus;
    const drawStats = future.drawStats;
    const continuityScore = evaluateDiscardContinuity(baselineShape, baselineFocus, shape, focus);
    const immediateResponse = context?.exactResponseDepth > 0
      ? evaluateImmediateRonResponseProfile(playerIndex, card)
      : null;
    const lookahead = includeLookahead && context?.lookaheadDepth > 0
      ? evaluateLookaheadContinuation(playerIndex, nextHand, openCards, extraKnownCards.concat(card), context)
      : null;
    const score =
      future.score +
      continuityScore -
      (dangerProfile.average * weights.publicDangerPenalty +
        dangerProfile.max * weights.maxOpponentDangerPenalty +
        claimPressure.average * weights.claimPressurePenalty +
        claimPressure.max * weights.maxClaimPressurePenalty) *
        (strategy.defense / strategy.risk) -
      (immediateResponse?.totalPenalty || 0) * weights.exactResponsePenalty +
      (lookahead?.averageScore || 0) * weights.lookaheadAverage +
      (lookahead?.peakScore || 0) * weights.lookaheadPeak;

    return {
      card,
      nextHand,
      drawStats,
      shape,
      focus,
      strategy,
      continuityScore,
      publicDanger: dangerProfile.average,
      dangerProfile,
      claimPressure,
      immediateResponse,
      lookahead,
      score,
    };
  }).sort((a, b) => {
    if (b.score !== a.score) return b.score - a.score;
    if (b.focus.primary !== a.focus.primary) return b.focus.primary - a.focus.primary;
    if (b.drawStats.nearReadyDraws !== a.drawStats.nearReadyDraws) {
      return b.drawStats.nearReadyDraws - a.drawStats.nearReadyDraws;
    }
    if (b.drawStats.totalWinningPoints !== a.drawStats.totalWinningPoints) return b.drawStats.totalWinningPoints - a.drawStats.totalWinningPoints;
    if (b.drawStats.winningDraws !== a.drawStats.winningDraws) return b.drawStats.winningDraws - a.drawStats.winningDraws;
    if (a.publicDanger !== b.publicDanger) return a.publicDanger - b.publicDanger;
    if (a.shape.bestDistance !== b.shape.bestDistance) return a.shape.bestDistance - b.shape.bestDistance;
    return b.card.id - a.card.id;
  });
}

function chooseAIDiscard(
  playerIndex,
  concealedHand = getPlayer(playerIndex).hand,
  openCards = getPlayer(playerIndex).openCards,
  extraKnownCards = [],
  includeLookahead = true
) {
  return chooseAIDiscardWithContext(
    playerIndex,
    concealedHand,
    openCards,
    extraKnownCards,
    includeLookahead,
    PUBLIC_AI_CONTEXT
  );
}

function chooseAIDiscardWithContext(

  includeLookahead = true,
  context = PUBLIC_AI_CONTEXT
) {

    playerIndex,

    openCards,
    extraKnownCards,

  )[0];
}

function chooseHardAIDiscard(
  playerIndex,

) {

function chooseAISelfKanWithContext(playerIndex, context = PUBLIC_AI_CONTEXT) {
  const player = getPlayer(playerIndex);
  const claimState = buildSelfKanState(playerIndex, player.hand, player.openCards);
  if (!claimState) return null;
  if (!lockedOpenCardsCanWin(claimState.nextOpenCards, playerIndex)) return null;

  const baseline = evaluateFutureHand(playerIndex, player.hand, player.openCards, [], context);
  const bestDiscard = chooseAIDiscardWithContext(
    playerIndex,
    claimState.remainingHand,
    claimState.nextOpenCards,
    [],
    true,
    context
  );
  if (!bestDiscard) return null;

  const claimAnalysis = analyzeClaimCandidate(baseline, bestDiscard);
  const strategy = evaluateStrategyProfile(playerIndex);

  if (!shouldTakeClaim("kan", claimAnalysis, AI_CONFIG.kanThreshold, strategy, claimState.claimGroup[0])) {
    return null;
  }

  return {
    ...claimState,
    ...bestDiscard,
    scoreGain: claimAnalysis.scoreGain,
    claimAnalysis,
    claimTargetLabel: claimTargetLabel(bestDiscard, claimAnalysis),
  };
}

function chooseHardAISelfKan(playerIndex) {

function chooseAIChiWithContext(playerIndex, card, context = PUBLIC_AI_CONTEXT) {
  const player = getPlayer(playerIndex);

  );
