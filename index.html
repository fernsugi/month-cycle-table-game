<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Month Cycle Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --felt: #18392f;
  --felt-2: #102820;
  --wood: #6d5032;
  --gold: #d9bb7a;
  --gold-soft: rgba(217, 187, 122, 0.24);
  --ink: #f5efde;
  --muted: rgba(245, 239, 222, 0.7);
  --muted-2: rgba(245, 239, 222, 0.5);
  --danger: #ef9175;
  --good: #87cf9c;
  --line: rgba(255, 246, 221, 0.1);
  --shadow: 0 22px 60px rgba(0, 0, 0, 0.38);
  --app-base-width: 1280;
  --app-base-height: 920;
  --app-scale: 1;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
}

body {
  font-family: "Alegreya", serif;
  color: var(--ink);
  background:
    radial-gradient(circle at top, rgba(217, 187, 122, 0.08), transparent 25%),
    radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.06), transparent 20%),
    linear-gradient(180deg, #07110f 0%, #0d1b18 45%, #0f1d1a 100%);
  overflow: hidden;
}

body.fluid-mode {
  overflow: auto;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    linear-gradient(90deg, transparent 0, rgba(255, 255, 255, 0.015) 50%, transparent 100%),
    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px);
  background-size: 100% 100%, 18px 18px;
  pointer-events: none;
  opacity: 0.4;
}

button {
  font: inherit;
}

.app {
  width: calc(var(--app-base-width) * 1px);
  height: calc(var(--app-base-height) * 1px);
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: 62px minmax(0, 1fr) 226px;
  gap: 10px;
  padding: 10px;
  overflow: hidden;
}

.board-shell {
  min-height: 0;
  display: block;
}

.viewport-shell {
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  display: grid;
  place-items: start center;
  padding: 0;
}

.viewport-shell .app {
  transform: scale(var(--app-scale));
  transform-origin: top center;
}

.viewport-shell.fluid {
  width: auto;
  height: auto;
  overflow: visible;
  display: block;
}

.viewport-shell.fluid .app {
  width: auto;
  height: auto;
  transform: none;
}

.panel {
  position: relative;
  background: rgba(14, 28, 23, 0.88);
  border: 1px solid var(--line);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px);
}

.panel::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(145deg, rgba(217, 187, 122, 0.08), transparent 24%),
    radial-gradient(circle at top right, rgba(255, 255, 255, 0.05), transparent 32%);
  pointer-events: none;
}

.header {
  padding: 5px 14px;
  display: grid;
  grid-template-columns: auto auto;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
}

.eyebrow {
  font-family: "Alegreya SC", serif;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-size: 0.58rem;
  color: var(--muted-2);
}

.header h1 {
  margin: 0;
  font-family: "Alegreya SC", serif;
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  line-height: 1;
}

.title-lockup {
  display: grid;
  gap: 2px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(74px, 1fr));
  gap: 6px;
}

.stat {
  padding: 7px 9px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.07);
  text-align: center;
}

.stat-label {
  display: block;
  font-size: 0.62rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted-2);
}

.stat-value {
  display: block;
  margin-top: 2px;
  font-family: "Alegreya SC", serif;
  font-size: 0.96rem;
}

.pill-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.pill {
  padding: 5px 9px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.07);
  font-size: 0.75rem;
  color: var(--ink);
}

.pill.good {
  border-color: rgba(135, 207, 156, 0.28);
  color: var(--good);
}

.pill.danger {
  border-color: rgba(239, 145, 117, 0.28);
  color: var(--danger);
}

.button-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.button-row.compact {
  gap: 6px;
}

.utility-row {
  display: flex;
  gap: 6px;
  margin-top: 0;
  flex-wrap: wrap;
}

.utility-button {
  appearance: none;
  min-width: 40px;
  height: 36px;
  border-radius: 12px;
  border: 1px solid rgba(217, 187, 122, 0.2);
  background: rgba(255, 255, 255, 0.03);
  color: var(--ink);
  cursor: pointer;
  font-family: "Alegreya SC", serif;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  transition: border-color 140ms ease, opacity 140ms ease, color 140ms ease;
}

.utility-button:hover {
  border-color: rgba(217, 187, 122, 0.42);
}

.utility-button[aria-pressed="true"] {
  border-color: rgba(135, 207, 156, 0.5);
  background: rgba(135, 207, 156, 0.12);
  color: #dff8e5;
}

.utility-button:disabled {
  opacity: 0.36;
  color: var(--muted-2);
  border-color: rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.02);
  cursor: default;
}

.utility-button:disabled:hover {
  border-color: rgba(255, 255, 255, 0.08);
}

.action {
  appearance: none;
  border: 1px solid rgba(217, 187, 122, 0.25);
  background: linear-gradient(135deg, rgba(217, 187, 122, 0.18), rgba(217, 187, 122, 0.04));
  color: var(--ink);
  border-radius: 12px;
  padding: 8px 12px;
  cursor: pointer;
  transition: transform 140ms ease, border-color 140ms ease;
  font-size: 0.8rem;
}

.action:hover {
  transform: translateY(-1px);
  border-color: rgba(217, 187, 122, 0.45);
}

.action.recommended {
  border-color: rgba(255, 226, 156, 0.98);
  background:
    linear-gradient(135deg, rgba(255, 225, 150, 0.34), rgba(217, 187, 122, 0.14)),
    linear-gradient(135deg, rgba(217, 187, 122, 0.18), rgba(217, 187, 122, 0.04));
  color: #fff6df;
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.18),
    0 0 0 1px rgba(255, 226, 156, 0.5),
    0 0 0 4px rgba(255, 226, 156, 0.12),
    0 0 28px rgba(255, 214, 120, 0.45),
    0 14px 30px rgba(0, 0, 0, 0.26);
  transform: translateY(-1px);
}

.action.recommended:hover {
  border-color: rgba(255, 234, 184, 1);
}

.action.secondary {
  background: rgba(255, 255, 255, 0.03);
}

.action:disabled {
  opacity: 0.4;
  cursor: default;
  transform: none;
}

#tsumoButton {
  border-color: rgba(135, 207, 156, 0.45);
  background: linear-gradient(135deg, rgba(135, 207, 156, 0.24), rgba(135, 207, 156, 0.06));
}

#tsumoButton:hover {
  border-color: rgba(135, 207, 156, 0.72);
}

#ronButton {
  border-color: rgba(239, 145, 117, 0.45);
  background: linear-gradient(135deg, rgba(239, 145, 117, 0.24), rgba(239, 145, 117, 0.06));
}

#ronButton:hover {
  border-color: rgba(239, 145, 117, 0.72);
}

#chiButton {
  border-color: rgba(126, 196, 160, 0.45);
  background: linear-gradient(135deg, rgba(126, 196, 160, 0.24), rgba(126, 196, 160, 0.06));
}

#chiButton:hover {
  border-color: rgba(126, 196, 160, 0.72);
}

#ponButton {
  border-color: rgba(104, 177, 221, 0.45);
  background: linear-gradient(135deg, rgba(104, 177, 221, 0.24), rgba(104, 177, 221, 0.06));
}

#ponButton:hover {
  border-color: rgba(104, 177, 221, 0.72);
}

#kanButton {
  border-color: rgba(224, 162, 101, 0.45);
  background: linear-gradient(135deg, rgba(224, 162, 101, 0.24), rgba(224, 162, 101, 0.06));
}

#kanButton:hover {
  border-color: rgba(224, 162, 101, 0.72);
}

#passButton {
  border-color: rgba(137, 178, 207, 0.3);
  background: rgba(137, 178, 207, 0.08);
}

#passButton:hover {
  border-color: rgba(137, 178, 207, 0.56);
}

#openWinButton {
  border-color: rgba(200, 170, 108, 0.34);
  background: rgba(200, 170, 108, 0.1);
}

#openLogButton {
  border-color: rgba(125, 189, 205, 0.34);
  background: rgba(125, 189, 205, 0.1);
}

#openDiscardsButton {
  border-color: rgba(180, 154, 214, 0.34);
  background: rgba(180, 154, 214, 0.1);
}

#openSetsButton {
  border-color: rgba(126, 196, 160, 0.34);
  background: rgba(126, 196, 160, 0.1);
}

#toggleAssistButton {
  border-color: rgba(135, 207, 156, 0.34);
  background: rgba(135, 207, 156, 0.1);
}

.table-wrap {
  position: relative;
  min-height: 0;
  height: 100%;
  padding: 0;
  display: grid;
  place-items: center;
  background: none;
  border: 0;
  box-shadow: none;
  backdrop-filter: none;
}

.table {
  position: relative;
  width: min(100%, 1048px);
  max-height: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 42px;
  background:
    radial-gradient(circle at 50% 35%, rgba(36, 73, 126, 0.28), transparent 32%),
    linear-gradient(180deg, #26406f 0%, #203763 22%, #1d3159 100%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow:
    inset 0 0 0 2px rgba(255, 255, 255, 0.04),
    inset 0 0 80px rgba(0, 0, 0, 0.18),
    0 24px 60px rgba(0, 0, 0, 0.28);
  overflow: hidden;
}

.table::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 16% 8%, rgba(255, 255, 255, 0.24), transparent 18%),
    linear-gradient(115deg, rgba(255, 255, 255, 0.08), transparent 24%);
  pointer-events: none;
  opacity: 0.7;
}

.table::before {
  content: "";
  position: absolute;
  inset: 74px 92px 92px;
  border-radius: 18px;
  border: 2px solid rgba(22, 40, 78, 0.55);
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.04),
    0 0 0 1px rgba(13, 23, 45, 0.5);
}

.compass {
  position: absolute;
  inset: 50%;
  width: 210px;
  height: 210px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1px solid rgba(217, 187, 122, 0.24);
  box-shadow: inset 0 0 0 1px rgba(217, 187, 122, 0.08);
}

.compass::before,
.compass::after {
  content: "";
  position: absolute;
  inset: 12%;
  border-radius: 50%;
  border: 1px dashed rgba(217, 187, 122, 0.14);
}

.compass::after {
  inset: 50%;
  width: 2px;
  height: 78px;
  border: 0;
  background: linear-gradient(180deg, transparent, rgba(217, 187, 122, 0.35), transparent);
  transform: translate(-50%, -50%);
}

.compass-label {
  position: absolute;
  font-family: "Alegreya SC", serif;
  font-size: 0.74rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(245, 239, 222, 0.44);
}

.compass-label.north { top: 12px; left: 50%; transform: translateX(-50%); }
.compass-label.south { bottom: 12px; left: 50%; transform: translateX(-50%); }
.compass-label.west { left: 12px; top: 50%; transform: translateY(-50%); }
.compass-label.east { right: 12px; top: 50%; transform: translateY(-50%); }

.center-panel {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 210px;
  transform: translate(-50%, -50%);
  border-radius: 18px;
  padding: 10px 12px;
  text-align: center;
  background: rgba(36, 41, 66, 0.86);
  border: 1px solid rgba(217, 187, 122, 0.22);
  box-shadow: 0 14px 26px rgba(0, 0, 0, 0.22);
}

.center-panel h2 {
  margin: 2px 0 6px;
  font-family: "Alegreya SC", serif;
  font-size: 1.2rem;
  letter-spacing: 0.08em;
}

.center-panel p {
  margin: 0;
  color: var(--muted);
  line-height: 1.35;
  font-size: 0.74rem;
}

.center-card {
  width: 118px;
  margin: 10px auto 10px;
}

.center-card.claimable {
  cursor: pointer;
}

.center-claim-target {
  appearance: none;
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
}

.center-claim-target .card-face {
  transition: transform 140ms ease, box-shadow 140ms ease;
}

.center-claim-target:hover .card-face,
.center-claim-target:focus-visible .card-face {
  transform: translateY(-2px) scale(1.03);
  box-shadow:
    0 0 0 1px rgba(217, 187, 122, 0.28),
    0 0 22px var(--card-glow-soft, transparent),
    0 18px 30px rgba(0, 0, 0, 0.4),
    0 0 40px var(--card-glow-deep, transparent);
  outline: none;
}



.center-card .card-face,
.mini-card .card-face,
.open-card .card-face,
.hand-card .card-face,
.discard-card .card-face,
.inspect-popup-card .card-face,
.discard-detail-card .card-face,
.winning-card .card-face {
  width: 100%;
  display: block;
  border-radius: 14px;
  box-shadow:
    0 0 0 1px var(--card-glow-ring, transparent),
    0 0 0 3px var(--card-glow-halo, transparent),
    0 0 24px var(--card-glow-soft, transparent),
    0 16px 28px rgba(0, 0, 0, 0.35),
    0 0 48px var(--card-glow-deep, transparent);
}

.card-face {
  --card-glow-ring: transparent;
  --card-glow-halo: transparent;
  --card-glow-soft: transparent;
  --card-glow-deep: transparent;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  width: 100%;
  aspect-ratio: 2 / 3;
  padding: 8px 7px;
  overflow: hidden;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 34%),
    linear-gradient(135deg, var(--card-accent, #405066), #0e131b 72%);
  color: var(--ink);
  transform: translateZ(0);
  backface-visibility: hidden;
  filter: saturate(1);
}

.card-face.card-back-face {
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 38%),
    repeating-linear-gradient(135deg, rgba(217, 187, 122, 0.12) 0 6px, transparent 6px 12px),
    linear-gradient(135deg, #1a2130, #0d1018 72%);
}

.tile-head {
  display: flex;
  justify-content: space-between;
  gap: 4px;
  align-items: flex-start;
  font-size: 0.55rem;
  line-height: 1.1;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #f3e4b8;
}

.tile-id {
  font-weight: 700;
}

.tile-element {
  color: rgba(245, 239, 222, 0.82);
  text-align: right;
}

.tile-month {
  align-self: stretch;
  font-family: "Alegreya SC", serif;
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink);
  text-align: left;
}

.tile-triangle {
  font-size: 0.5rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(245, 239, 222, 0.84);
  text-align: left;
}

.tile-back-mark {
  font-family: "Alegreya SC", serif;
  font-size: 0.78rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
}

.mini-card .card-face,
.open-card .card-face,
.winning-card .card-face,
.discard-detail-card .card-face {
  padding: 4px;
}

.mini-card .tile-head,
.open-card .tile-head,
.winning-card .tile-head,
.discard-detail-card .tile-head {
  font-size: 0.36rem;
  gap: 2px;
}

.mini-card .tile-month,
.open-card .tile-month,
.winning-card .tile-month,
.discard-detail-card .tile-month {
  font-size: 0.72rem;
  letter-spacing: 0.04em;
}

.mini-card .tile-triangle,
.open-card .tile-triangle,
.winning-card .tile-triangle,
.discard-detail-card .tile-triangle {
  font-size: 0.34rem;
  letter-spacing: 0.08em;
}

.open-card.open-card-month .tile-head,
.open-card.open-card-month .tile-triangle {
  display: none;
}

.mini-card.mini-card-month .tile-head,
.mini-card.mini-card-month .tile-triangle {
  display: none;
}

.mini-card.mini-card-month .card-face {
  display: grid;
  place-items: center;
  padding: 4px;
}

.mini-card.mini-card-month .tile-month {
  align-self: center;
  text-align: center;
  font-size: 0.96rem;
  letter-spacing: 0.06em;
}

.open-card.open-card-month .card-face {
  display: grid;
  place-items: center;
  padding: 4px;
}

.open-card.open-card-month .tile-month {
  align-self: center;
  text-align: center;
  font-size: 0.96rem;
  letter-spacing: 0.06em;
}

.mini-card .tile-back-mark,
.open-card .tile-back-mark,
.winning-card .tile-back-mark,
.discard-detail-card .tile-back-mark {
  font-size: 0.48rem;
  letter-spacing: 0.12em;
}

.center-card .card-face {
  padding: 8px 7px;
}

.center-card .tile-head {
  font-size: 0.55rem;
  gap: 4px;
}

.center-card .tile-month {
  font-size: 1.2rem;
  letter-spacing: 0.08em;
}

.center-card .tile-triangle {
  font-size: 0.5rem;
  letter-spacing: 0.12em;
}

.center-card .tile-back-mark {
  font-size: 0.78rem;
  letter-spacing: 0.2em;
}

.inspect-popup-card .tile-head {
  font-size: 0.62rem;
}

.inspect-popup-card .tile-month {
  font-size: 1.45rem;
}

.inspect-popup-card .tile-triangle {
  font-size: 0.56rem;
}

.seat {
  position: absolute;
  width: 188px;
  min-height: 72px;
  padding: 8px 9px;
  border-radius: 16px;
  background: rgba(12, 20, 35, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.06);
}

.seat.active {
  box-shadow: 0 0 0 1px rgba(217, 187, 122, 0.32), 0 0 26px rgba(217, 187, 122, 0.12);
}

.seat.east { right: 12px; top: 50%; transform: translateY(-50%); }
.seat.west { left: 12px; top: 50%; transform: translateY(-50%); }
.seat.north { top: 12px; left: 50%; transform: translateX(-50%); width: 232px; }
.seat.south { bottom: 12px; left: 50%; transform: translateX(-50%); width: 250px; }
.seat.south-call {
  width: 882px;
  min-height: 114px;
}

.seat.south-call .seat-head {
  margin-bottom: 6px;
}

.seat-panel-copy {
  color: var(--muted);
  font-size: 0.72rem;
  line-height: 1.2;
  margin-bottom: 8px;
}

.seat-actions {
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  gap: 6px;
}

.seat-actions .action,
.seat-actions .utility-button {
  min-height: 34px;
  padding: 7px 11px;
}

.seat-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: baseline;
}

.seat-name {
  font-family: "Alegreya SC", serif;
  font-size: 0.84rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.seat-role {
  color: var(--muted);
  font-size: 0.72rem;
}

.seat-status {
  display: none;
}

.mini-hand {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.mini-card {
  width: 24px;
}

.open-strip {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.open-card {
  width: 24px;
  flex: 0 0 24px;
}

.mini-card,
.open-card {
  display: block;
  padding: 0;
  border: 0;
  background: none;
  line-height: 0;
}

button.mini-card,
button.open-card {
  appearance: none;
  cursor: pointer;
}

.discard-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 8px;
}

.discard-card {
  width: 24px;
}

.human-panel {
  grid-column: 1 / -1;
  padding: 12px 16px 14px;
  position: relative;
  left: auto;
  right: auto;
  bottom: auto;
  z-index: auto;
  max-height: none;
  overflow: hidden;
  border-color: rgba(217, 187, 122, 0.18);
  background: rgba(8, 18, 16, 0.96);
  box-shadow:
    0 18px 42px rgba(0, 0, 0, 0.34),
    0 0 0 1px rgba(217, 187, 122, 0.08);
}

.human-head {
  display: none;
}

.hand {
  display: grid;

};

function getAudioContext() {
  if (!AudioContextClass) return null;
  if (soundState.context) return soundState.context;

  const context = new AudioContextClass();
  const master = context.createGain();
  master.gain.value = SOUND_CONFIG.masterVolume;
  master.connect(context.destination);

  soundState.context = context;
  soundState.master = master;
  return context;
}

function unlockAudio() {
  const context = getAudioContext();
  if (!context || context.state !== "suspended") return;
  context.resume().catch(() => {});
}

function scheduleTone(options) {
  const context = getAudioContext();
  if (!context || !soundState.master || context.state !== "running") return;

  const {
    at = context.currentTime,
    frequency = 440,
    duration = 0.12,
    type = "sine",
    volume = 0.04,
    attack = 0.004,
    release = 0.09,
    endFrequency = frequency,
    detune = 0,
  } = options;

  const oscillator = context.createOscillator();
  const gain = context.createGain();
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, at);
  oscillator.frequency.linearRampToValueAtTime(endFrequency, at + duration);
  oscillator.detune.setValueAtTime(detune, at);

  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.linearRampToValueAtTime(volume, at + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + duration + release);

  oscillator.connect(gain);
  gain.connect(soundState.master);
  oscillator.start(at);
  oscillator.stop(at + duration + release + 0.02);
}

function scheduleNoise(options) {
  const context = getAudioContext();
  if (!context || !soundState.master || context.state !== "running") return;

  const {
    at = context.currentTime,
    duration = 0.08,
    volume = 0.028,
    attack = 0.002,
    release = 0.05,
    filterFrequency = 1400,
    filterQ = 0.8,
  } = options;

  const frameCount = Math.max(1, Math.floor(context.sampleRate * duration));
  const buffer = context.createBuffer(1, frameCount, context.sampleRate);
  const data = buffer.getChannelData(0);
  for (let index = 0; index < frameCount; index += 1) {
    data[index] = (Math.random() * 2 - 1) * (1 - index / frameCount);
  }

  const source = context.createBufferSource();
  source.buffer = buffer;

  const filter = context.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.setValueAtTime(filterFrequency, at);
  filter.Q.setValueAtTime(filterQ, at);

  const gain = context.createGain();
  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.linearRampToValueAtTime(volume, at + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + duration + release);

  source.connect(filter);
  filter.connect(gain);
  gain.connect(soundState.master);
  source.start(at);
  source.stop(at + duration + release + 0.02);
}

function sortCardsByNumber(cards) {
  return cards.slice().sort((a, b) => a.id - b.id);
}

function displayCodeForId(id) {
  const zeroBased = Math.max(0, id - 1);
  const first = CODE_LETTERS[Math.floor(zeroBased / CODE_LETTERS.length)] || CODE_LETTERS[0];
  const second = CODE_LETTERS[zeroBased % CODE_LETTERS.length];
  return `${first}${second}`;
}

function sortCardsForDisplay(cards) {
  return cards.slice().sort((a, b) => {
    const animalDiff = ANIMAL_ORDER_INDEX[a.animal] - ANIMAL_ORDER_INDEX[b.animal];
    if (animalDiff !== 0) return animalDiff;
    return a.id - b.id;
  });
}

function shuffle(cards) {
  const copy = cards.slice();
  for (let index = copy.length - 1; index > 0; index -= 1) {
    const swapIndex = Math.floor(Math.random() * (index + 1));
    [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
  }
  return copy;
}

function combinations(cards, size, start = 0, prefix = [], out = []) {
  if (prefix.length === size) {
    out.push(prefix.slice());
    return out;
  }
  for (let index = start; index <= cards.length - (size - prefix.length); index += 1) {
    prefix.push(cards[index]);
    combinations(cards, size, index + 1, prefix, out);
    prefix.pop();
  }
  return out;
}

function previousAnimal(animal) {
  const index = ZODIAC_ORDER.indexOf(animal);
  return ZODIAC_ORDER[(index - 1 + ZODIAC_ORDER.length) % ZODIAC_ORDER.length];
}

function nextAnimal(animal) {
  const index = ZODIAC_ORDER.indexOf(animal);
  return ZODIAC_ORDER[(index + 1) % ZODIAC_ORDER.length];
}

function animalsFormRun(animals, runLength) {
  const uniqueAnimals = Array.from(new Set(animals));
  if (uniqueAnimals.length !== runLength) return false;
  return ZODIAC_ORDER.some((_, start) => (
    Array.from({ length: runLength }, (_, index) => ZODIAC_ORDER[(start + index) % ZODIAC_ORDER.length])
      .every((animal) => uniqueAnimals.includes(animal))
  ));
}

function bestAnimalRunProgress(cards, runLength, capPerAnimal) {
  let best = 0;
  for (let start = 0; start < ZODIAC_ORDER.length; start += 1) {
    const targetAnimals = Array.from(
      { length: runLength },
      (_, index) => ZODIAC_ORDER[(start + index) % ZODIAC_ORDER.length]
    );
    const progress = targetAnimals.reduce((sum, animal) => (
      sum + Math.min(capPerAnimal, cards.filter((card) => card.animal === animal).length)
    ), 0);
    best = Math.max(best, progress);
  }
  return best;
}

function allFiveColorsPresent(cards) {
  return new Set(cards.map((card) => card.element)).size === ELEMENTS.length;
}

function parityOfCard(card) {
  return card.id % 2 === 0 ? "even" : "odd";
}

function allSameParity(cards) {
  return new Set(cards.map((card) => parityOfCard(card))).size === 1;
}

function alternatingMonthTargets(start) {
  return Array.from(
    { length: GAME_CONFIG.winningHandSize },
    (_, index) => ZODIAC_ORDER[(start + index * 2) % ZODIAC_ORDER.length]
  );
}

function matchingAlternatingMonthSequence(months) {
  const uniqueMonths = Array.from(new Set(months));
  if (uniqueMonths.length !== GAME_CONFIG.winningHandSize) return null;
  for (let start = 0; start < ZODIAC_ORDER.length; start += 1) {
    const targets = alternatingMonthTargets(start);
    if (targets.every((month) => uniqueMonths.includes(month))) {
      return targets;
    }
  }
  return null;
}

function bestAlternatingMonthProgress(cards, capPerMonth = 1) {
  let best = 0;
  for (let start = 0; start < ZODIAC_ORDER.length; start += 1) {
    const targets = alternatingMonthTargets(start);
    const progress = targets.reduce((sum, month) => (
      sum + Math.min(capPerMonth, cards.filter((card) => card.animal === month).length)
    ), 0);
    best = Math.max(best, progress);
  }
  return best;
}

function seatForPlayer(playerIndex, dealerIndex) {
  return WIND_ORDER[(playerIndex - dealerIndex + WIND_ORDER.length) % WIND_ORDER.length];
}

function renderCardMarkup(card, { back = false } = {}) {
  if (back) {
    return `
      <div class="card-face card-back-face" aria-hidden="true">

      </div>

  const accent = ELEMENT_COLORS[card.element] || "#405066";

}

function nextDealerIndex() {
  if (state.phase !== "finished") return state.dealerIndex ?? INITIAL_DEALER_INDEX;
  if (state.winners?.includes(state.dealerIndex)) return state.dealerIndex;
  return ((state.dealerIndex ?? INITIAL_DEALER_INDEX) + 1) % TABLE_CONFIG.players.length;
}

function dealerIndexForNextHand() {
  if (!state.players.length) {
    return Math.floor(Math.random() * TABLE_CONFIG.players.length);
  }
  return nextDealerIndex();
}

        const sideCount = cards.filter((card) => sideAnimals.has(card.animal)).length;
        const progress = Math.min(5, sameCount) + Math.min(1, sideCount);
        best = Math.min(best, GAME_CONFIG.winningHandSize - progress);
      });

const analysisCache = {
  winningLayouts: new Map(),
  handShape: new Map(),
  publicPotential: new Map(),
};

function requiredOpenCardsForPoints(points) {
  if (points === 3) return 3;
  if (points === 6) return 2;
  if (points === 9) return 1;
  return null;
}

function gearRequirementText(points) {
  const required = requiredOpenCardsForPoints(points);
  if (required === null) return "No gear requirement";
  return `Requires at least ${required} open card${required === 1 ? "" : "s"}`;
}

function gearMatches(points, openCardCount) {
  const required = requiredOpenCardsForPoints(points);
  if (required === null) return true;
  return openCardCount >= required;
}

function gearGapForPoints(points, openCardCount) {
  const required = requiredOpenCardsForPoints(points);
  if (required === null) return 0;
  return Math.max(0, required - openCardCount);
}

function filterLayoutsByGear(layouts, openCardCount) {
  return layouts.filter((layout) => gearMatches(scoreLayout(layout), openCardCount));
}

function cardsAnalysisKey(cards) {
  return cards
    .map((card) => card.id)
    .slice()
    .sort((a, b) => a - b)
    .join("-");
}

function findWinningLayouts(cards) {
  const cacheKey = cardsAnalysisKey(cards);
  const cached = analysisCache.winningLayouts.get(cacheKey);
  if (cached) return cached;

  const sortedCards = sortCardsByNumber(cards);
  const layouts = [];
  const seen = new Set();

  function walk(remaining, groups) {
    if (remaining.length === 0) {
      const signature = groups
        .map((group) => `${group.ruleId}:${group.cards.map((card) => card.id).join("-")}`)
        .sort()
        .join("|");
      if (!seen.has(signature)) {
        seen.add(signature);
        layouts.push(groups);
      }
      return;
    }

    for (const rule of SET_RULES) {
      if (rule.size > remaining.length) continue;
      const options = combinations(remaining, rule.size);
      for (const option of options) {
        if (!rule.matches(option)) continue;
        const idSet = new Set(option.map((card) => card.id));
        const nextRemaining = remaining.filter((card) => !idSet.has(card.id));
        walk(nextRemaining, groups.concat({
          ruleId: rule.id,
          label: rule.label,
          detail: rule.describe(option),
          cards: sortCardsForDisplay(option),
        }));
      }
    }
  }

  walk(sortedCards, []);
  analysisCache.winningLayouts.set(cacheKey, layouts);
  return layouts;
}

function findValidWinningLayouts(cards, openCardCount) {
  return filterLayoutsByGear(findWinningLayouts(cards), openCardCount);
}

function removeCardById(cards, cardId) {
  const index = cards.findIndex((card) => card.id === cardId);
  if (index === -1) return { removed: null, next: cards.slice() };
  const next = cards.slice();
  const [removed] = next.splice(index, 1);
  return { removed, next };
}

function removeLastCardById(cards, cardId) {
  const index = cards.map((card) => card.id).lastIndexOf(cardId);
  if (index === -1) return { removed: null, next: cards.slice() };
  const next = cards.slice();
  const [removed] = next.splice(index, 1);
  return { removed, next };
}

const state = {
  players: [],
  points: Array(TABLE_CONFIG.players.length).fill(GAME_CONFIG.startingPoints),
  roundNumber: 1,
  wall: [],
  currentTurn: 0,
  dealerIndex: INITIAL_DEALER_INDEX,
  phase: "idle",
  call: "None",
  pendingClaim: null,
  lastDiscard: null,
  lastDrawnCardId: null,
  openCardClaims: {},
  selectedCardId: null,
  inspectCardId: null,
  logs: [],
  winner: null,
  winners: [],
  matchFinished: false,
  matchSummary: null,
  timer: null,
  assistEnabled: false,
};

function getRoundMonthTarget() {
  if (state.roundNumber < 1 || state.roundNumber > GAME_CONFIG.matchRounds) return null;
  return String(state.roundNumber);
}

function getRoundLabel() {
  if (state.roundNumber <= GAME_CONFIG.matchRounds) return String(state.roundNumber);
  return `SD ${state.roundNumber - GAME_CONFIG.matchRounds}`;
}

function getLayoutCards(layout) {
  const seen = new Set();
  return (layout || []).flatMap((group) => group.cards).filter((card) => {
    if (seen.has(card.id)) return false;
    seen.add(card.id);
    return true;
  });
}

function roundBonusForLayout(layout) {
  const roundMonth = getRoundMonthTarget();
  if (!roundMonth) return 0;
  return getLayoutCards(layout).some((card) => card.animal === roundMonth)
    ? GAME_CONFIG.roundBonusPoints
    : 0;
}

function roundBonusForCard(card) {
  const roundMonth = getRoundMonthTarget();
  if (!roundMonth || !card) return 0;
  return card.animal === roundMonth ? GAME_CONFIG.roundBonusPoints : 0;
}

function totalLayoutPoints(layout) {
  return scoreLayout(layout) + roundBonusForLayout(layout);
}

function getLayoutPointBreakdown(layout) {
  const basePoints = scoreLayout(layout || []);
  const bonusPoints = roundBonusForLayout(layout || []);
  return {
    basePoints,
    bonusPoints,
    points: basePoints + bonusPoints,
  };
}

function getMatchLeaders() {
  const best = Math.max(...state.points);
  return state.points
    .map((points, index) => ({ points, index }))
    .filter((entry) => entry.points === best)
    .map((entry) => entry.index);
}

function updateMatchSummary() {
  const leaders = getMatchLeaders();
  const busted = state.points.some((value) => value <= 0);
  const atOrPastLimit = state.roundNumber >= GAME_CONFIG.matchRounds;

  if (busted || (atOrPastLimit && leaders.length === 1)) {
    state.matchFinished = true;
    state.matchSummary = {
      leaders,
      reason: busted ? "bust" : state.roundNumber > GAME_CONFIG.matchRounds ? "sudden-death" : "round-limit",
    };
    return true;
  }

  state.matchFinished = false;
  state.matchSummary = atOrPastLimit ? { leaders, reason: "tie" } : null;
  return false;
}

function formatRoundBonusText(bonusPoints) {
  return bonusPoints ? ` + ${bonusPoints} round bonus` : "";
}

function formatPointSummary(points, bonusPoints) {
  if (!bonusPoints) return `${points} points`;
  return `${points} points (${points - bonusPoints} + ${bonusPoints} round bonus)`;
}

function formatPlayerTag(playerIndex) {
  const player = getPlayer(playerIndex);
  return player ? `${player.seat} (${player.name})` : `P${playerIndex + 1}`;
}

function formatCardShort(card) {
  return card ? `${card.chinese} ${card.element}` : "unknown card";
}

function formatCardSource(card, playerIndex) {
  if (playerIndex === null || playerIndex === undefined) return formatCardShort(card);
  return `${formatPlayerTag(playerIndex)}'s ${formatCardShort(card)}`;
}

function formatMatchSummaryText() {
  if (!state.matchSummary) return "";
  const leaderNames = state.matchSummary.leaders.map((index) => formatPlayerTag(index));
  if (state.matchFinished) {
    if (leaderNames.length === 1) {
      return `${leaderNames[0]} wins the match in round ${getRoundLabel()}.`;
    }
    return `Match ends tied between ${leaderNames.join(" and ")} in round ${getRoundLabel()}.`;
  }
  return `Round ${GAME_CONFIG.matchRounds} ends tied between ${leaderNames.join(" and ")}. Sudden death continues.`;
}

function makePlayers() {
  return TABLE_CONFIG.players.map((player, index) => ({
    ...player,
    seat: seatForPlayer(index, state.dealerIndex),
    points: state.points[index],
    hand: [],
    openCards: [],
    discards: [],
    status: player.isHuman ? "Awaiting opening draw." : "Brutal AI ready.",
  }));
}

function logEvent(text) {
  state.logs.unshift({ text, id: `${Date.now()}-${Math.random()}` });
  state.logs = state.logs.slice(0, GAME_CONFIG.logLimit);
}

function getPlayer(index) {
  return state.players[index];
}

function getHumanPlayer() {
  return getPlayer(HUMAN_PLAYER_INDEX);
}

function getOpenClaimType(card) {
  return state.openCardClaims[card.id] || "open";
}

function setOpenClaimType(cards, type) {
  cards.forEach((card) => {
    state.openCardClaims[card.id] = type;
  });
}

function isHumanIndex(playerIndex) {
  return playerIndex === HUMAN_PLAYER_INDEX;
}

function formatSeatHandSize(count) {
  return String(count);
}

function formatPoints(value) {
  return `${value} pt`;
}

function formatOrdinal(value) {
  const mod100 = value % 100;
  if (mod100 >= 11 && mod100 <= 13) return `${value}th`;
  const mod10 = value % 10;
  if (mod10 === 1) return `${value}st`;
  if (mod10 === 2) return `${value}nd`;
  if (mod10 === 3) return `${value}rd`;
  return `${value}th`;
}

function analyzeWinningDraws(hand, wall, openCardCount = 0) {
  return wall.reduce((summary, card) => {
    const layouts = findValidWinningLayouts(hand.concat(card), openCardCount);
    if (!layouts.length) return summary;
    const points = totalLayoutPoints(chooseBestLayout(layouts) || []);
    return {
      winningDraws: summary.winningDraws + 1,
      totalWinningPoints: summary.totalWinningPoints + points,
      bestWinningPoints: Math.max(summary.bestWinningPoints, points),
    };
  }, {
    winningDraws: 0,
    totalWinningPoints: 0,
    bestWinningPoints: 0,
  });
}

function getFullHand(playerIndex, concealedHand = getPlayer(playerIndex).hand, openCards = getPlayer(playerIndex).openCards) {
  return sortCardsForDisplay(concealedHand.concat(openCards));
}

function getPublicKnownCardIds(playerIndex, ownHand = getPlayer(playerIndex).hand, extraKnownCards = []) {
  const known = new Set();
  ownHand.forEach((card) => known.add(card.id));
  getPlayer(playerIndex).openCards.forEach((card) => known.add(card.id));
  state.players.forEach((player) => {
    player.discards.forEach((card) => known.add(card.id));
    player.openCards.forEach((card) => known.add(card.id));
  });
  extraKnownCards.forEach((card) => {
    if (card) known.add(card.id);
  });
  return known;
}

function publicRemainingCardsFor(playerIndex, ownHand = getPlayer(playerIndex).hand, ownOpenCards = getPlayer(playerIndex).openCards, extraKnownCards = []) {
  const knownIds = getPublicKnownCardIds(playerIndex, ownHand.concat(ownOpenCards), extraKnownCards);
  return allCards.filter((card) => !knownIds.has(card.id));
}

function publicPotentialCacheKey(playerIndex, concealedHand, openCards, extraKnownCards = []) {
  const visibleHandKey = cardsAnalysisKey(concealedHand.concat(openCards));
  const extraKey = extraKnownCards
    .filter(Boolean)
    .map((card) => card.id)
    .sort((a, b) => a - b)
    .join("-");
  return `${playerIndex}|${visibleHandKey}|${openCards.length}|${extraKey}`;
}

function analyzePublicPotential(
  playerIndex,
  concealedHand = getPlayer(playerIndex).hand,
  openCards = getPlayer(playerIndex).openCards,
  extraKnownCards = [],
  currentShape = null,
  currentFocus = null
) {
  const cacheKey = publicPotentialCacheKey(playerIndex, concealedHand, openCards, extraKnownCards);
  const cached = analysisCache.publicPotential.get(cacheKey);
  if (cached) return cached;

  const fullHand = getFullHand(playerIndex, concealedHand, openCards);
  const shape = currentShape || evaluateHandShape(fullHand, openCards.length);
  const focus = currentFocus || evaluateRuleFocus(shape);
  const drawPool = publicRemainingCardsFor(playerIndex, concealedHand, openCards, extraKnownCards);

  const result = {
    winningDraws: 0,
    totalWinningPoints: 0,
    bestWinningPoints: 0,
    nearReadyDraws: 0,
    distanceGainDraws: 0,
    focusImproveDraws: 0,
    poolSize: drawPool.length,
  };

  const shouldCheckWins = shape.bestDistance <= 2;

  drawPool.forEach((drawCard) => {
    const futureFullHand = getFullHand(playerIndex, concealedHand.concat(drawCard), openCards);
    const futureShape = evaluateHandShape(futureFullHand, openCards.length);
    const futureFocus = evaluateRuleFocus(futureShape);

    if (futureShape.bestDistance < shape.bestDistance) {
      result.distanceGainDraws += 1;
    }

    if (futureShape.bestDistance <= 1) {
      result.nearReadyDraws += 1;
    }

    if (futureFocus.primary > focus.primary) {
      result.focusImproveDraws += 1;
    }

    if (!shouldCheckWins || futureShape.bestDistance !== 0) return;

    const winningLayouts = findValidWinningLayouts(futureFullHand, openCards.length);
    if (!winningLayouts.length) return;
    const points = totalLayoutPoints(chooseBestLayout(winningLayouts) || []);
    result.winningDraws += 1;
    result.totalWinningPoints += points;
    result.bestWinningPoints = Math.max(result.bestWinningPoints, points);
  });

  analysisCache.publicPotential.set(cacheKey, result);
  return result;
}

function actualWallDrawPool(extraKnownCards = []) {
  const excludedIds = new Set(extraKnownCards.filter(Boolean).map((card) => card.id));
  return state.wall.filter((card) => !excludedIds.has(card.id));
}

function getDrawPoolForDecision(
  playerIndex,
  concealedHand = getPlayer(playerIndex).hand,
  openCards = getPlayer(playerIndex).openCards,
  extraKnownCards = [],
  context = PUBLIC_AI_CONTEXT
) {
  if (context?.useHiddenIntel) {
    return actualWallDrawPool(extraKnownCards);
  }
  return publicRemainingCardsFor(playerIndex, concealedHand, openCards, extraKnownCards);
}

function descendDecisionContext(context = PUBLIC_AI_CONTEXT, overrides = {}) {
  return {
    ...context,
    lookaheadDepth: Math.max(0, (context?.lookaheadDepth ?? 0) - 1),
    exactResponseDepth: Math.max(0, (context?.exactResponseDepth ?? 0) - 1),
    ...overrides,
  };
}

function decisionContextForPlayer(playerIndex, context = BRUTAL_AI_CONTEXT) {
  return isHumanIndex(playerIndex) ? PUBLIC_AI_CONTEXT : context;
}

function getRuleById(ruleId) {
  return SET_RULES.find((rule) => rule.id === ruleId) || null;
}

function ruleFamilyId(ruleId) {
  if (ruleId.startsWith("same-element")) return "same-element";
  if (ruleId === "polarity-five-elements") return "polarity-five-elements";
  if (ruleId.startsWith("zodiac-run")) return "zodiac-run";
  if (
    ruleId === "four-with-neighbors" ||
    ruleId === "four-plus-two-side" ||
    ruleId === "four-plus-split-sides"
  ) {
    return "neighbor-animals";
  }
  if (ruleId.startsWith("three-animal-pairs")) return "three-animal-pairs";
  if (ruleId.startsWith("two-animal-threes")) return "two-animal-threes";
  if (ruleId === "six-run") return "six-run";
  if (ruleId === "ending-digit-ladder") return "ending-digit-ladder";
  return ruleId;
}

function scoreLayout(layout) {
  return layout.reduce((sum, group) => sum + (getRuleById(group.ruleId)?.points || 0), 0);
}

function layoutPriority(layout) {
  return layout.reduce((sum, group) => sum + (getRuleById(group.ruleId)?.priority || 0), 0);
}

function chooseBestLayout(layouts) {
  return layouts.slice().sort((a, b) => {
    const pointDiff = totalLayoutPoints(b) - totalLayoutPoints(a);
    if (pointDiff !== 0) return pointDiff;
    const priorityDiff = layoutPriority(b) - layoutPriority(a);
    if (priorityDiff !== 0) return priorityDiff;
    return b.length - a.length;
  })[0] || null;
}

function syncPlayerPoints() {
  state.players.forEach((player, index) => {
    player.points = state.points[index];
  });
}

function settleWin(playerIndex, type, points, discarderIndex = null) {
  const changes = Array(state.players.length).fill(0);

  if (type === "tsumo") {
    const share = points / 3;
    state.players.forEach((_, index) => {
      if (index === playerIndex) return;
      changes[index] -= share;
      changes[playerIndex] += share;
    });
  } else if (discarderIndex !== null) {
    changes[playerIndex] += points;
    changes[discarderIndex] -= points;
  }

  state.points = state.points.map((value, index) => value + changes[index]);
  syncPlayerPoints();
  return changes;
}

function settleRonThreats(threats, discarderIndex) {
  const changes = Array(state.players.length).fill(0);
  const results = threats.map((threat) => {
    const scoringLayout = threat.scoringLayout || chooseBestLayout(threat.layouts);
    const basePoints = threat.basePoints ?? scoreLayout(scoringLayout || []);
    const bonusPoints = threat.bonusPoints ?? roundBonusForLayout(scoringLayout || []);
    const points = basePoints + bonusPoints;
    changes[threat.playerIndex] += points;
    changes[discarderIndex] -= points;
    return {
      playerIndex: threat.playerIndex,
      layouts: threat.layouts,
      scoringLayout,
      basePoints,
      bonusPoints,
      points,
    };
  });

  state.points = state.points.map((value, index) => value + changes[index]);
  syncPlayerPoints();
  return { results, settlement: changes };
}

function formatSettlement(changes) {
  return changes
    .map((delta, index) => ({ delta, index }))
    .filter((entry) => entry.delta !== 0)
    .map((entry) => `${formatPlayerTag(entry.index)} ${entry.delta > 0 ? "+" : ""}${entry.delta}`)
    .join(" · ");
}

function evaluateHandShape(hand, openCardCount = 0) {
  const cacheKey = `${cardsAnalysisKey(hand)}|${openCardCount}`;
  const cached = analysisCache.handShape.get(cacheKey);
  if (cached) return cached;

  const distances = SET_RULES.map((rule) => {
    const rawDistance = rule.distance(hand);
    const gearGap = gearGapForPoints(rule.points, openCardCount);
    return {
      ruleId: rule.id,
      label: rule.label,
      points: rule.points,
      rawDistance,
      gearGap,
      distance: rawDistance + gearGap,
    };
  }).sort((a, b) => {
    if (a.distance !== b.distance) return a.distance - b.distance;
    if (a.rawDistance !== b.rawDistance) return a.rawDistance - b.rawDistance;
    return b.points - a.points;
  });

  const familyBest = new Map();
  distances.forEach((item) => {
    const progress = Math.max(0, GAME_CONFIG.winningHandSize - item.distance);
    const candidate = {
      support: progress * item.points,
      near: item.distance <= 2 ? item.points : 0,
    };
    const familyId = ruleFamilyId(item.ruleId);
    const existing = familyBest.get(familyId);
    if (
      !existing ||
      candidate.support > existing.support ||
      (candidate.support === existing.support && candidate.near > existing.near)
    ) {
      familyBest.set(familyId, candidate);
    }
  });

  const result = {
    bestDistance: distances[0]?.distance ?? GAME_CONFIG.winningHandSize,
    support: Array.from(familyBest.values()).reduce((sum, item) => sum + item.support, 0),
    nearRules: Array.from(familyBest.values()).reduce((sum, item) => sum + item.near, 0),
    distances,
  };

  analysisCache.handShape.set(cacheKey, result);
  return result;
}

function evaluateRuleFocus(shape) {
  const ranked = shape.distances
    .map((item) => {
      const progress = Math.max(0, GAME_CONFIG.winningHandSize - item.distance);
      return {
        ...item,
        progress,
        focusScore: progress === 0 ? 0 : (item.points * progress) / Math.max(1, item.distance),
      };
    })
    .sort((a, b) => {
      if (b.focusScore !== a.focusScore) return b.focusScore - a.focusScore;
      if (b.points !== a.points) return b.points - a.points;
      return a.distance - b.distance;
    });

  const primary = ranked[0]?.focusScore || 0;
  const secondary = ranked[1]?.focusScore || 0;
  return {
    primary,
    secondary,
    primaryRuleId: ranked[0]?.ruleId || null,
    primaryDistance: ranked[0]?.distance ?? GAME_CONFIG.winningHandSize,
    primaryPoints: ranked[0]?.points || 0,
    gap: primary - secondary,
    ranked: ranked.slice(0, 3).map((item) => ({
      ruleId: item.ruleId,
      label: item.label,
      points: item.points,
      distance: item.distance,
      focusScore: item.focusScore,
      progress: item.progress,
    })),
  };
}

function evaluateDiscardContinuity(beforeShape, beforeFocus, afterShape, afterFocus) {
  const weights = AI_CONFIG.continuity;
  const afterByRule = new Map(afterShape.distances.map((item) => [item.ruleId, item]));
  let score = 0;

  (beforeFocus.ranked || []).forEach((entry, index) => {
    const after = afterByRule.get(entry.ruleId);
    if (!after) return;

    const distanceShift = after.distance - entry.distance;
    const penaltyWeight = index === 0
      ? weights.primaryDistancePenalty
      : index === 1
        ? weights.secondaryDistancePenalty
        : weights.tertiaryDistancePenalty;
    const bonusWeight = index === 0
      ? weights.primaryDistanceBonus
      : index === 1
        ? weights.secondaryDistanceBonus
        : weights.tertiaryDistanceBonus;

    if (distanceShift > 0) {
      score -= distanceShift * entry.points * penaltyWeight;
      if (entry.distance === 0) {
        score -= weights.readyBreakPenalty * Math.max(1, entry.points / 3);
      } else if (entry.distance === 1) {
        score -= weights.oneAwayBreakPenalty * Math.max(1, entry.points / 4);
      }
    } else if (distanceShift < 0) {
      score += (-distanceShift) * entry.points * bonusWeight;
    }
  });

  const committedLine = beforeFocus.primaryRuleId && beforeFocus.primaryDistance <= 2 && beforeFocus.gap >= 6;
  const commitmentScale = Math.max(1, beforeFocus.primaryPoints / 6);
  if (committedLine) {
    if (beforeFocus.primaryRuleId === afterFocus.primaryRuleId) {
      score += weights.committedPreserveBonus * commitmentScale;
    } else {
      score -= weights.committedSwitchPenalty * commitmentScale;
    }
  }

  if (beforeShape.bestDistance <= 1 && afterShape.bestDistance > beforeShape.bestDistance) {
    score -= weights.readyBreakPenalty * Math.max(1, beforeFocus.primaryPoints / 4);
  }

  return score;
}

function evaluateStrategyProfile(playerIndex) {
  const player = getPlayer(playerIndex);
  const others = state.players
    .filter((_, index) => index !== playerIndex)
    .map((entry) => entry);
  const leaderOtherPoints = others.length ? Math.max(...others.map((entry) => entry.points)) : player.points;
  const gapBehind = Math.max(0, leaderOtherPoints - player.points);
  const leadOverTable = Math.max(0, player.points - leaderOtherPoints);
  const strategy = AI_CONFIG.strategy;
  const hottestOpponent = others.reduce((best, opponent) => (
    Math.max(best, opponent.openCards.length + (opponent.points >= player.points ? 0.5 : 0))
  ), 0);

  let offense = 1
    + Math.min(strategy.maxTrailingAggression, gapBehind * strategy.trailingAggressionPerPoint)
    + player.openCards.length * strategy.openCardAggression
    + hottestOpponent * strategy.exposedOpponentPressure;
  if (player.seat === "East") {
    offense += strategy.dealerAggression;
  }

  const defense = 0.68 + Math.min(strategy.maxLeadingDefense, leadOverTable * strategy.leadingDefensePerPoint);
  let claimBias = 1
    + Math.min(strategy.maxClaimBias, gapBehind * strategy.claimBiasPerPoint)
    + player.openCards.length * strategy.openCardAggression
    + hottestOpponent * strategy.exposedOpponentPressure;
  let risk = 1.06
    + Math.min(strategy.maxTrailingAggression * 0.6, gapBehind * strategy.trailingAggressionPerPoint)
    + player.openCards.length * 0.03;
  risk -= Math.min(strategy.maxLeadRiskBrake, leadOverTable * strategy.leadRiskBrakePerPoint);

  return {
    offense: Math.max(1, offense),
    defense: Math.min(0.96, Math.max(0.56, defense)),
    claimBias: Math.max(1, claimBias),
    risk: Math.max(0.92, risk),
  };
}

function opponentsInRonOrder(discarderIndex) {
  const order = [];
  for (let step = 1; step < state.players.length; step += 1) {
    order.push((discarderIndex + step) % state.players.length);
  }
  return order;
}

function exactRonThreats(discarderIndex, card) {
  return opponentsInRonOrder(discarderIndex)
    .map((playerIndex) => {
      const layouts = findValidWinningLayouts(
        getFullHand(playerIndex).concat(card),
        getPlayer(playerIndex).openCards.length
      );
      if (!layouts.length) return null;
      const bestLayout = chooseBestLayout(layouts);
      const { basePoints, bonusPoints, points } = getLayoutPointBreakdown(bestLayout || []);
      return {
        playerIndex,
        layouts,
        scoringLayout: bestLayout,
        basePoints,
        bonusPoints,
        points,
      };
    })
    .filter(Boolean);
}

function buildAnimalClaimState(
  playerIndex,
  card,
  type,
  concealedHand = getPlayer(playerIndex).hand,
  openCards = getPlayer(playerIndex).openCards
) {
  const neededCount = type === "kan" ? 4 : 3;
  const matchingConcealed = concealedHand.filter((item) => item.animal === card.animal);
  const matchingOpen = openCards.filter((item) => item.animal === card.animal);
  const totalMatching = matchingConcealed.length + matchingOpen.length;
  if (totalMatching !== neededCount) return null;

  const remainingHand = sortCardsForDisplay(concealedHand.filter((item) => item.animal !== card.animal));
  if (!remainingHand.length) return null;

  const otherOpenCards = openCards.filter((item) => item.animal !== card.animal);
  const claimGroup = sortCardsForDisplay(matchingOpen.concat(matchingConcealed, card));
  return {
    playerIndex,
    type,
    animal: card.animal,
    card,
    matchingConcealed,
    matchingOpen,
    remainingHand,
    claimGroup,
    nextOpenCards: otherOpenCards.concat(claimGroup),
  };
}

function buildSelfKanState(
  playerIndex,
  concealedHand = getPlayer(playerIndex).hand,
  openCards = getPlayer(playerIndex).openCards
) {
  const countsByAnimal = concealedHand.reduce((counts, card) => {
    counts[card.animal] = (counts[card.animal] || 0) + 1;
    return counts;
  }, {});
  const targetAnimal = Object.keys(countsByAnimal).find((animal) => countsByAnimal[animal] === 5);
  if (!targetAnimal) return null;

  const claimGroup = sortCardsForDisplay(concealedHand.filter((card) => card.animal === targetAnimal));
  const remainingHand = sortCardsForDisplay(concealedHand.filter((card) => card.animal !== targetAnimal));
  if (!remainingHand.length) return null;

  return {
    playerIndex,
    type: "self-kan",
    animal: targetAnimal,
    claimGroup,
    remainingHand,
    nextOpenCards: openCards.concat(claimGroup),
  };
}

function exactKanThreats(discarderIndex, card) {
  return opponentsInRonOrder(discarderIndex)
    .map((playerIndex) => buildAnimalClaimState(playerIndex, card, "kan"))
    .filter(Boolean);
}

function exactPonThreats(discarderIndex, card) {
  return opponentsInRonOrder(discarderIndex)
    .map((playerIndex) => buildAnimalClaimState(playerIndex, card, "pon"))
    .filter(Boolean);
}

function evaluateClaimThreatPenalty(type, choice) {
  const tactical = AI_CONFIG.tactical;
  const basePenalty = type === "kan"
    ? tactical.exactKanPenalty
    : type === "pon"
      ? tactical.exactPonPenalty
      : tactical.exactChiPenalty;

  return (
    basePenalty +
    Math.max(0, choice.scoreGain || 0) * tactical.claimScoreGainPenalty +
    (choice.drawStats?.winningDraws || 0) * tactical.claimWaitPenalty +
    (choice.drawStats?.bestWinningPoints || 0) * tactical.claimPointPenalty +
    (choice.focus?.primary || 0) * tactical.claimFocusPenalty
  );
}

function evaluateImmediateResponseProfile(discarderIndex, card, context = BRUTAL_AI_CONTEXT) {
  const tactical = AI_CONFIG.tactical;
  const ronThreats = exactRonThreats(discarderIndex, card);
  if (ronThreats.length) {
    const totalPoints = ronThreats.reduce((sum, threat) => sum + threat.points, 0);
    return {
      type: "ron",
      claimerIndex: ronThreats[0]?.playerIndex ?? null,
      ronThreats,
      claimChoice: null,
      totalPenalty: tactical.exactRonPenaltyBase * ronThreats.length + totalPoints * tactical.exactRonPointPenalty,
    };
  }

  const responseContext = descendDecisionContext(context, {
    lookaheadDepth: 0,
    exactResponseDepth: 0,
  });

  for (const threat of exactKanThreats(discarderIndex, card)) {
    const claimChoice = chooseAIKanWithContext(
      threat.playerIndex,
      card,
      decisionContextForPlayer(threat.playerIndex, responseContext)
    );
    if (claimChoice) {
      return {
        type: "kan",
        claimerIndex: threat.playerIndex,
        ronThreats: [],
        claimChoice,
        totalPenalty: evaluateClaimThreatPenalty("kan", claimChoice),
      };
    }
  }

  for (const threat of exactPonThreats(discarderIndex, card)) {
    const claimChoice = chooseAIPonWithContext(
      threat.playerIndex,
      card,
      decisionContextForPlayer(threat.playerIndex, responseContext)
    );
    if (claimChoice) {
      return {
        type: "pon",
        claimerIndex: threat.playerIndex,
        ronThreats: [],
        claimChoice,
        totalPenalty: evaluateClaimThreatPenalty("pon", claimChoice),
      };
    }
  }

  const chiPlayerIndex = chiPlayerIndexFor(discarderIndex);
  if (canPlayerChi(chiPlayerIndex)) {
    const claimChoice = chooseAIChiWithContext(
      chiPlayerIndex,
      card,
      decisionContextForPlayer(chiPlayerIndex, responseContext)
    );
    if (claimChoice) {
      return {
        type: "chi",
        claimerIndex: chiPlayerIndex,
        ronThreats: [],
        claimChoice,
        totalPenalty: evaluateClaimThreatPenalty("chi", claimChoice),
      };
    }
  }

  return {
    type: null,
    claimerIndex: null,
    ronThreats: [],
    claimChoice: null,
    totalPenalty: 0,
  };
}

function threatPointsForRule(ruleId, openCardCount, card) {
  const rule = getRuleById(ruleId);
  if (!rule) return 0;
  if (!gearMatches(rule.points, openCardCount)) return 0;
  return rule.points + roundBonusForCard(card);
}

function estimatePublicDiscardDanger(card, publicPool, openCardCount = 0) {
  const poolIds = new Set(publicPool.map((item) => item.id));
  const sameAnimalCount = publicPool.filter((item) => item.animal === card.animal).length;
  const sameElementCount = publicPool.filter((item) => item.element === card.element).length;
  const sideAnimalSet = new Set([previousAnimal(card.animal), nextAnimal(card.animal)]);
  const sideAnimalCount = publicPool.filter((item) => sideAnimalSet.has(item.animal)).length;

  let danger = 0;

  for (let start = Math.max(1, card.id - 5); start <= Math.min(card.id, allCards.length - 5); start += 1) {
    let complete = true;
    for (let id = start; id < start + GAME_CONFIG.winningHandSize; id += 1) {
      if (id === card.id) continue;
      if (!poolIds.has(id)) {
        complete = false;
        break;
      }
    }
    if (complete) {
      danger += threatPointsForRule("six-run", openCardCount, card);
    }
  }

  let elementFamilyDanger = 0;
  if (sameElementCount >= 5) {
    elementFamilyDanger = Math.max(
      elementFamilyDanger,
      threatPointsForRule("same-element", openCardCount, card) * (1 + (sameElementCount - 5) * 0.35)
    );
  }
  danger += elementFamilyDanger;

  if (sameElementCount >= 1) {
    const parityPool = publicPool.filter((item) => parityOfCard(item) === parityOfCard(card));
    const colorsWithCard = new Set(parityPool.map((item) => item.element));
    colorsWithCard.add(card.element);
    const monthsWithCard = new Set(parityPool.map((item) => item.animal));
    monthsWithCard.add(card.animal);
    if (colorsWithCard.size >= 5 && monthsWithCard.size >= GAME_CONFIG.winningHandSize) {
      danger += threatPointsForRule("polarity-five-elements", openCardCount, card) * 2;
    }
  }

  for (let start = 0; start < ZODIAC_ORDER.length; start += 1) {
    const windowAnimals = Array.from(
      { length: GAME_CONFIG.winningHandSize },
      (_, index) => ZODIAC_ORDER[(start + index) % ZODIAC_ORDER.length]
    );
    if (!windowAnimals.includes(card.animal)) continue;
    const monthComplete = windowAnimals.every((animal) => (
      animal === card.animal || publicPool.some((item) => item.animal === animal)
    ));
    if (monthComplete) {
      danger += threatPointsForRule("zodiac-run", openCardCount, card);
    }
    const elementComplete = windowAnimals.every((animal) => (
      animal === card.animal || publicPool.some((item) => item.animal === animal && item.element === card.element)
    ));
    if (elementComplete) {
      danger += threatPointsForRule("zodiac-run-element", openCardCount, card);
    }
  }

  const colorsWithCard = new Set(publicPool.map((item) => item.element));
  colorsWithCard.add(card.element);

  if (sameAnimalCount >= 4 && sideAnimalCount >= 1 && colorsWithCard.size >= 5) {
    danger += threatPointsForRule("four-with-neighbors", openCardCount, card) * 1.5;
  }

  const previousCount = publicPool.filter((item) => item.animal === previousAnimal(card.animal)).length;
  const nextCount = publicPool.filter((item) => item.animal === nextAnimal(card.animal)).length;
  if (sameAnimalCount >= 3 && (previousCount >= 2 || nextCount >= 2) && colorsWithCard.size >= 5) {
    danger += threatPointsForRule("four-plus-two-side", openCardCount, card) * 1.3;
  }
  if (sameAnimalCount >= 3 && previousCount >= 1 && nextCount >= 1 && colorsWithCard.size >= 5) {
    danger += threatPointsForRule("four-plus-split-sides", openCardCount, card) * 1.2;
  }

  [previousAnimal(card.animal), nextAnimal(card.animal)].forEach((coreAnimal) => {
    const coreCount = publicPool.filter((item) => item.animal === coreAnimal).length;
    if (coreCount >= 5 && colorsWithCard.size >= 5) {
      danger += threatPointsForRule("four-with-neighbors", openCardCount, card) * 0.75;
    }
    if (coreCount >= 4 && sameAnimalCount >= 1 && colorsWithCard.size >= 5) {
      danger += threatPointsForRule("four-plus-two-side", openCardCount, card);
    }
    const oppositeSideAnimal = coreAnimal === previousAnimal(card.animal)
      ? previousAnimal(coreAnimal)
      : nextAnimal(coreAnimal);
    const oppositeSideCount = publicPool.filter((item) => item.animal === oppositeSideAnimal).length;
    if (coreCount >= 4 && oppositeSideCount >= 1 && sameAnimalCount >= 1 && colorsWithCard.size >= 5) {
      danger += threatPointsForRule("four-plus-split-sides", openCardCount, card);
    }
  });

  if (sameAnimalCount >= 1) {
    let consecutivePairRuns = 0;
    for (let start = 0; start < ZODIAC_ORDER.length; start += 1) {
      const windowAnimals = Array.from(
        { length: 3 },
        (_, index) => ZODIAC_ORDER[(start + index) % ZODIAC_ORDER.length]
      );
      if (!windowAnimals.includes(card.animal)) continue;
      const otherAnimals = windowAnimals.filter((animal) => animal !== card.animal);
      if (otherAnimals.every((animal) => publicPool.filter((item) => item.animal === animal).length >= 2)) {
        consecutivePairRuns += 1;
      }
    }
    if (consecutivePairRuns >= 1) {
      danger += threatPointsForRule("three-animal-pairs", openCardCount, card) * Math.min(2, consecutivePairRuns);
    }
  }

  const consecutiveTripleAnimals = [previousAnimal(card.animal), nextAnimal(card.animal)]
    .filter((animal) => publicPool.filter((item) => item.animal === animal).length >= 3)
    .length;
  if (sameAnimalCount >= 2 && consecutiveTripleAnimals >= 1) {
    danger += threatPointsForRule("two-animal-threes", openCardCount, card) * Math.min(2, consecutiveTripleAnimals);
  }

  const remainder = card.id % 10 || 10;
  for (let start = 0; start < ZODIAC_ORDER.length; start += 1) {
    const targetMonths = alternatingMonthTargets(start);
    if (!targetMonths.includes(card.animal)) continue;
    const alternatingComplete = targetMonths.every((month) => (
      month === card.animal || publicPool.some((item) => item.element === card.element && item.animal === month)
    ));
    if (alternatingComplete) {
      danger += threatPointsForRule("ending-digit-ladder", openCardCount, card) * 2;
    }
  }

  return danger;
}

function calculateHandValue(drawStats, shape) {
  const weights = AI_CONFIG.discardWeights;
  return (
    drawStats.winningDraws * weights.winningDraw +
    drawStats.totalWinningPoints * weights.winningPoint +
    drawStats.bestWinningPoints * weights.bestWinningPoint +
    (drawStats.nearReadyDraws || 0) * weights.nearReadyDraw +
    (drawStats.distanceGainDraws || 0) * weights.distanceGainDraw +
    (drawStats.focusImproveDraws || 0) * weights.focusImproveDraw +
    shape.support * weights.shapeSupport +
    shape.nearRules * weights.nearRule -
    shape.bestDistance * weights.distancePenalty
  );
}

function estimateOpponentCardInterest(playerIndex, card) {
  const player = getPlayer(playerIndex);
  const signals = AI_CONFIG.opponentSignals;
  const openCards = player.openCards;
  const discards = player.discards;

  const openAnimalMatches = openCards.filter((item) => item.animal === card.animal).length;
  const openElementMatches = openCards.filter((item) => item.element === card.element).length;
  const openNeighborMatches = openCards.filter((item) => (
    previousAnimal(item.animal) === card.animal || nextAnimal(item.animal) === card.animal
  )).length;

  const discardAnimalMatches = discards.filter((item) => item.animal === card.animal).length;
  const discardElementMatches = discards.filter((item) => item.element === card.element).length;

  let signal = 1;
  signal += openCards.length * signals.openCardPressure;
  signal += openAnimalMatches * signals.openAnimalBonus;
  signal += openElementMatches * signals.openElementBonus;
  signal += openNeighborMatches * signals.sideAnimalBonus;

  signal -= Math.min(
    signals.maxDiscardRelief,
    discardAnimalMatches * signals.discardAnimalRelief +
      discardElementMatches * signals.discardElementRelief
  );

  if (player.seat === "East") {
    signal += signals.dealerPressure;
  }

  const visibleLeaderPoints = Math.max(...state.players.map((entry) => entry.points));
  const trailingGap = Math.max(0, visibleLeaderPoints - player.points);
  signal += Math.min(signals.maxTrailingPressure, trailingGap * signals.trailingPointFactor);

  return Math.max(signals.minSignal, Math.min(signal, signals.maxSignal));
}

function estimateOpponentDiscardDanger(playerIndex, card, publicPool) {
  const baseDanger = estimatePublicDiscardDanger(card, publicPool, getPlayer(playerIndex).openCards.length);
  const interest = estimateOpponentCardInterest(playerIndex, card);
  return {
    playerIndex,
    baseDanger,
    interest,
    danger: baseDanger * interest,
  };
}

function estimateDiscardDangerProfile(discarderIndex, card, publicPool) {
  const detail = opponentsInRonOrder(discarderIndex)
    .map((playerIndex) => estimateOpponentDiscardDanger(playerIndex, card, publicPool));
  const total = detail.reduce((sum, entry) => sum + entry.danger, 0);
  return {
    detail,
    total,
    average: detail.length ? total / detail.length : 0,
    max: detail.reduce((best, entry) => Math.max(best, entry.danger), 0),
  };
}

function estimateOpponentClaimPressure(playerIndex, discarderIndex, card, publicPool) {
  const player = getPlayer(playerIndex);
  const claimSignals = AI_CONFIG.claimSignals;
  if (!player.hand.length) {
    return {
      playerIndex,
      chi: 0,
      pon: 0,
      kan: 0,
      total: 0,
    };
  }

  const interest = estimateOpponentCardInterest(playerIndex, card);
  const sameAnimalOpen = player.openCards.filter((item) => item.animal === card.animal).length;
  const sameAnimalDiscards = player.discards.filter((item) => item.animal === card.animal).length;
  const unseenSameAnimal = publicPool.filter((item) => item.animal === card.animal).length;
  const visibleLeaderPoints = Math.max(...state.players.map((entry) => entry.points));
  const isLeader = player.points === visibleLeaderPoints;
  const isDealer = player.seat === "East";
  const discardRelief = Math.min(
    claimSignals.maxDiscardRelief,
    sameAnimalDiscards * claimSignals.discardAnimalRelief
  );
  const threatBoost = 1
    + (isDealer ? claimSignals.dealerThreatBonus : 0)
    + (isLeader ? claimSignals.leaderThreatBonus : 0);

  let chi = 0;
  if (playerIndex === chiPlayerIndexFor(discarderIndex)) {
    chi = (
      claimSignals.nextChiBase +
      interest * claimSignals.nextChiInterest +
      sameAnimalOpen * claimSignals.nextChiAnimalBonus
    ) * threatBoost * (1 - discardRelief * 0.5);
  }

  function estimateSetClaimPressure(type, neededTotal) {
    const hiddenNeed = Math.max(0, neededTotal - sameAnimalOpen);
    if (hiddenNeed >= claimSignals.hiddenNeedFactors.length) return 0;
    if (unseenSameAnimal < hiddenNeed) return 0;
    const base = type === "kan" ? claimSignals.kanBase : claimSignals.ponBase;
    const availability = unseenSameAnimal * claimSignals.sameAnimalDepthBonus;
    return (
      base +
      interest * claimSignals.claimInterest +
      sameAnimalOpen * claimSignals.openAnimalBonus +
      availability
    ) * claimSignals.hiddenNeedFactors[hiddenNeed] * threatBoost * (1 - discardRelief);
  }

  const pon = estimateSetClaimPressure("pon", 3);
  const kan = estimateSetClaimPressure("kan", 4);
  return {
    playerIndex,
    chi,
    pon,
    kan,
    total: chi + pon + kan,
  };
}

function estimateClaimPressureProfile(discarderIndex, card, publicPool) {
  const detail = opponentsInRonOrder(discarderIndex)
    .map((playerIndex) => estimateOpponentClaimPressure(playerIndex, discarderIndex, card, publicPool));
  const total = detail.reduce((sum, entry) => sum + entry.total, 0);
  return {
    detail,
    total,
    average: detail.length ? total / detail.length : 0,
    max: detail.reduce((best, entry) => Math.max(best, entry.total), 0),
  };
}

function rankLookaheadDraws(playerIndex, concealedHand, openCards, publicDrawPool) {
  return publicDrawPool
    .map((drawCard) => {
      const fullHand = getFullHand(playerIndex, concealedHand.concat(drawCard), openCards);
      const winningLayouts = findValidWinningLayouts(fullHand, openCards.length);
      if (winningLayouts.length) {
        return {
          drawCard,
          priority: 100000 + totalLayoutPoints(chooseBestLayout(winningLayouts) || []),
        };
      }

      const shape = evaluateHandShape(fullHand, openCards.length);
      const focus = evaluateRuleFocus(shape);
      return {
        drawCard,
        priority:
          shape.support * 2 +
          shape.nearRules * 6 +
          focus.primary * 14 +
          focus.gap * 8 -
          shape.bestDistance * 52,
      };
    })
    .sort((a, b) => {
      if (b.priority !== a.priority) return b.priority - a.priority;
      return b.drawCard.id - a.drawCard.id;
    });
}

function selectLookaheadDraws(playerIndex, concealedHand, openCards, publicDrawPool) {
  const shape = evaluateHandShape(getFullHand(playerIndex, concealedHand, openCards), openCards.length);
  if (
    publicDrawPool.length <= AI_CONFIG.lookaheadExactPoolMax ||
    shape.bestDistance <= AI_CONFIG.lookaheadExactDistance
  ) {
    return publicDrawPool.slice();
  }

  return rankLookaheadDraws(playerIndex, concealedHand, openCards, publicDrawPool)
    .slice(0, Math.min(AI_CONFIG.lookaheadDrawSample, publicDrawPool.length))
    .map((entry) => entry.drawCard);
}

function evaluateLookaheadContinuation(
  playerIndex,
  concealedHand,
  openCards,
  extraKnownCards = [],
  context = PUBLIC_AI_CONTEXT
) {
  const drawPool = getDrawPoolForDecision(playerIndex, concealedHand, openCards, extraKnownCards, context);
  if (!drawPool.length) {
    return {
      averageScore: 0,
      peakScore: 0,
      sampleCount: 0,
    };
  }

  const sampledDraws = selectLookaheadDraws(playerIndex, concealedHand, openCards, drawPool);
  const maxSampleCount = context.lookaheadDepth > 1
    ? AI_CONFIG.lookaheadDrawSample
    : AI_CONFIG.lookaheadRecursiveDrawSample;
  const trimmedDraws = sampledDraws.slice(0, Math.min(maxSampleCount, sampledDraws.length));
  let totalScore = 0;
  let peakScore = 0;
  const nextContext = descendDecisionContext(context);

  trimmedDraws.forEach((drawCard) => {
    const simulatedConcealed = sortCardsForDisplay(concealedHand.concat(drawCard));
    const winningLayouts = findValidWinningLayouts(
      getFullHand(playerIndex, simulatedConcealed, openCards),
      openCards.length
    );
    let futureScore = 0;

    if (winningLayouts.length) {
      const points = totalLayoutPoints(chooseBestLayout(winningLayouts) || []);
      futureScore = AI_CONFIG.lookaheadImmediateWinBase + points * AI_CONFIG.lookaheadImmediateWinPoint;
    } else {
      const futureChoice = chooseAIDiscardWithContext(
        playerIndex,
        simulatedConcealed,
        openCards,
        extraKnownCards.concat(drawCard),
        nextContext.lookaheadDepth > 0,
        nextContext
      );
      futureScore = futureChoice?.score || 0;
    }

    totalScore += futureScore;
    peakScore = Math.max(peakScore, futureScore);
  });

  return {
    averageScore: totalScore / trimmedDraws.length,
    peakScore,
    sampleCount: trimmedDraws.length,
  };
}

function evaluateFutureHand(
  playerIndex,
  concealedHand,
  openCards,
  extraKnownCards = [],
  context = PUBLIC_AI_CONTEXT
) {
  const fullHand = getFullHand(playerIndex, concealedHand, openCards);
  const shape = evaluateHandShape(fullHand, openCards.length);
  const focus = evaluateRuleFocus(shape);
  const strategy = evaluateStrategyProfile(playerIndex);
  const weights = AI_CONFIG.discardWeights;
  const drawStats = analyzePublicPotential(
    playerIndex,
    concealedHand,
    openCards,
    extraKnownCards,
    shape,
    focus
  );
  let score =
    calculateHandValue(drawStats, shape) +
    focus.primary * weights.focusPrimary +
    focus.secondary * weights.focusSecondary +
    focus.gap * weights.focusGap +
    openCards.length * weights.openPressureBonus;

  if (shape.bestDistance === 0) {
    score += weights.readyBonus;
  } else if (shape.bestDistance === 1) {
    score += weights.oneAwayBonus;
  }

  return {
    drawStats,
    shape,
    focus,
    strategy,
    score: score * strategy.offense,
  };
}

function analyzeClaimCandidate(baseline, candidate) {
  const baselineByRule = new Map(baseline.shape.distances.map((item) => [item.ruleId, item]));
  const improvedRules = candidate.shape.distances
    .map((item) => {
      const previous = baselineByRule.get(item.ruleId);
      if (!previous) return null;
      const distanceGain = previous.distance - item.distance;
      if (distanceGain <= 0) return null;
      return {
        ruleId: item.ruleId,
        label: item.label,
        points: item.points,
        beforeDistance: previous.distance,
        afterDistance: item.distance,
        distanceGain,
        valueGain: distanceGain * item.points,
      };
    })
    .filter(Boolean)
    .sort((a, b) => {
      if (b.valueGain !== a.valueGain) return b.valueGain - a.valueGain;
      if (a.afterDistance !== b.afterDistance) return a.afterDistance - b.afterDistance;
      if (b.points !== a.points) return b.points - a.points;
      return a.label.localeCompare(b.label);
    });

  return {
    scoreGain: candidate.score - baseline.score,
    bestDistanceGain: baseline.shape.bestDistance - candidate.shape.bestDistance,
    focusGain: candidate.focus.primary - baseline.focus.primary,
    baselinePrimaryRuleId: baseline.focus.primaryRuleId,
    candidatePrimaryRuleId: candidate.focus.primaryRuleId,
    winningDrawGain: candidate.drawStats.winningDraws - baseline.drawStats.winningDraws,
    totalWinningPointGain: candidate.drawStats.totalWinningPoints - baseline.drawStats.totalWinningPoints,
    bestWinningPointGain: candidate.drawStats.bestWinningPoints - baseline.drawStats.bestWinningPoints,
    improvedRules,
    bestRuleImprovement: improvedRules[0] || null,
    primaryRuleChanged: baseline.focus.primaryRuleId !== candidate.focus.primaryRuleId,
  };
}

function shouldTakeClaim(type, analysis, scoreThreshold, strategy = { claimBias: 1 }) {
  const adjustedThreshold = scoreThreshold / Math.max(1, strategy.claimBias || 1);
  const bestRule = analysis.bestRuleImprovement;
  const samePrimaryRule =
    analysis.baselinePrimaryRuleId &&
    analysis.baselinePrimaryRuleId === analysis.candidatePrimaryRuleId;
  const speedGain = analysis.bestDistanceGain >= 1 || analysis.winningDrawGain >= 1;
  const strongSpeedGain = analysis.bestDistanceGain >= 2 || analysis.winningDrawGain >= 2;
  const pointGain =
    analysis.totalWinningPointGain >= 4 ||
    analysis.bestWinningPointGain >= 4;
  const focusGain = analysis.focusGain >= 2;
  const strongRuleJump = Boolean(bestRule && bestRule.valueGain >= 10);

  if (strongSpeedGain || strongRuleJump) return true;
  if (samePrimaryRule && speedGain) return true;
  if ((type === "pon" || type === "kan") && speedGain && (pointGain || focusGain)) return true;
  if (type === "chi" && analysis.bestDistanceGain >= 1 && (focusGain || pointGain)) return true;
  if (!speedGain && !pointGain && !focusGain) return false;
  return analysis.scoreGain >= adjustedThreshold;
}

function shouldTakeChiClaim(baseline, candidate, analysis, strategy) {
  const adjustedThreshold = AI_CONFIG.chiThreshold / Math.max(1, strategy.claimBias || 1);
  const samePrimaryRule =
    analysis.baselinePrimaryRuleId &&
    analysis.baselinePrimaryRuleId === analysis.candidatePrimaryRuleId;
  const handIsAlreadyClose = baseline.shape.bestDistance <= 2;
  const reachesReady = candidate.shape.bestDistance <= 1;
  const strongSpeedGain = analysis.bestDistanceGain >= 2 || analysis.winningDrawGain >= 2;
  const decentSpeedGain = analysis.bestDistanceGain >= 1 || analysis.winningDrawGain >= 1;
  const strongFocusGain = analysis.focusGain >= 4;
  const strongPointGain =
    analysis.totalWinningPointGain >= 8 ||
    analysis.bestWinningPointGain >= 6;
  const linePreserveGain = samePrimaryRule && (decentSpeedGain || strongFocusGain);
  const safeEnoughToOpen = candidate.publicDanger <= 140 || reachesReady || strongSpeedGain;

  if (!safeEnoughToOpen) return false;
  if (strongSpeedGain && (samePrimaryRule || strongFocusGain || strongPointGain)) return true;
  if (handIsAlreadyClose && reachesReady && (decentSpeedGain || strongFocusGain)) return true;
  if (linePreserveGain && candidate.score >= baseline.score + adjustedThreshold * 0.7) return true;
  if (!decentSpeedGain && !strongFocusGain && !strongPointGain) return false;
  if (!samePrimaryRule && baseline.shape.bestDistance >= 3 && !strongSpeedGain) return false;
  return analysis.scoreGain >= adjustedThreshold;
}

function claimTargetLabel(candidate, analysis) {
  if (analysis.bestRuleImprovement?.label) return analysis.bestRuleImprovement.label;
  return getRuleById(candidate.focus.primaryRuleId)?.label || "";
}

function evaluateAIDiscardOptions(
  playerIndex,
  concealedHand = getPlayer(playerIndex).hand,
  openCards = getPlayer(playerIndex).openCards,
  extraKnownCards = [],
  includeLookahead = true,
  context = PUBLIC_AI_CONTEXT
) {
  const weights = AI_CONFIG.discardWeights;
  const strategy = evaluateStrategyProfile(playerIndex);
  const baselineFullHand = getFullHand(playerIndex, concealedHand, openCards);
  const baselineShape = evaluateHandShape(baselineFullHand, openCards.length);
  const baselineFocus = evaluateRuleFocus(baselineShape);

  return concealedHand.map((card) => {
    const nextHand = removeCardById(concealedHand, card.id).next;
    const publicPool = publicRemainingCardsFor(playerIndex, nextHand, openCards, extraKnownCards.concat(card));
    const dangerProfile = estimateDiscardDangerProfile(playerIndex, card, publicPool);
    const claimPressure = estimateClaimPressureProfile(playerIndex, card, publicPool);
    const future = evaluateFutureHand(playerIndex, nextHand, openCards, extraKnownCards.concat(card), PUBLIC_AI_CONTEXT);
    const shape = future.shape;
    const focus = future.focus;
    const drawStats = future.drawStats;
    const continuityScore = evaluateDiscardContinuity(baselineShape, baselineFocus, shape, focus);
    const score =
      future.score +
      continuityScore -
      (dangerProfile.average * weights.publicDangerPenalty +
        dangerProfile.max * weights.maxOpponentDangerPenalty +
        claimPressure.average * weights.claimPressurePenalty +
        claimPressure.max * weights.maxClaimPressurePenalty) *
        (strategy.defense / strategy.risk);

    return {
      card,
      nextHand,
      drawStats,
      shape,
      focus,
      strategy,
      continuityScore,
      publicDanger: dangerProfile.average,
      dangerProfile,
      claimPressure,
      score,
    };
  }).sort((a, b) => {
    if (b.score !== a.score) return b.score - a.score;
    if (b.focus.primary !== a.focus.primary) return b.focus.primary - a.focus.primary;
    if (b.drawStats.nearReadyDraws !== a.drawStats.nearReadyDraws) {
      return b.drawStats.nearReadyDraws - a.drawStats.nearReadyDraws;
    }
    if (b.drawStats.totalWinningPoints !== a.drawStats.totalWinningPoints) return b.drawStats.totalWinningPoints - a.drawStats.totalWinningPoints;
    if (b.drawStats.winningDraws !== a.drawStats.winningDraws) return b.drawStats.winningDraws - a.drawStats.winningDraws;
    if (a.publicDanger !== b.publicDanger) return a.publicDanger - b.publicDanger;
    if (a.shape.bestDistance !== b.shape.bestDistance) return a.shape.bestDistance - b.shape.bestDistance;
    return b.card.id - a.card.id;
  });
}

function chooseAIDiscard(
  playerIndex,
  concealedHand = getPlayer(playerIndex).hand,
  openCards = getPlayer(playerIndex).openCards,
  extraKnownCards = [],
  includeLookahead = true
) {
  return chooseAIDiscardWithContext(
    playerIndex,
    concealedHand,
    openCards,
    extraKnownCards,
    includeLookahead,
    PUBLIC_AI_CONTEXT
  );
}

function chooseAIDiscardWithContext(
  playerIndex,
  concealedHand = getPlayer(playerIndex).hand,
  openCards = getPlayer(playerIndex).openCards,
  extraKnownCards = [],
  includeLookahead = true,
  context = PUBLIC_AI_CONTEXT
) {
  return evaluateAIDiscardOptions(
    playerIndex,
    concealedHand,
    openCards,
    extraKnownCards,

  )[0];
}

function chooseHardAIDiscard(
  playerIndex,

  openCards = getPlayer(playerIndex).openCards,
  extraKnownCards = [],
  includeLookahead = true
